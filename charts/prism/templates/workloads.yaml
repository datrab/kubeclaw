{{- if ne (int .Values.control.replicas) 1 }}
{{- fail "control.replicas must be 1 while prism-artifacts uses ReadWriteOnce storage" }}
{{- end }}
{{- range $name := list "control" "studio" "worker" }}
{{- $image := index $.Values.images $name }}
apiVersion: apps/v1
kind: Deployment
metadata: { name: prism-{{ $name }} }
spec:
  replicas: {{ (index $.Values $name).replicas }}
  {{- if eq $name "control" }}
  strategy: { type: Recreate }
  {{- end }}
  selector: { matchLabels: { app: prism-{{ $name }} } }
  template:
    metadata:
      labels:
        app: prism-{{ $name }}
        {{- if and $.Values.workerTrust.spiffe.enabled (or (eq $name "control") (eq $name "worker")) }}
        kubeclaw.dev/worker-trust: "true"
        {{- end }}
      {{- if and $.Values.workerTrust.spiffe.enabled (or (eq $name "control") (eq $name "worker")) }}
      annotations:
        checksum/worker-trust: {{ index ((include (print $.Template.BasePath "/configmap-worker-trust.yaml") $) | fromYaml).data (printf "%s.yaml" $name) | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: prism-{{ $name }}
      imagePullSecrets: {{ toYaml $.Values.imagePullSecrets | nindent 8 }}
      automountServiceAccountToken: false
      # The Prism images use the named `node` image user. Kubernetes cannot prove
      # that a named image user is non-root when runAsNonRoot is set, so make the
      # image's numeric runtime identity explicit for every Prism application pod.
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: prism-{{ $name }} } }
      containers:
        - name: {{ $name }}
          image: {{ include "prism.imageRef" $image | quote }}
          imagePullPolicy: {{ $image.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          env:
            - { name: PORT, value: "8080" }
            {{- if and (or (eq $name "control") (eq $name "worker")) (not $.Values.workerTrust.spiffe.enabled) }}
            - name: PRISM_WORKER_SECRET
              valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.runtime }}, key: worker-secret } }
            {{- end }}
            {{- if eq $name "control" }}
            {{- if $.Values.workerTrust.spiffe.enabled }}
            - { name: PRISM_WORKER_URL, value: "http://127.0.0.1:18081" }
            - { name: PRISM_CONTROL_INTERNAL_URL, value: "http://127.0.0.1:18080" }
            - { name: PRISM_AGENT_URL, value: "http://127.0.0.1:18082" }
            {{- end }}
            {{- with $.Values.control.pipelinePreferenceSubject }}
            - name: PRISM_PIPELINE_PREFERENCE_SUBJECT
              value: {{ . | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.database }}, key: runtime-url } }
            - name: PRISM_SESSION_SECRET
              valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.runtime }}, key: session-secret } }
            - name: PRISM_INGRESS_SECRET
              valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.runtime }}, key: ingress-secret } }
            {{- if not $.Values.workerTrust.spiffe.enabled }}
            - name: PRISM_DISPATCH_SECRET
              valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.runtime }}, key: dispatch-secret } }
            {{- end }}
            - { name: PRISM_INGESTION_URL, value: "http://prism-ingestion:8080" }
            - name: PRISM_INGESTION_SECRET
              valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.runtime }}, key: ingestion-secret } }
            {{- end }}
            {{- if eq $name "studio" }}
            - { name: PRISM_CONTROL_URL, value: "http://prism-control:8080" }
            - name: PRISM_INGRESS_SECRET
              valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.runtime }}, key: ingress-secret } }
            {{- end }}
            {{- if eq $name "worker" }}
            - { name: PRISM_CONTROL_INTERNAL_URL, value: {{ ternary "http://127.0.0.1:18080" "http://prism-control:8080" $.Values.workerTrust.spiffe.enabled | quote }} }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.database }}, key: runtime-url } }
            {{- end }}
            {{- if and $.Values.workerTrust.spiffe.enabled (or (eq $name "control") (eq $name "worker")) }}
            - { name: SPIFFE_ENDPOINT_SOCKET, value: {{ printf "unix://%s" $.Values.workerTrust.spiffe.socketPath | quote }} }
            - { name: WORKER_TRUST_SPIFFE_ENABLED, value: "true" }
            {{- if eq $name "control" }}
            - { name: PRISM_TRUSTED_NOVA_SPIFFE_ID, value: {{ printf "spiffe://%s/ns/%s/sa/%s" $.Values.workerTrust.spiffe.trustDomain $.Values.workerTrust.spiffe.novaNamespace $.Values.workerTrust.spiffe.novaServiceAccount | quote }} }
            - { name: PRISM_TRUSTED_TEST_RUNNER_SPIFFE_ID, value: {{ printf "spiffe://%s/ns/%s/sa/prism-test-runner" $.Values.workerTrust.spiffe.trustDomain $.Release.Namespace | quote }} }
            - { name: PRISM_TRUSTED_WORKER_SPIFFE_ID, value: {{ printf "spiffe://%s/ns/%s/sa/prism-worker" $.Values.workerTrust.spiffe.trustDomain $.Release.Namespace | quote }} }
            - { name: PRISM_CONTROL_SPIFFE_ID, value: {{ printf "spiffe://%s/ns/%s/sa/prism-control" $.Values.workerTrust.spiffe.trustDomain $.Release.Namespace | quote }} }
            - { name: PRISM_TRUSTED_AGENT_SPIFFE_ID, value: {{ printf "spiffe://%s/ns/%s/sa/%s" $.Values.workerTrust.spiffe.trustDomain $.Values.workerTrust.spiffe.agentNamespace $.Values.workerTrust.spiffe.agentServiceAccount | quote }} }
            {{- else }}
            - { name: PRISM_TRUSTED_CONTROL_SPIFFE_ID, value: {{ printf "spiffe://%s/ns/%s/sa/prism-control" $.Values.workerTrust.spiffe.trustDomain $.Release.Namespace | quote }} }
            {{- end }}
            {{- end }}
          resources: {{ toYaml (index $.Values $name).resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if eq $name "control" }}
            - { name: artifacts, mountPath: /var/lib/prism/artifacts }
            {{- end }}
          {{- if eq $name "worker" }}
          # The migration is a post-install hook. On the first install the worker
          # must become ready before that hook can create its nonce table.
          {{- end }}
          readinessProbe: { httpGet: { path: {{ ternary "/health" "/ready" (eq $name "worker") | quote }}, port: 8080 }, initialDelaySeconds: 3 }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10 }
        {{- if and $.Values.workerTrust.spiffe.enabled (or (eq $name "control") (eq $name "worker")) }}
        - name: worker-trust-proxy
          image: "{{ $.Values.workerTrust.spiffe.envoy.repository }}:{{ $.Values.workerTrust.spiffe.envoy.tag }}@{{ $.Values.workerTrust.spiffe.envoy.digest }}"
          imagePullPolicy: {{ $.Values.workerTrust.spiffe.envoy.pullPolicy }}
          args: ["-c", {{ printf "/etc/kubeclaw-worker-trust/%s.yaml" $name | quote }}, "--service-cluster", {{ printf "prism-%s" $name | quote }}]
          ports: [{ name: worker-trust, containerPort: 8443, protocol: TCP }]
          readinessProbe:
            tcpSocket: { port: worker-trust }
            initialDelaySeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: worker-trust }
            initialDelaySeconds: 10
            timeoutSeconds: 3
          securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: {{ toYaml $.Values.workerTrust.spiffe.envoy.resources | nindent 12 }}
          volumeMounts:
            - { name: worker-trust-envoy, mountPath: /etc/kubeclaw-worker-trust, readOnly: true }
            - { name: spiffe-workload-api, mountPath: /run/spire/sockets, readOnly: true }
            - { name: worker-trust-tmp, mountPath: /tmp }
        {{- end }}
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 4Gi } }
        {{- if eq $name "control" }}
        - { name: artifacts, persistentVolumeClaim: { claimName: prism-artifacts } }
        {{- end }}
        {{- if and $.Values.workerTrust.spiffe.enabled (or (eq $name "control") (eq $name "worker")) }}
        - { name: worker-trust-envoy, configMap: { name: prism-worker-trust, defaultMode: 0444 } }
        - name: spiffe-workload-api
          csi: { driver: {{ $.Values.workerTrust.spiffe.csiDriver | quote }}, readOnly: true }
        - { name: worker-trust-tmp, emptyDir: { sizeLimit: 64Mi } }
        {{- end }}
---
{{- end }}
{{- range $name := list "studio" "worker" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: prism-{{ $name }} }
spec: { minAvailable: 1, selector: { matchLabels: { app: prism-{{ $name }} } } }
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prism-artifacts
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.artifactStorage.storageClass }}
  storageClassName: {{ .Values.artifactStorage.storageClass | quote }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.artifactStorage.storage }} } }
