apiVersion: v1
kind: Service
metadata: { name: prism-studio }
spec:
  selector: { app: prism-studio }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: prism-control }
spec: { selector: { app: prism-control }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: v1
kind: Service
metadata: { name: prism-worker }
spec: { selector: { app: prism-worker }, ports: [{ port: 8080, targetPort: 8080 }] }
{{- if .Values.ingestion.enabled }}
---
apiVersion: v1
kind: Service
metadata: { name: prism-ingestion }
spec: { selector: { app: prism-ingestion }, ports: [{ port: 8080, targetPort: 8080 }] }
{{- end }}
{{- if .Values.tailscale.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: prism-studio }
spec:
  ingressClassName: tailscale
  defaultBackend: { service: { name: prism-studio, port: { number: 80 } } }
  tls: [{ hosts: [{{ .Values.tailscale.hostname | quote }}] }]
{{- end }}
