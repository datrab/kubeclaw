{{- if .Values.postgresql.enabled }}
{{- $recovery := .Values.backup.recovery }}
{{- if $recovery }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$" (required "backup.recovery.runId is required" $recovery.runId)) }}
{{- fail "backup.recovery.runId must be a short DNS label" }}
{{- end }}
{{- range $key := list "verificationCronJobUid" "databaseProofCronJobUid" }}
{{- if not (regexMatch "^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$" (required (printf "backup.recovery.%s is required" $key) (index $recovery $key))) }}
{{- fail (printf "backup.recovery.%s must be an existing CronJob UID" $key) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prism-backup-script
  {{- if $recovery }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  {{- end }}
data:
  prism-backup.sh: |
{{ .Files.Get "files/prism-backup.sh" | indent 4 }}
{{- range $mode := list "backup" "verify" "database-proof" }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: {{ if eq $mode "backup" }}prism-backup{{ else if eq $mode "verify" }}prism-backup-verification{{ else }}prism-restore-proof{{ end }}
spec:
  schedule: {{ if eq $mode "backup" }}{{ $.Values.backup.schedule | quote }}{{ else if eq $mode "verify" }}{{ $.Values.backup.verificationSchedule | quote }}{{ else }}{{ $.Values.backup.databaseProofSchedule | quote }}{{ end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
{{ include "prism.backupJobSpec" (dict "Values" $.Values "Files" $.Files "mode" $mode) | indent 6 }}
{{- end }}
{{- if $recovery }}
{{- range $run := list (dict "mode" "verify" "cronJob" "prism-backup-verification" "uid" $recovery.verificationCronJobUid "wave" "-2") (dict "mode" "database-proof" "cronJob" "prism-restore-proof" "uid" $recovery.databaseProofCronJobUid "wave" "-1") }}
---
# Explicit recovery for existing CronJobs only. Their controller records a
# successful owned Job, including an adopted manual run, in lastSuccessfulTime.
# Keep completion evidence until the controller observes it; TTL bounds retention.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-recovery-%s" $run.cronJob $recovery.runId }}
  ownerReferences:
    - apiVersion: batch/v1
      kind: CronJob
      name: {{ $run.cronJob }}
      uid: {{ $run.uid | quote }}
      controller: true
      blockOwnerDeletion: false
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: {{ $run.wave | quote }}
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
{{ include "prism.backupJobSpec" (dict "Values" $.Values "Files" $.Files "mode" $run.mode) | indent 2 }}
{{- end }}
{{- end }}
{{- end }}
