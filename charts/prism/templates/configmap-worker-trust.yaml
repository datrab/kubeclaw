              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: default
                    sds_config:
                      resource_api_version: V3
                      api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }] }
                combined_validation_context:
                  default_validation_context: { match_typed_subject_alt_names: [{ san_type: URI, matcher: { exact: {{ printf "spiffe://%s/ns/%s/sa/prism-control" $trustDomain $namespace | quote }} } }] }
                  validation_context_sds_secret_config:
                    name: {{ printf "spiffe://%s" $trustDomain | quote }}
                    sds_config:
                      resource_api_version: V3
                      api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }] }
  runner.yaml: |
    node: { id: {{ printf "prism-test-runner.%s" $namespace | quote }}, cluster: prism-test-runner }
    admin: { address: { socket_address: { address: 127.0.0.1, port_value: 9901 } } }
    static_resources:
      listeners:
        - name: control-egress
          address: { socket_address: { address: 127.0.0.1, port_value: 18443 } }
          filter_chains: [{ filters: [{ name: envoy.filters.network.tcp_proxy, typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy, stat_prefix: control-egress, cluster: control-mtls } }] }]
        - name: prism-agent-egress
          address: { socket_address: { address: 127.0.0.1, port_value: 18444 } }
          filter_chains: [{ filters: [{ name: envoy.filters.network.tcp_proxy, typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy, stat_prefix: prism-agent-egress, cluster: prism-agent-mtls } }] }]
      clusters:
