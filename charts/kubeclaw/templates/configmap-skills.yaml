{{/*
ConfigMap for user-provided custom skills.
Only created if customSkills are defined in values.yaml.

KubeClaw system skills (redis.ts, memory.js, pipeline.ts, etc.) are delivered by
code bundles to /app/skills and do NOT need to be in a ConfigMap.

This ConfigMap is for additional user-defined skills that overlay on top of /app/skills.
It is extension-only: the init container rejects protected core runtime paths, so
customSkills cannot be used as a compatibility patch path for pipeline/common/Nova/Buster runtime files.
*/}}
{{- if .Values.customSkills }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeclaw.fullname" . }}-skills
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.customSkills }}
  {{ $name }}: |
{{ $content | indent 4 }}
  {{- end }}
{{- end }}
