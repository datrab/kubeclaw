{{/*
ConfigMap for user-provided custom skills.
Only created if customSkills are defined in values.yaml.

KubeClaw system skills (redis.js, memory.js, pipeline.js, etc.) are baked into the
Docker image at /app/skills-kubeclaw/ and do NOT need to be in a ConfigMap.

This ConfigMap is for additional user-defined skills that overlay on top.
*/}}
{{- if .Values.customSkills }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeclaw.fullname" . }}-skills
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.customSkills }}
  {{ $name }}: |
{{ $content | indent 4 }}
  {{- end }}
{{- end }}
