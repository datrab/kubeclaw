{{- if and .Values.busterNamespaceBroker.enabled (eq .Values.agentRole "buster") -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubeclaw.fullname" . }}-namespace-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeclaw.fullname" . }}-controller-secrets
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeclaw.fullname" . }}-namespace-deployer
rules:
  # Deployer subjects are explicitly allowlisted trusted agents. They need full
  # Service lifecycle access for Helm; external Service forms are rejected at
  # the broker manifest boundary because Kubernetes RBAC cannot filter spec.type.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  # A deployer can already project any Secret into a Pod it creates. Direct
  # read access avoids that indirect path for copied, lease-scoped credentials.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeclaw.fullname" . }}-namespace-tester
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeclaw.fullname" . }}-namespace-controller
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
rules:
  - apiGroups: ["{{ .Values.busterNamespaceBroker.leaseApiGroup }}"]
    resources: ["busternamespaceleases"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["{{ .Values.busterNamespaceBroker.leaseApiGroup }}"]
    resources: ["busternamespaceleases/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["create", "get", "delete", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "get", "delete", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "delete", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "delete", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames:
      - {{ include "kubeclaw.fullname" . }}-controller-secrets
      - {{ include "kubeclaw.fullname" . }}-namespace-deployer
      - {{ include "kubeclaw.fullname" . }}-namespace-tester
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeclaw.fullname" . }}-namespace-controller
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeclaw.fullname" . }}-namespace-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeclaw.fullname" . }}-namespace-controller
    namespace: {{ .Release.Namespace }}
---
{{- if .Values.busterNamespaceBroker.controller.allowedSourceSecrets }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeclaw.fullname" . }}-namespace-controller-source-secrets
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml .Values.busterNamespaceBroker.controller.allowedSourceSecrets | nindent 6 }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeclaw.fullname" . }}-namespace-controller-source-secrets
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeclaw.fullname" . }}-namespace-controller-source-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeclaw.fullname" . }}-namespace-controller
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeclaw.fullname" . }}-namespace-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
    kubeclaw/controller: buster-namespace-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeclaw
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: buster-namespace-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeclaw
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: buster-namespace-controller
        kubeclaw/role: {{ .Values.agentRole }}
    spec:
      serviceAccountName: {{ include "kubeclaw.fullname" . }}-namespace-controller
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: controller
          image: "{{ .Values.busterNamespaceBroker.controller.image.repository }}:{{ .Values.busterNamespaceBroker.controller.image.tag }}"
          imagePullPolicy: {{ .Values.busterNamespaceBroker.controller.image.pullPolicy }}
          command:
            - /app/buster-namespace-controller
          env:
            - name: KUBECLAW_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: BUSTER_CONTROLLER_SERVICE_ACCOUNT
              value: {{ printf "%s-namespace-controller" (include "kubeclaw.fullname" .) | quote }}
            - name: BUSTER_SECRET_ROLE_NAME
              value: {{ printf "%s-controller-secrets" (include "kubeclaw.fullname" .) | quote }}
            - name: BUSTER_DEPLOYER_ROLE_NAME
              value: {{ printf "%s-namespace-deployer" (include "kubeclaw.fullname" .) | quote }}
            - name: BUSTER_TESTER_ROLE_NAME
              value: {{ printf "%s-namespace-tester" (include "kubeclaw.fullname" .) | quote }}
            - name: BUSTER_ALLOWED_ACCESS_JSON
              {{- $allowedAccess := list -}}
              {{- range .Values.busterNamespaceBroker.controller.allowedAccess -}}
              {{- $subject := .subject -}}
              {{- if not (contains "/" $subject) -}}
              {{- $subject = printf "%s/%s" $.Release.Namespace $subject -}}
              {{- end -}}
              {{- $allowedAccess = append $allowedAccess (dict "subject" $subject "modes" .modes) -}}
              {{- end }}
              value: {{ toJson $allowedAccess | quote }}
            - name: BUSTER_ALLOWED_SOURCE_SECRETS
              value: {{ join "," .Values.busterNamespaceBroker.controller.allowedSourceSecrets | quote }}
            - name: BUSTER_LEASE_API_GROUP
              value: {{ .Values.busterNamespaceBroker.leaseApiGroup | quote }}
            - name: BUSTER_LEASE_API_VERSION
              value: {{ .Values.busterNamespaceBroker.leaseApiVersion | quote }}
            - name: BUSTER_ALLOWED_NAMESPACE_PREFIXES
              value: {{ join "," .Values.busterNamespaceBroker.allowedPrefixes | quote }}
            - name: BUSTER_DEFAULT_TTL_SECONDS
              value: {{ .Values.busterNamespaceBroker.defaultTtlSeconds | quote }}
            - name: BUSTER_MAX_TTL_SECONDS
              value: {{ .Values.busterNamespaceBroker.maxTtlSeconds | quote }}
            - name: BUSTER_CONTROLLER_POLL_MS
              value: {{ .Values.busterNamespaceBroker.controller.pollIntervalMs | quote }}
          resources:
            {{- toYaml .Values.busterNamespaceBroker.controller.resources | nindent 12 }}
{{- end }}
