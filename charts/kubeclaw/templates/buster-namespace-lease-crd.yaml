{{- if and .Values.busterNamespaceBroker.enabled (eq .Values.agentRole "buster") -}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: busternamespaceleases.{{ .Values.busterNamespaceBroker.leaseApiGroup }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
spec:
  group: {{ .Values.busterNamespaceBroker.leaseApiGroup }}
  scope: Namespaced
  names:
    plural: busternamespaceleases
    singular: busternamespacelease
    kind: BusterNamespaceLease
    shortNames:
      - bnl
  versions:
    - name: {{ .Values.busterNamespaceBroker.leaseApiVersion }}
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Namespace
          type: string
          jsonPath: .status.namespaceName
        - name: Cleanup
          type: string
          jsonPath: .spec.cleanupPolicy
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                namespaceName:
                  type: string
                  pattern: '^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$'
                namespacePrefix:
                  type: string
                  enum: ["test"]
                runId:
                  type: string
                project:
                  type: string
                purpose:
                  type: string
                  enum: ["pretest", "gate", "final-preview"]
                capabilityProfile:
                  type: string
                  enum: ["default", "network", "storage"]
                serviceName:
                  type: string
                cleanupPolicy:
                  type: string
                  enum: ["delete", "keep"]
                ttlSeconds:
                  type: integer
                  minimum: 60
                secretsToCopy:
                  type: array
                  items:
                    type: string
                    pattern: '^[A-Za-z0-9._-]+$'
                exposure:
                  type: object
                  properties:
                    provider:
                      type: string
                      enum: ["off", "tailscale-ingress"]
                    hostname:
                      type: string
                      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                    serviceName:
                      type: string
                    servicePort:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    path:
                      type: string
                    credentialsRef:
                      type: string
                    credentialsSecretName:
                      type: string
                    credentialsKeys:
                      type: array
                      items:
                        type: string
                    credentialsDelivery:
                      type: string
                      enum: ["discord"]
                    revealCredentials:
                      type: boolean
              required:
                - namespaceName
                - cleanupPolicy
            status:
              type: object
              properties:
                phase:
                  type: string
                namespaceName:
                  type: string
                serviceAccountName:
                  type: string
                internalUrl:
                  type: string
                previewUrl:
                  type: string
                exposurePhase:
                  type: string
                exposureHostname:
                  type: string
                credentialsRef:
                  type: string
                credentialsAvailable:
                  type: boolean
                expiresAt:
                  type: string
                message:
                  type: string
{{- end }}
