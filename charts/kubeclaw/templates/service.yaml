apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeclaw.fullname" . }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kubeclaw.selectorLabels" . | nindent 4 }}
  ports:
    - name: gateway
      port: {{ .Values.service.gatewayPort }}
      targetPort: {{ .Values.service.gatewayTargetPort }}
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") (gt (int .Values.service.nodePort) 0) }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    {{- if .Values.service.bridgeEnabled }}
    - name: bridge
      port: {{ .Values.service.bridgePort }}
      targetPort: bridge
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") (gt (int .Values.service.bridgeNodePort) 0) }}
      nodePort: {{ .Values.service.bridgeNodePort }}
      {{- end }}
    {{- end }}
    {{- range .Values.service.extraPorts }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: TCP
      {{- if and (eq $.Values.service.type "NodePort") .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
    {{- end }}
