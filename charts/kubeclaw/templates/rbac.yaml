{{- $leaseClientEnabled := and .Values.busterNamespaceBroker.enabled (eq .Values.agentRole "buster") -}}
{{- if and .Values.serviceAccount.create $leaseClientEnabled }}
---
# Buster may request ephemeral namespaces but cannot create/delete namespaces or
# mutate workloads outside broker-created namespace RoleBindings. Other agents
# use the Ops MCP and must never receive a lease-client binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeclaw.fullname" . }}-namespace-lease-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
rules:
  - apiGroups: ["{{ .Values.busterNamespaceBroker.leaseApiGroup }}"]
    resources: ["busternamespaceleases"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["{{ .Values.busterNamespaceBroker.leaseApiGroup }}"]
    resources: ["busternamespaceleases/status"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeclaw.fullname" . }}-namespace-lease-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeclaw.fullname" . }}-namespace-lease-client
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeclaw.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
