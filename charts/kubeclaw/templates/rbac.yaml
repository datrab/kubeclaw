{{- $leaseClientEnabled := and .Values.busterNamespaceBroker.enabled (or (eq .Values.agentRole "buster") .Values.busterNamespaceBroker.leaseClient.enabled) -}}
{{- $verificationReadEnabled := and $leaseClientEnabled .Values.busterNamespaceBroker.leaseClient.verificationRead.enabled -}}
{{- if and .Values.serviceAccount.create $leaseClientEnabled }}
---
# Buster may request ephemeral namespaces but cannot create/delete namespaces or
# mutate workloads outside broker-created namespace RoleBindings. Nova may opt
# into this same lease-client role for real E2E verification without receiving
# direct Kubernetes workload permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeclaw.fullname" . }}-namespace-lease-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
rules:
  - apiGroups: ["{{ .Values.busterNamespaceBroker.leaseApiGroup }}"]
    resources: ["busternamespaceleases"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["{{ .Values.busterNamespaceBroker.leaseApiGroup }}"]
    resources: ["busternamespaceleases/status"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeclaw.fullname" . }}-namespace-lease-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeclaw.fullname" . }}-namespace-lease-client
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeclaw.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.serviceAccount.create $verificationReadEnabled }}
---
# Read-only visibility for Nova's real E2E capability probe. This does not grant
# namespace/workload mutation. Secret access is separately namespace-scoped below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeclaw.fullname" . }}-verification-read
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    resourceNames: ["tailscale"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeclaw.fullname" . }}-verification-read
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeclaw.fullname" . }}-verification-read
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeclaw.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
{{- $operatorNamespace := required "verificationRead.tailscaleOperatorNamespace is required" .Values.busterNamespaceBroker.leaseClient.verificationRead.tailscaleOperatorNamespace }}
{{- $oauthSecret := required "verificationRead.tailscaleOAuthSecretName is required" .Values.busterNamespaceBroker.leaseClient.verificationRead.tailscaleOAuthSecretName }}
{{- $secretReadName := printf "%s-verification-secret-%s" (include "kubeclaw.fullname" .) (printf "%s/%s" .Release.Namespace .Release.Name | sha256sum | trunc 8) }}
# The operator namespace must already exist. The agent release owns only these
# RBAC resources there, not the namespace or the OAuth Secret itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $secretReadName }}
  namespace: {{ $operatorNamespace | quote }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $oauthSecret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $secretReadName }}
  namespace: {{ $operatorNamespace | quote }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $secretReadName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeclaw.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
