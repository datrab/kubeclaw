{{- if .Values.serviceAccount.create -}}
{{- if and .Values.busterNamespaceBroker.enabled (eq .Values.agentRole "buster") }}
---
# Buster may request ephemeral namespaces but cannot create/delete namespaces or
# mutate workloads outside broker-created namespace RoleBindings.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeclaw.fullname" . }}-namespace-lease-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
rules:
  - apiGroups: ["{{ .Values.busterNamespaceBroker.leaseApiGroup }}"]
    resources: ["busternamespaceleases"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["{{ .Values.busterNamespaceBroker.leaseApiGroup }}"]
    resources: ["busternamespaceleases/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeclaw.fullname" . }}-namespace-lease-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeclaw.fullname" . }}-namespace-lease-client
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeclaw.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
---
# Legacy fallback for non-broker Buster deployments. Production Buster values
# should enable busterNamespaceBroker so this broad role is not rendered.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeclaw.fullname" . }}-k8s-tester
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - services
      - endpoints
      - configmaps
      - secrets
      - persistentvolumeclaims
      - serviceaccounts
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeclaw.fullname" . }}-k8s-tester
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeclaw.fullname" . }}-k8s-tester
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeclaw.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
