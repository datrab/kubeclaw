# ConfigMap: lint policy only. Runtime settings stay in the image-owned generation.
# Init copies lint files only; the operator bundle is never copied to the config PVC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeclaw.fullname" . }}-swarm-config
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
data:
  .semgrep.yml: |
{{- if .Values.semgrepConfigYaml }}
{{ .Values.semgrepConfigYaml | indent 4 }}
{{- else }}
{{ .Files.Get "files/config/.semgrep.yml" | indent 4 }}
{{- end }}
  eslint.config.mjs: |
{{- if .Values.eslintConfigMjs }}
{{ .Values.eslintConfigMjs | indent 4 }}
{{- else }}
{{ .Files.Get "files/config/eslint-config.mjs" | indent 4 }}
{{- end }}
  discipline-eslint-plugin.mjs: |
{{ .Files.Get "files/config/discipline-eslint-plugin.mjs" | indent 4 }}
  eslint-type-evidence-config.mjs: |
{{ .Files.Get "files/config/eslint-type-evidence-config.mjs" | indent 4 }}
  eslint-type-evidence-tests-config.mjs: |
{{ .Files.Get "files/config/eslint-type-evidence-tests-config.mjs" | indent 4 }}
  eslint-type-evidence-generated-config.mjs: |
{{ .Files.Get "files/config/eslint-type-evidence-generated-config.mjs" | indent 4 }}
  type-evidence-eslint-plugin.mjs: |
{{ .Files.Get "files/config/type-evidence-eslint-plugin.mjs" | indent 4 }}
  .yamllint.yml: |
{{ .Files.Get "files/config/.yamllint.yml" | indent 4 }}
  .tflint.hcl: |
{{ .Files.Get "files/config/.tflint.hcl" | indent 4 }}
  knip.json: |
{{ .Files.Get "files/config/knip.json" | indent 4 }}
  jscpd.json: |
{{ .Files.Get "files/config/jscpd.json" | indent 4 }}
  jscpd-tests.json: |
{{ .Files.Get "files/config/jscpd-tests.json" | indent 4 }}
  lint-baseline.json: |
{{ .Files.Get "files/config/lint-baseline.json" | indent 4 }}
  lint-policy.json: |
{{ .Files.Get "files/config/lint-policy.json" | indent 4 }}
