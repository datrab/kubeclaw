# ConfigMap: Swarm platform config (swarm.config.json + .semgrep.yml + eslint.config.mjs).
# Init container copies these to /home/node/.openclaw/ (config PVC).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeclaw.fullname" . }}-swarm-config
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
data:
  swarm.config.json: |
{{- if .Values.swarmConfigJson }}
{{ .Values.swarmConfigJson | indent 4 }}
{{- else }}
{{ .Files.Get "files/config/swarm.config.json" | indent 4 }}
{{- end }}
  .semgrep.yml: |
{{- if .Values.semgrepConfigYaml }}
{{ .Values.semgrepConfigYaml | indent 4 }}
{{- else }}
{{ .Files.Get "files/config/.semgrep.yml" | indent 4 }}
{{- end }}
  eslint.config.mjs: |
{{- if .Values.eslintConfigMjs }}
{{ .Values.eslintConfigMjs | indent 4 }}
{{- else }}
{{ .Files.Get "files/config/eslint.config.mjs" | indent 4 }}
{{- end }}
