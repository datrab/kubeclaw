# ConfigMap: Swarm platform config and its canonical lint policy.
# Init container copies these to /home/node/.openclaw/ (config PVC).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeclaw.fullname" . }}-swarm-config
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
data:
  swarm.config.json: |
{{- if .Values.swarmConfigJson }}
{{ .Values.swarmConfigJson | indent 4 }}
{{- else }}
{{ .Files.Get "files/config/swarm.config.json" | indent 4 }}
{{- end }}
  .semgrep.yml: |
{{- if .Values.semgrepConfigYaml }}
{{ .Values.semgrepConfigYaml | indent 4 }}
{{- else }}
{{ .Files.Get "files/config/.semgrep.yml" | indent 4 }}
{{- end }}
  eslint.config.mjs: |
{{- if .Values.eslintConfigMjs }}
{{ .Values.eslintConfigMjs | indent 4 }}
{{- else }}
{{ .Files.Get "files/config/eslint.config.mjs" | indent 4 }}
{{- end }}
  .yamllint.yml: |
{{ .Files.Get "files/config/.yamllint.yml" | indent 4 }}
  .tflint.hcl: |
{{ .Files.Get "files/config/.tflint.hcl" | indent 4 }}
  knip.json: |
{{ .Files.Get "files/config/knip.json" | indent 4 }}
  jscpd.json: |
{{ .Files.Get "files/config/jscpd.json" | indent 4 }}
  jscpd-tests.json: |
{{ .Files.Get "files/config/jscpd-tests.json" | indent 4 }}
  lint-baseline.json: |
{{ .Files.Get "files/config/lint-baseline.json" | indent 4 }}
  lint-policy.json: |
{{ .Files.Get "files/config/lint-policy.json" | indent 4 }}
