# ConfigMap: OpenClaw gateway configuration (openclaw.json)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeclaw.fullname" . }}-config
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "tools": {
          "allow": ["group:openclaw"]
        },
        "port": {{ .Values.gateway.port }},
        "controlUi": {
          "dangerouslyAllowHostHeaderOriginFallback": true
        }
      },
      "acp": {
        "enabled": true,
        "backend": "acpx",
        "defaultAgent": "claude",
        "allowedAgents": ["claude","codex","kimi","gemini","pi"],
        "maxConcurrentSessions": 8,
        "stream": {
          "coalesceIdleMs": 300,
          "maxChunkChars": 1200
        },
        "runtime": {
          "ttlMinutes": 120
        }
      },
      "session": {
        "threadBindings": {
          "enabled": true,
          "idleHours": 24,
          "maxAgeHours": 0
        }
      },
      "commands": {
        "native": "auto",
        "nativeSkills": "auto"
      },
      "plugins": {
        "entries": {
          "discord": {
            "enabled": {{ .Values.discord.enabled }}
          },
          "acpx": {
            "enabled": true,
            "config": {
              "permissionMode": "approve-all",
              "nonInteractivePermissions": "allow"
            }
          }
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": "litellm/{{ .Values.litellm.defaultModel }}"
          },
          "memorySearch": {
            "enabled": true,
            "experimental": {
              "sessionMemory": true
            },
            "provider": "openai",
            "remote": {
              "baseUrl": "{{ .Values.litellm.endpoint }}",
              "apiKey": "__LITELLM_API_KEY__"
            },
            "model": "gemini-embedding-001",
            "store": {
              "vector": { "enabled": true }
            },
            "query": {
              "hybrid": {
                "enabled": true,
                "vectorWeight": 0.7,
                "textWeight": 0.3,
                "mmr": { "enabled": true, "lambda": 0.7 },
                "temporalDecay": { "enabled": true, "halfLifeDays": 30 }
              }
            }
          },
          "contextPruning": {
            "mode": "cache-ttl",
            "ttl": "2h",
            "keepLastAssistants": 5,
            "softTrimRatio": 0.7,
            "hardClearRatio": 0.85
          },
          "compaction": {
            "mode": "safeguard",
            "maxHistoryShare": 0.5,
            "memoryFlush": { "enabled": true }
          },
          "subagents": {
            "maxConcurrent": 8,
            "runTimeoutSeconds": 7200,
            "archiveAfterMinutes": 120
          }
        }
      },
      "models": {
        "mode": "merge",
        "providers": {
          "litellm": {
            "baseUrl": "{{ .Values.litellm.endpoint }}",
            "apiKey": "__LITELLM_API_KEY__",
            "api": "openai-completions",
            "models": [
              {{- range $i, $model := .Values.litellm.models }}
              {{- if $i }},{{ end }}
              {
                "id": "{{ $model.id }}",
                "name": "{{ $model.name }}",
                "reasoning": {{ $model.reasoning | default "false" }},
                "input": ["text", "image"],
                "contextWindow": {{ $model.contextWindow }},
                "maxTokens": {{ $model.maxTokens }}
              }
              {{- end }}
            ]
          }
        }
      },
      "channels": {
        "discord": {
          "enabled": {{ .Values.discord.enabled }},
          "token": "__DISCORD_TOKEN__",
          "groupPolicy": "open",
          "guilds": {
            "*": { "requireMention": false }
          },
          "threadBindings": {
            "enabled": true,
            "spawnAcpSessions": true
          }
        }
      }
    }
