# ConfigMap: OpenClaw gateway configuration (openclaw.json)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeclaw.fullname" . }}-config
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
data:
  openclaw.json: |
    {
      "meta": {
        "lastTouchedVersion": "2026.4.5",
        "lastTouchedAt": "2026-04-06T06:29:30.790Z"
      },
      "wizard": {
        "lastRunAt": "2026-03-26T19:20:27.474Z",
        "lastRunVersion": "2026.3.24",
        "lastRunCommand": "configure",
        "lastRunMode": "local"
      },
      "auth": {
        "profiles": {
          "anthropic:default": {
            "provider": "anthropic",
            "mode": "token"
          },
          "litellm:default": {
            "provider": "litellm",
            "mode": "api_key"
          },
          "openai:d.trabucco@tutamail.com": {
            "provider": "openai",
            "mode": "oauth",
            "email": "d.trabucco@tutamail.com"
          },
          "openai:chatgpt-d.trabucco@tutamail.com": {
            "provider": "openai",
            "mode": "oauth"
          }
        },
        "order": {
          "openai": [
            "openai:d.trabucco@tutamail.com",
            "openai:chatgpt-d.trabucco@tutamail.com"
          ]
        }
      },
      "acp": {
        "enabled": true,
        "backend": "acpx",
        "defaultAgent": "claude",
        "allowedAgents": [
          "claude",
          "codex",
          "kimi",
          "gemini",
          "pi"
        ],
        "maxConcurrentSessions": 20,
        "stream": {
          "coalesceIdleMs": 300,
          "maxChunkChars": 1200
        },
        "runtime": {
          "ttlMinutes": 120
        }
      },
      "models": {
        "mode": "merge",
        "providers": {
          "litellm": {
            "baseUrl": "{{ .Values.litellm.endpoint }}",
            "apiKey": {
              "source": "env",
              "provider": "default",
              "id": "LITELLM_API_KEY"
            },
            "api": "openai-completions",
            "models": [
              {{- range $i, $model := .Values.litellm.models }}
              {{- if $i }},{{ end }}
              {
                "id": "{{ $model.id }}",
                "name": "{{ $model.name }}",
                "reasoning": {{ $model.reasoning | default "false" }},
                "input": ["text", "image"],
                "contextWindow": {{ $model.contextWindow }},
                "maxTokens": {{ $model.maxTokens }}
              }
              {{- end }}
            ]
          }
        }
      },
      "agents": {
        "ownership": "explicit",
        "defaults": {
          "systemAgent": {
            "agentId": "main"
          },
          "thinkingDefault": "off",
          "reasoningDefault": "off",
          "model": {
            "primary": {{ .Values.agent.model.primary | quote }},
            "fallbacks": [
              {{- range $index, $model := .Values.agent.model.fallbacks }}
              {{- if $index }},{{ end }}{{ $model | quote }}
              {{- end }}
            ]
          },
          "models": {
            {{- if ne (.Values.agentRole | default "") "prism" }}
            "anthropic/claude-sonnet-4-6": {},
            "anthropic/claude-opus-4-6": {},
            "openai/gpt-5.4": {
              "agentRuntime": {
                "id": "codex"
              }
            },
            "openai/gpt-5.5-pro": {},
            "openai/gpt-5.5": {
              "agentRuntime": {
                "id": "codex"
              }
            },
            {{- end }}
            "litellm/{{ .Values.litellm.defaultModel }}": {}
          },
          "workspace": "/home/node/.openclaw/workspace",
          "embeddedAgent": {
            "executionContract": "strict-agentic"
          },
          "memorySearch": {
            "enabled": true,
            "experimental": {
              "sessionMemory": true
            },
            "provider": "openai",
            "remote": {
              "baseUrl": "{{ .Values.litellm.endpoint }}",
              "apiKey": {
                "source": "env",
                "provider": "default",
                "id": "LITELLM_API_KEY"
              }
            },
            "model": "gemini-embedding-001",
            "store": {
              "vector": {
                "enabled": true
              }
            },
            "query": {
              "hybrid": {
                "enabled": true,
                "vectorWeight": 0.7,
                "textWeight": 0.3,
                "mmr": {
                  "enabled": true,
                  "lambda": 0.7
                },
                "temporalDecay": {
                  "enabled": true,
                  "halfLifeDays": 30
                }
              }
            }
          },
          "contextPruning": {
            "mode": "cache-ttl",
            "ttl": "2h",
            "keepLastAssistants": 5,
            "softTrimRatio": 0.7,
            "hardClearRatio": 0.85
          },
          "compaction": {
            "mode": "safeguard",
            "reserveTokens": 80000,
            "keepRecentTokens": 140000,
            "maxHistoryShare": 0.4,
            "memoryFlush": {
              "enabled": true
            },
            "reserveTokensFloor": 40000
          },
          "subagents": {
            "maxConcurrent": 20,
            "archiveAfterMinutes": 240,
            "runTimeoutSeconds": 43200,
            "maxSpawnDepth": 3
          },
          "contextInjection": "never"
        },
        "entries": {
          "main": {
            "subagents": {
              "allowAgents": [
                "*"
              ]
            },
            "skills": [],
            "skillsLimits": {
              "maxSkillsPromptChars": 1200
            }
          },
          "codex": {}
        }
      },
      "tools": {
        "profile": "coding",
        "sessions": {
          "visibility": "all"
        },
        "sessions_spawn": {
          "attachments": {
            "enabled": true
          }
        },
        "exec": {
          "timeoutSec": 604800,
          "security": "full",
          "ask": "off"
        },
        "agentToAgent": {
          "enabled": true
        }
      },
      "commands": {
        "native": "auto",
        "nativeSkills": "auto",
        "restart": true,
        "ownerDisplay": "raw",
        "ownerAllowFrom": {{ .Values.commands.ownerAllowFrom | default list | toJson }},
        "allowFrom": {
          "discord": {{ .Values.commands.allowFromDiscord | default list | toJson }}
        }
      },
      "session": {
        "dmScope": "per-channel-peer",
        "resetByType": {
          "group": {
            "mode": "idle",
            "idleMinutes": 43200
          }
        },
        "threadBindings": {
          "enabled": true,
          "idleHours": 999,
          "maxAgeHours": 0
        }
      },
      "channels": {
        "discord": {
          "enabled": {{ .Values.discord.enabled }},
          "token": {
            "source": "env",
            "provider": "default",
            "id": "DISCORD_TOKEN"
          },
          "groupPolicy": "open",
          "streaming": {
            "mode": "partial"
          },
          "eventQueue": {
            "listenerTimeout": 120000
          },
          "inboundWorker": {
            "runTimeoutMs": 43200000
          },
          "retry": {
            "attempts": 3,
            "minDelayMs": 500,
            "maxDelayMs": 30000,
            "jitter": 0.1
          },
          "guilds": {
            "*": {
              "requireMention": false
            }
          },
          "threadBindings": {
            "enabled": true,
            "idleHours": 999,
            "spawnSessions": true
          },
          "execApprovals": {
            "enabled": false,
            "approvers": {{ .Values.discord.execApprovers | default list | toJson }},
            "target": "dm"
          }
        }
      },
      "gateway": {
        "port": {{ .Values.gateway.port }},
        "mode": "local",
        "bind": "loopback",
        "controlUi": {
          "dangerouslyAllowHostHeaderOriginFallback": true
        },
        "auth": {
          "mode": "token",
          "token": {
            "source": "env",
            "provider": "default",
            "id": "OPENCLAW_GATEWAY_TOKEN"
          }
        },
        "tools": {
          "allow": [
            "sessions_spawn",
            "sessions_send",
            "session_status",
            "group:openclaw"
          ]
        },
        "channelStaleEventThresholdMinutes": 1440,
        "channelMaxRestartsPerHour": 3,
        "tailscale": {
          "mode": "off",
          "resetOnExit": false
        }
      },
      "plugins": {
        "entries": {
          "discord": {
            "enabled": {{ .Values.discord.enabled }}
          },
          "acpx": {
            "enabled": true,
            "config": {
              "permissionMode": "approve-all"
            }
          },
          "openai": {
            "enabled": {{ ne (.Values.agentRole | default "") "prism" }}
          },
          "anthropic": {
            "enabled": {{ ne (.Values.agentRole | default "") "prism" }}
          },
          "litellm": {
            "enabled": true
          },
          "codex": {
            "enabled": true
          },
          "kubeclaw-agent-observer": {
            "enabled": {{ eq (.Values.agentRole | default "") "buster" }},
            "config": {
              "enabled": {{ eq (.Values.agentRole | default "") "buster" }},
              "redisNetworkIsolation": "isolated",
              "maxEventBytes": 3145728,
              "maxQueuePerStream": 100,
              "redisCommandTimeoutMs": 5000,
              "streamMaxLen": 10000,
              "deadLetterMaxLen": 1000,
              "controlWriteMaxAttempts": 3,
              "controlWriteRetryBaseMs": 100,
              "controlWriteRetryMaxMs": 1000,
              "hookPriority": -100,
              "hookTimeoutMs": 1000
            },
            "hooks": {
              "allowConversationAccess": true
            }
          }
          {{- if eq (.Values.agentRole | default "") "prism" }},
          "kubeclaw-prism": {
            "enabled": true,
            "config": {
              "controlUrl": "http://127.0.0.1:28080"
            }
          }
          {{- end }}
        }
      },
      "messages": {
        "groupChat": {
          "visibleReplies": "automatic"
        }
      }
    }
