# ConfigMap: OpenClaw gateway configuration (openclaw.json)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeclaw.fullname" . }}-config
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "tools": {
          "allow": ["sessions_spawn", "sessions_send", "session_status", "group:openclaw"]
        },
        "port": {{ .Values.gateway.port }},
        "controlUi": {
          "dangerouslyAllowHostHeaderOriginFallback": true
        },
        "auth": {
          "mode": "token",
          "token": {
            "source": "env",
            "provider": "default",
            "id": "OPENCLAW_GATEWAY_TOKEN"
          }
        },
        "channelStaleEventThresholdMinutes": 1440,
        "channelMaxRestartsPerHour": 3,
        "tailscale": {
          "mode": "off",
          "resetOnExit": false
        }
      },
      "acp": {
        "enabled": true,
        "backend": "acpx",
        "defaultAgent": "claude",
        "allowedAgents": ["claude","codex","kimi","gemini","pi"],
        "maxConcurrentSessions": 20,
        "stream": {
          "coalesceIdleMs": 300,
          "maxChunkChars": 1200
        },
        "runtime": {
          "ttlMinutes": 120
        }
      },
      "session": {
        "dmScope": "per-channel-peer",
        "threadBindings": {
          "enabled": true,
          "idleHours": 999,
          "maxAgeHours": 0
        }
      },
      "tools": {
        "profile": "coding",
        "sessions": {
          "visibility": "all"
        },
        "sessions_spawn": {
          "attachments": {
            "enabled": true
          }
        }
      },
      "commands": {
        "native": "auto",
        "nativeSkills": "auto",
        "restart": true,
        "ownerDisplay": "raw",
        "allowFrom": {
          "discord": {{ .Values.commands.allowFromDiscord | default list | toJson }}
        }
      },
      "plugins": {
        "entries": {
          "discord": {
            "enabled": {{ .Values.discord.enabled }}
          },
          "acpx": {
            "enabled": true,
            "config": {
              "permissionMode": "approve-all",
              "command": "acpx"
            }
          }
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": "litellm/{{ .Values.litellm.defaultModel }}"
          },
          "memorySearch": {
            "enabled": true,
            "experimental": {
              "sessionMemory": true
            },
            "provider": "openai",
            "remote": {
              "baseUrl": "{{ .Values.litellm.endpoint }}",
              "apiKey": "__LITELLM_API_KEY__"
            },
            "model": "gemini-embedding-001",
            "store": {
              "vector": { "enabled": true }
            },
            "query": {
              "hybrid": {
                "enabled": true,
                "vectorWeight": 0.7,
                "textWeight": 0.3,
                "mmr": { "enabled": true, "lambda": 0.7 },
                "temporalDecay": { "enabled": true, "halfLifeDays": 30 }
              }
            }
          },
          "contextPruning": {
            "mode": "cache-ttl",
            "ttl": "2h",
            "keepLastAssistants": 5,
            "softTrimRatio": 0.7,
            "hardClearRatio": 0.85
          },
          "thinkingDefault": "high",
          "compaction": {
            "mode": "safeguard",
            "reserveTokens": 80000,
            "keepRecentTokens": 140000,
            "maxHistoryShare": 0.4,
            "memoryFlush": { "enabled": true }
          },
          "subagents": {
            "maxConcurrent": 20,
            "runTimeoutSeconds": 7200,
            "archiveAfterMinutes": 240
          }
        },
        "list": [
          {
            "id": "main",
            "subagents": {
              "allowAgents": ["*"]
            }
          },
          {
            "id": "codex"
          }
        ]
      },
      "models": {
        "mode": "merge",
        "providers": {
          "litellm": {
            "baseUrl": "{{ .Values.litellm.endpoint }}",
            "apiKey": "__LITELLM_API_KEY__",
            "api": "openai-completions",
            "models": [
              {{- range $i, $model := .Values.litellm.models }}
              {{- if $i }},{{ end }}
              {
                "id": "{{ $model.id }}",
                "name": "{{ $model.name }}",
                "reasoning": {{ $model.reasoning | default "false" }},
                "input": ["text", "image"],
                "contextWindow": {{ $model.contextWindow }},
                "maxTokens": {{ $model.maxTokens }}
              }
              {{- end }}
            ]
          }
        }
      },
      "channels": {
        "discord": {
          "enabled": {{ .Values.discord.enabled }},
          "token": "__DISCORD_TOKEN__",
          "groupPolicy": "open",
          "streaming": "off",
          "guilds": {
            "*": { "requireMention": false }
          },
          "threadBindings": {
            "enabled": true,
            "idleHours": 999,
            "spawnAcpSessions": true
          },
          "execApprovals": {
            "enabled": true,
            "approvers": {{ .Values.discord.execApprovers | default list | toJson }},
            "target": "dm"
          },
          "retry": {
            "attempts": 3,
            "minDelayMs": 500,
            "maxDelayMs": 30000,
            "jitter": 0.1
          }
        }
      }
    }
