# ConfigMap: OpenClaw gateway configuration (openclaw.json)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeclaw.fullname" . }}-config
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
data:
  openclaw.json: |
    {
      "meta": {
        "lastTouchedVersion": "2026.8.2"
      },
      "wizard": {
        "lastRunAt": "2026-03-26T19:20:27.474Z",
        "lastRunVersion": "2026.3.24",
        "lastRunCommand": "configure",
        "lastRunMode": "local"
      },
      "auth": {
        "profiles": {
          "openai:d.trabucco@tutamail.com": {
            "provider": "openai",
            "mode": "oauth",
            "email": "d.trabucco@tutamail.com"
          },
          "openai:chatgpt-d.trabucco@tutamail.com": {
            "provider": "openai",
            "mode": "oauth"
          }
        },
        "order": {
          "openai": [
            "openai:d.trabucco@tutamail.com",
            "openai:chatgpt-d.trabucco@tutamail.com"
          ]
        }
      },
      "acp": {
        "enabled": true,
        "backend": "acpx",
        "defaultAgent": "codex",
        "allowedAgents": [
          "claude",
          "codex",
          "kimi",
          "gemini",
          "pi"
        ]
      },
      "memory": {
        "search": {
          "enabled": true,
          "experimental": {
            "sessionMemory": true
          },
          "sources": [
            "memory",
            "sessions"
          ],
          "provider": "openai-compatible",
          "remote": {
            "baseUrl": "{{ .Values.litellm.endpoint }}",
            "apiKey": {
              "source": "env",
              "provider": "default",
              "id": "LITELLM_API_KEY"
            }
          },
          "model": "gemini-embedding-001"
        }
      },
      "agents": {
        "defaults": {
          "systemAgent": {
            "agentId": "main"
          },
          "thinkingDefault": "off",
          "reasoningDefault": "off",
          "model": {
            "primary": {{ .Values.agent.model.primary | quote }},
            "fallbacks": [
              {{- range $index, $model := .Values.agent.model.fallbacks }}
              {{- if $index }},{{ end }}{{ $model | quote }}
              {{- end }}
            ]
          },
          "modelPolicy": {
            "allow": [
              "openai/gpt-5.6-sol",
              "openai/gpt-5.5"
            ]
          },
          "models": {
            "openai/gpt-5.6-sol": {
              "agentRuntime": {
                "id": "codex"
              }
            },
            "openai/gpt-5.5": {
              "agentRuntime": {
                "id": "codex"
              }
            }
          },
          "workspace": "/home/node/.openclaw/workspace",
          "embeddedAgent": {
            "executionContract": "strict-agentic"
          },
          "contextPruning": {
            "mode": "cache-ttl",
            "ttl": "2h"
          },
          "compaction": {
            "mode": "safeguard",
            "keepRecentTokens": 140000,
            "memoryFlush": {
              "enabled": true
            }
          },
          "subagents": {
            "maxConcurrent": 20,
            "archiveAfterMinutes": 240,
            "runTimeoutSeconds": 43200,
            "maxSpawnDepth": 3
          },
          "contextInjection": "never"
        },
        "entries": {
          "main": {
            "subagents": {
              "allowAgents": [
                "*"
              ]
            },
            "skills": [],
            "skillsLimits": {
              "maxSkillsPromptChars": 1200
            }
          }
        }
      },
      {{- if .Values.discord.enabled }}
      "bindings": [
        {
          "agentId": "main",
          "match": {
            "channel": "discord",
            "accountId": "default"
          }
        }
      ],
      {{- end }}
      "tools": {
        "profile": "coding",
        "sessions": {
          "visibility": "all"
        },
        "sessions_spawn": {
          "attachments": {
            "enabled": true
          }
        },
        "exec": {
          "timeoutSeconds": 604800,
          "mode": "full"
        },
        "agentToAgent": {
          "enabled": true
        }
      },
      "commands": {
        "native": "auto",
        "nativeSkills": "auto",
        "restart": true,
        "ownerAllowFrom": {{ .Values.commands.ownerAllowFrom | default list | toJson }},
        "allowFrom": {
          "discord": {{ .Values.commands.allowFromDiscord | default list | toJson }}
        }
      },
      "session": {
        "dmScope": "per-channel-peer",
        "resetByType": {
          "group": {
            "mode": "idle",
            "idleMinutes": 43200
          }
        },
        "threadBindings": {
          "enabled": true,
          "idleHours": 999,
          "maxAgeHours": 0
        }
      },
      "channels": {
        "discord": {
          "enabled": {{ .Values.discord.enabled }},
          "token": {
            "source": "env",
            "provider": "default",
            "id": "DISCORD_TOKEN"
          },
          "allowFrom": {{ .Values.commands.allowFromDiscord | default list | toJson }},
          "groupAllowFrom": {{ .Values.commands.allowFromDiscord | default list | toJson }},
          "groupPolicy": "allowlist",
          "streaming": {
            "mode": "partial"
          },
          "inboundWorker": {
            "runTimeoutMs": 43200000
          },
          "guilds": {
            "*": {
              "requireMention": true
            }
          },
          "threadBindings": {
            "enabled": true,
            "idleHours": 999,
            "spawnSessions": true
          },
          "execApprovals": {
            "enabled": true,
            "approvers": {{ .Values.discord.execApprovers | default list | toJson }},
            "target": "dm"
          }
        }
      },
      "gateway": {
        "port": {{ .Values.gateway.port }},
        "mode": "local",
        "bind": "loopback",
        "controlUi": {
          "dangerouslyAllowHostHeaderOriginFallback": true
        },
        "auth": {
          "mode": "token",
          "token": {
            "source": "env",
            "provider": "default",
            "id": "OPENCLAW_GATEWAY_TOKEN"
          }
        },
        "tools": {
          "allow": [
            "sessions_spawn",
            "sessions_send",
            "session_status",
            "group:openclaw"
          ]
        },
        "tailscale": {
          "mode": "off"
        }
      },
      "plugins": {
        "allow": [
          "discord",
          "acpx",
          "codex",
          "openai"
          {{- if eq (.Values.agentRole | default "") "buster" }},
          "kubeclaw-agent-observer"
          {{- end }}
          {{- if eq (.Values.agentRole | default "") "prism" }},
          "kubeclaw-prism"
          {{- end }}
        ],
        "entries": {
          "discord": {
            "enabled": {{ .Values.discord.enabled }}
          },
          "acpx": {
            "enabled": true,
            "config": {
              "permissionMode": "approve-all"
            }
          },
          "openai": {
            "enabled": true
          },
          "codex": {
            "enabled": true
          }
          {{- if eq (.Values.agentRole | default "") "buster" }},
          "kubeclaw-agent-observer": {
            "enabled": true,
            "config": {
              "enabled": true,
              "redisNetworkIsolation": "isolated",
              "maxEventBytes": 3145728,
              "maxQueuePerStream": 100,
              "redisCommandTimeoutMs": 5000,
              "streamMaxLen": 10000,
              "deadLetterMaxLen": 1000,
              "controlWriteMaxAttempts": 3,
              "controlWriteRetryBaseMs": 100,
              "controlWriteRetryMaxMs": 1000,
              "hookPriority": -100,
              "hookTimeoutMs": 1000
            },
            "hooks": {
              "allowConversationAccess": true
            }
          }
          {{- end }}
          {{- if eq (.Values.agentRole | default "") "prism" }},
          "kubeclaw-prism": {
            "enabled": true,
            "config": {
              "controlUrl": "http://127.0.0.1:28080"
            }
          }
          {{- end }}
        }
      },
      "messages": {
        "groupChat": {
          "visibleReplies": "automatic"
        }
      }
    }
