# ConfigMap: Stream Processor sidecar — agent-specific version.
# Nova and Buster each get their own processor with different completion logic.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeclaw.fullname" . }}-processor
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
data:
  processor.cjs: |
{{- if eq .Values.agentRole "buster" }}
{{ .Files.Get "files/processor/buster-processor.cjs" | indent 4 }}
{{- else }}
{{ .Files.Get "files/processor/nova-processor.cjs" | indent 4 }}
{{- end }}
