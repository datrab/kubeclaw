{{/*
Only create this secret if NOT using existingSecret for ALL credentials.
For production, use existingSecret with SOPS or sealed-secrets.
*/}}
{{- if or (and .Values.auth.token (not .Values.auth.existingSecret)) (and .Values.litellm.apiKey (not .Values.litellm.existingSecret)) (and .Values.discord.enabled .Values.discord.token (not .Values.discord.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeclaw.fullname" . }}-gateway
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and .Values.auth.token (not .Values.auth.existingSecret) }}
  gatewayToken: {{ .Values.auth.token | b64enc | quote }}
  {{- end }}
  {{- if and .Values.litellm.apiKey (not .Values.litellm.existingSecret) }}
  litellmApiKey: {{ .Values.litellm.apiKey | b64enc | quote }}
  {{- end }}
  {{- if and .Values.discord.enabled .Values.discord.token (not .Values.discord.existingSecret) }}
  discordToken: {{ .Values.discord.token | b64enc | quote }}
  {{- end }}
{{- end }}
