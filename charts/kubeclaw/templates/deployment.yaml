            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          volumeMounts:
            - name: config
              mountPath: /home/node/.openclaw
            - name: runtime-config
              mountPath: /home/node/.openclaw/swarm.config.json
              subPath: swarm.config.json
            - name: runtime-config
              mountPath: /runtime-config
              readOnly: true
            - name: config
              mountPath: /home/node/.openclaw-persisted
            - name: workspace
              mountPath: /home/node/.openclaw/workspace
            - name: ssh-home-vol
              mountPath: /root/.ssh
            - name: skills-merged
              mountPath: /app/skills
            {{- if .Values.sandbox.enabled }}
            - name: podman-storage
              mountPropagation: Bidirectional
              mountPath: /var/lib/containers
            {{- if .Values.sandbox.registriesConf }}
            - name: podman-registries
              mountPath: /etc/containers/registries.conf.d/999-kubeclaw.conf
              subPath: registries.conf
              readOnly: true
            {{- end }}
            - name: sandbox-workspace
              mountPath: /sandbox
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          resources: {{- toYaml (.Values.busterPipeline.resources | default .Values.resources) | nindent 12 }}

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    DRAIN_FILE="${KUBECLAW_DRAIN_FILE:-/tmp/kubeclaw-draining}"
                    mkdir -p "$(dirname "$DRAIN_FILE")"
                    date -Iseconds > "$DRAIN_FILE"
                    sleep "${KUBECLAW_PRESTOP_DRAIN_SECONDS:-5}"

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            appArmorProfile:
              type: Unconfined
            privileged: true
            seccompProfile:
              type: Unconfined
            allowPrivilegeEscalation: true
            capabilities:
              drop: []
              add:
                - SYS_ADMIN
                - SYS_CHROOT
                - SETUID
                - SETGID
                - SETFCAP
                - NET_ADMIN
