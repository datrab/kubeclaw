            exec:
              command:
                - node
                - /runtime-config/kubeclaw-health.mjs
                - liveness
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
        {{- end }}

        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      # ---------------------------------------------------------------
      # VOLUMES
      # ---------------------------------------------------------------
      volumes:
        - name: config
          {{- if .Values.persistence.config.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kubeclaw.fullname" . }}-config
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: runtime-config
          emptyDir: {}
        - name: workspace
          {{- if .Values.persistence.workspace.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kubeclaw.fullname" . }}-workspace
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: init-config
          configMap:
            name: {{ include "kubeclaw.fullname" . }}-config
        {{- if .Values.workspace.enabled }}
        - name: init-workspace
          configMap:
            name: {{ include "kubeclaw.fullname" . }}-workspace
        {{- end }}
        - name: ssh-secret-vol
          secret:
            secretName: {{ .Values.agent.git.secretName | default (printf "git-deploy-key-%s" (.Values.agentRole | default "default")) }}
            defaultMode: 0400
            optional: false
        - name: ssh-home-vol
          emptyDir: {}
        - name: init-skills
          configMap:
            name: {{ include "kubeclaw.fullname" . }}-skills
            defaultMode: 0444
            optional: true
        - name: skills-merged
          emptyDir: {}
        - name: init-swarm-config
          configMap:
            name: {{ include "kubeclaw.fullname" . }}-swarm-config
            defaultMode: 0444
        {{- if .Values.sandbox.enabled }}
        - name: podman-storage
          emptyDir:
            sizeLimit: {{ .Values.sandbox.storageSize | default "25Gi" }}
        {{- if .Values.sandbox.registriesConf }}
        - name: podman-registries
          configMap:
            name: {{ include "kubeclaw.fullname" . }}-podman-registries
            defaultMode: 0444
        {{- end }}
        - name: sandbox-workspace
          emptyDir:
            sizeLimit: 2Gi
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      restartPolicy: Always
