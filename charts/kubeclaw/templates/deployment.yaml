                secretKeyRef:
                  name: {{ .Values.redis.secretName }}
                  key: {{ .Values.redis.secretKey | default "redis-password" }}
            - name: QDRANT_URL
              value: {{ .Values.qdrant.url | quote }}
            - name: LITELLM_URL
              value: {{ .Values.litellm.endpoint | trimSuffix "/v1" | quote }}
            - name: OPENCLAW_GATEWAY_URL
              value: {{ default (printf "http://127.0.0.1:%v" .Values.gateway.port) .Values.gateway.url | quote }}
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "kubeclaw.gatewaySecretName" . }}, key: {{ include "kubeclaw.gatewaySecretKey" . }} } }
            - name: LITELLM_API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "kubeclaw.litellmSecretName" . }}, key: {{ include "kubeclaw.litellmSecretKey" . }} } }
            {{- if .Values.anthropic.existingSecret }}
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "kubeclaw.anthropicSecretName" . }}, key: {{ include "kubeclaw.anthropicSecretKey" . }} } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "kubeclaw.anthropicSecretName" . }}, key: {{ include "kubeclaw.anthropicSecretKey" . }} } }
            {{- end }}
            {{- if .Values.discord.enabled }}
            - name: DISCORD_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "kubeclaw.discordSecretName" . }}, key: {{ include "kubeclaw.discordSecretKey" . }} } }
            - name: DISCORD_CHANNEL
              value: {{ .Values.discord.channelId | default "" | quote }}
            {{- end }}
            {{- if .Values.discordWebhook.secretName }}
            - name: DISCORD_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discordWebhook.secretName }}
                  key: {{ .Values.discordWebhook.secretKey | default "discordWebhook" }}
            {{- end }}
            - name: SWARM_CONFIG
              value: "/home/node/.openclaw/swarm.config.json"
            - name: GATEWAY_PORT
              value: {{ .Values.gateway.port | quote }}
            - name: KUBECLAW_DRAIN_FILE
              value: {{ .Values.shutdown.drainFile | default "/tmp/kubeclaw-draining" | quote }}
            - name: KUBECLAW_PRESTOP_DRAIN_SECONDS
              value: {{ .Values.shutdown.preStopDrainSeconds | default 5 | quote }}
            - name: KUBECLAW_HEALTH_TIMEOUT_MS
              value: {{ mul (.Values.probes.readiness.timeoutSeconds | default 10 | int) 1000 | quote }}
            - name: KUBECLAW_HEALTH_CHECK_GATEWAY
              value: {{ .Values.probes.dependencies.gateway.enabled | quote }}
            - name: KUBECLAW_HEALTH_CHECK_REDIS
              value: {{ .Values.probes.dependencies.redis.enabled | quote }}
            - name: KUBECLAW_HEALTH_CHECK_REDIS_STREAM
              value: {{ .Values.probes.dependencies.redisStream.enabled | quote }}
            - name: KUBECLAW_HEALTH_REDIS_STREAM
              value: {{ .Values.probes.dependencies.redisStream.stream | default "" | quote }}
            - name: KUBECLAW_HEALTH_REDIS_STREAM_MAX_LEN
              value: {{ .Values.probes.dependencies.redisStream.maxLen | default 1000 | quote }}
            - name: KUBECLAW_HEALTH_CHECK_LITELLM
              value: {{ .Values.probes.dependencies.litellm.enabled | quote }}
            - name: KUBECLAW_HEALTH_CHECK_QDRANT
              value: {{ .Values.probes.dependencies.qdrant.enabled | quote }}
            - name: KUBECLAW_HEALTH_CHECK_REGISTRIES
              value: {{ .Values.probes.dependencies.registries.enabled | quote }}
            - name: KUBECLAW_HEALTH_REGISTRIES
              value: {{ join "," (.Values.probes.dependencies.registries.endpoints | default list) | quote }}
            - name: KUBECLAW_HEALTH_CHECK_BUSTER_HEARTBEAT
              value: {{ .Values.probes.dependencies.busterHeartbeat.enabled | quote }}
            - name: KUBECLAW_HEALTH_BUSTER_HEARTBEAT_MAX_AGE_MS
              value: {{ mul (.Values.probes.dependencies.busterHeartbeat.maxAgeSeconds | default 120 | int) 1000 | quote }}
            {{- if .Values.agent.project }}
            - name: CURRENT_PROJECT
