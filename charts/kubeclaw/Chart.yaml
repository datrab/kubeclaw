apiVersion: v2
name: kubeclaw
description: >-
  Autonomous multi-agent AI swarm on Kubernetes.
  Deterministic pipeline orchestration, sandboxed execution,
  confidence-weighted vector memory, and structured inter-agent communication.
version: 1.0.1
appVersion: "2026.9.4"
type: application
keywords:
  - ai-agents
  - multi-agent
  - kubernetes
  - orchestration
  - llm
  - openclaw
  - swarm
home: https://github.com/datrab/kubeclaw
sources:
  - https://github.com/datrab/kubeclaw
maintainers:
  - name: datrab
    url: https://github.com/datrab
icon: https://raw.githubusercontent.com/datrab/kubeclaw/main/docs/logo.png

# Infrastructure (Redis, Qdrant, PostgreSQL, LiteLLM) is deployed separately
# via deploy.sh using their official Helm charts. No subchart dependencies needed.
# This keeps the agent chart lightweight and avoids duplicate installs per agent.
