# =============================================================================
# KubeClaw Helm Chart — Default Values
# =============================================================================
# Autonomous Multi-Agent AI Swarm on Kubernetes
#
# This file contains sensible defaults. Override per-agent using instance
# value files from the examples/ directory.
#
# Minimal required configuration:
#   - agentRole
#   - auth.existingSecret + auth.existingSecretKey
#   - litellm.existingSecret + litellm.existingSecretKey
#   - agent.git.repoUrl
# =============================================================================

# -- Agent identity. One of: nova, forge, echo, buster
agentRole: "nova"

# =============================================================================
# IMAGES
# =============================================================================

image:
  # General image for Nova, Forge, Echo
  # Override with sandbox image for Buster
  repository: ghcr.io/datrab/kubeclaw-general
  tag: "latest"
  pullPolicy: Always

imagePullSecrets: []
  # - name: ghcr-secret

# =============================================================================
# GATEWAY
# =============================================================================

gateway:
  # Internal URL used by colocated runtime processes such as Buster and the
  # gateway runtime. Empty defaults to http://127.0.0.1:<gateway.port>.
  url: ""
  # Run OpenClaw doctor --fix once after the gateway health endpoint is up.
  startupDoctor:
    enabled: true
    # Maximum time to wait for gateway health before skipping startup doctor.
    waitSeconds: 120
    # Seconds between gateway health checks while waiting.
    pollSeconds: 5
  command:
    - "node"
    - "/app/openclaw.mjs"
    - "gateway"
    - "--bind"
    - "lan"
    - "--port"
    - "18789"
  port: 18789
  bridgePort: 18790
  resources: {}

busterPipeline:
  enabled: false
  command:
    - "node"
    - "/app/skills/buster-pipeline.ts"
  platformCapabilities:
    - image_prepull
  resources: {}

# -- Replica count (always 1 per agent — agents are stateful)
replicaCount: 1

# =============================================================================
# AUTHENTICATION
# =============================================================================
# Gateway tokens authenticate API access to each agent.
# REQUIRED: Provide either token directly or via existingSecret.
# For production, always use existingSecret with SOPS or sealed-secrets.

auth:
  # Direct token (NOT recommended for production)
  token: ""
  # Reference an existing K8s secret
  existingSecret: ""
  existingSecretKey: "gatewayToken"

# =============================================================================
# LLM PROVIDER (LiteLLM)
# =============================================================================
# LiteLLM acts as a unified proxy for multiple LLM providers.
# Deploy LiteLLM separately or use any OpenAI-compatible endpoint.

litellm:
  endpoint: "http://litellm.kubeclaw.svc.cluster.local:4000/v1"
  # Direct API key (NOT recommended for production)
  apiKey: ""
  # Reference an existing K8s secret
  existingSecret: ""
  existingSecretKey: "litellmApiKey"
  # Default model for this agent
  defaultModel: "gemini-flash"
  # Available models (merged into OpenClaw config)
  models:
    - id: "gemini-flash"
      name: "Gemini Flash"
      reasoning: false
      contextWindow: 1048576
      maxTokens: 65536
    - id: "gemini-pro"
      name: "Gemini Pro"
      reasoning: true
      contextWindow: 1048576
      maxTokens: 65536

# =============================================================================
# ANTHROPIC (ACP Claude harness)
# =============================================================================
# Required for ACP subagent spawns (Forge via codex harness, Echo via claude harness).
# The OpenClaw gateway passes this to the claude/codex harness at session spawn time.

anthropic:
  # Reference an existing K8s secret
  existingSecret: ""
  existingSecretKey: "anthropicApiKey"

# =============================================================================
# STITCH API (Google Stitch MCP — UI design tool for Prism)
# =============================================================================

stitch:
  # Reference an existing K8s secret containing the Stitch API key
  existingSecret: ""
  existingSecretKey: "stitchApiKey"

# =============================================================================
# DISCORD INTEGRATION (optional)
# =============================================================================

discord:
  enabled: false
  channelId: ""
  # Discord user IDs allowed to approve exec commands (array of "user:<id>" strings)
  execApprovers: []
  # Direct token
  token: ""
  # Or reference existing secret
  existingSecret: ""
  existingSecretKey: "discordToken"

discordWebhook:
  secretName: ""
  secretKey: "discordWebhook"

# =============================================================================
# GIT CONFIGURATION
# =============================================================================

agent:
  # Active project name — sets CURRENT_PROJECT env for memory scoping
  project: ""  # e.g. "kubecommand"
  git:
    enabled: true
    # K8s secret containing the SSH deploy key
    secretName: ""  # e.g. "git-deploy-key-nova"
    repoUrl: ""     # e.g. "git@github.com:your-org/your-project.git"

# =============================================================================
# INFRASTRUCTURE CONNECTIONS
# =============================================================================

# -- Redis (inter-agent messaging via Redis Streams)
# Infrastructure is deployed separately. Configure connection here.
redis:
  host: "redis-master.kubeclaw.svc.cluster.local"
  port: "6379"
  secretName: "redis-secrets"
  secretKey: "redis-password"

# -- Qdrant (confidence-weighted vector memory)
qdrant:
  url: "http://qdrant.kubeclaw.svc.cluster.local:6333"

# =============================================================================
# =============================================================================
# WORKSPACE FILES
# =============================================================================
# Agent personality and operating procedures, mounted as markdown files.
# Define inline here or in your instance values file.
# See examples/workspace-templates/ for reference configurations.

workspace:
  enabled: true
  # false = only write files on first deploy (OpenClaw edits are preserved across restarts)
  # true  = overwrite from values on every restart (useful during initial development)
  overrideOnRestart: false
  soul: ""       # SOUL.md — personality, tone, core directives
  agents: ""     # AGENTS.md — protocols, workflow, delegation rules
  user: ""       # USER.md — information about the human operator
  tools: ""      # TOOLS.md — available tools and usage patterns
  memory: ""     # MEMORY.md — long-term context
  identity: ""   # IDENTITY.md — agent identity (filled at first run)
  bootstrap: ""  # BOOTSTRAP.md — first-run ritual (self-deleting)

# =============================================================================
# SERVICE
# =============================================================================

service:
  type: ClusterIP
  gatewayPort: 18789
  bridgePort: 18790
  # NodePort for gateway when service.type is NodePort.
  nodePort: 0
  bridgeNodePort: 0
  # Extra ports to expose on the internal Service.
  # If nodePort is set while service.type is not NodePort, the chart also
  # creates a dedicated NodePort Service for that extra port without exposing
  # the gateway.
  extraPorts: []
  # - name: prism-preview
  #   port: 3456
  #   targetPort: 3456
  #   nodePort: 30456

# =============================================================================
# PERSISTENCE
# =============================================================================

persistence:
  config:
    enabled: true
    size: 10Gi
    storageClass: ""  # Uses cluster default if empty
    accessModes: ["ReadWriteOnce"]
  workspace:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessModes: ["ReadWriteOnce"]

# =============================================================================
# RESOURCES
# =============================================================================

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# =============================================================================
# SECURITY
# =============================================================================
# OpenClaw's base image requires root. Set to false only if running a custom
# rootless image. Ignored when sandbox.enabled=true (Podman always needs root).

runAsRoot: true

# =============================================================================
# HEALTH CHECKS
# =============================================================================

probes:
  startup:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 24
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
  liveness:
    enabled: true
    initialDelaySeconds: 120
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  dependencies:
    gateway:
      enabled: true
    redis:
      enabled: true
    redisStream:
      enabled: true
      stream: ""
      maxLen: 1000
    litellm:
      enabled: true
    qdrant:
      enabled: true
    registries:
      enabled: true
      endpoints:
        - "http://registry-local.kubeclaw.svc.cluster.local:5001"
        - "http://registry-mirror.kubeclaw.svc.cluster.local:5000"
    busterHeartbeat:
      enabled: true
      maxAgeSeconds: 120

# =============================================================================
# SHUTDOWN
# =============================================================================

shutdown:
  # Kubernetes sends SIGTERM after preStop completes; keep this long enough for
  # Redis task settlement, active-session termination, and sandbox cleanup.
  terminationGracePeriodSeconds: 180
  drainFile: "/tmp/kubeclaw-draining"
  preStopDrainSeconds: 5

# =============================================================================
# SANDBOX (Buster only)
# =============================================================================
# Enables Podman-in-Pod for isolated container execution.
# ONLY enable for the Buster (tester) agent.
# Requires privileged security context.

sandbox:
  enabled: false
  storageSize: "50Gi"
  registriesConf: "" # Optional TOML mounted into /etc/containers/registries.conf.d/999-kubeclaw.conf

# =============================================================================
# SERVICE ACCOUNT
# =============================================================================
# When enabled, creates an agent ServiceAccount. By default it does not mount a
# Kubernetes token. Buster deployments that need k8s suite access should use
# busterNamespaceBroker and explicitly enable automount for this account.

serviceAccount:
  create: false
  automount: false

# =============================================================================
# BUSTER NAMESPACE BROKER (Buster only)
# =============================================================================
# Self-contained namespace lease controller for Buster k8s tests.
# Buster can create BusterNamespaceLease objects in the release namespace; the
# trusted controller creates/deletes ephemeral test namespaces and binds Buster's
# ServiceAccount only inside those namespaces.

busterNamespaceBroker:
  enabled: false
  leaseApiGroup: kubeclaw.forgestack.ai
  leaseApiVersion: v1alpha1
  allowedPrefixes:
    - test
  defaultTtlSeconds: 7200
  controller:
    image:
      repository: ghcr.io/datrab/kubeclaw-namespace-controller
      tag: latest
      pullPolicy: Always
    pollIntervalMs: 3000
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

# =============================================================================
# COMMANDS
# =============================================================================

commands:
  # Channel-qualified operator IDs for OpenClaw owner-only commands.
  # Example: ["discord:123456789012345678"]
  ownerAllowFrom: []
  # Discord user IDs allowed to run commands (array of "user:<id>" strings)
  allowFromDiscord: []

# =============================================================================
# SWARM CONFIG
# =============================================================================
# Platform-level config for the pipeline engine.
# Copied to the config PVC and mounted at /home/node/.openclaw/swarm.config.json.
# Pipeline reads /home/node/.openclaw/swarm.config.json first; SWARM_CONFIG is a secondary candidate.
#
# Default is loaded from charts/kubeclaw/files/config/swarm.config.json.
# To override the default, paste your full JSON config here:
#
#   swarmConfigJson: |
#     { "poll_interval_seconds": 30, ... }

swarmConfig:
  # false = only write on first deploy (pipeline/OpenClaw edits are preserved)
  # true  = overwrite from chart on every restart
  overrideOnRestart: false

swarmConfigJson: ""

# Default is loaded from charts/kubeclaw/files/config/.semgrep.yml.
# To override, paste your full YAML config here:
#
#   semgrepConfigYaml: |
#     rules:
#       - id: my-rule
#         ...

semgrepConfigYaml: ""

# Default is loaded from charts/kubeclaw/files/config/eslint.config.mjs.
# To override, paste your full flat-config module here:
#
#   eslintConfigMjs: |
#     export default [
#       {
#         rules: {
#           'no-alert': 'warn',
#         },
#       },
#     ];

eslintConfigMjs: ""

# =============================================================================
# CUSTOM SKILLS (optional)
# =============================================================================
# KubeClaw system skills (redis.ts, memory.js, pipeline.ts, etc.) are baked
# into the Docker image. This section is ONLY for additional user-defined skills.
#
# Example:
#   customSkills:
#     my-notifier.js: |
#       #!/usr/bin/env node
#       console.log("custom skill");

customSkills: {}

# =============================================================================
# SCHEDULING
# =============================================================================

nodeSelector: {}
tolerations: []
podAnnotations: {}
extraEnv: []

# -- Extra sidecar containers to inject into the agent pod (e.g. prism-preview)
extraContainers: []

# -- Extra volumes to mount into the agent pod
extraVolumes: []

# -- Extra volume mounts for the main kubeclaw container
extraVolumeMounts: []
