{{- if and .Values.mcp.secretInput.enabled (empty .Values.mcp.secretInput.targets) -}}{{ fail "mcp.secretInput.targets is required" }}{{- end -}}
{{- $name := printf "%s-mcp" .Release.Name -}}
{{- $clients := list -}}
{{- $ids := dict -}}
{{- range .Values.mcp.clients -}}
{{- $client := . -}}
{{- if or (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .id)) (gt (len .id) 63) (hasKey $ids .id) -}}
{{- fail "mcp client ids must be unique DNS labels" -}}
{{- end -}}
{{- $_ := set $ids .id true -}}
{{- if and .readAllNamespaces (not $.Values.rbac.readAllNamespaces) -}}{{- fail "MCP all-namespace reads exceed rbac.readAllNamespaces" -}}{{- end -}}
{{- range .namespaces -}}
{{- if not (has . $.Values.rbac.namespaces) -}}{{- fail "MCP client namespace is outside rbac.namespaces" -}}{{- end -}}
{{- end -}}
{{- range .namespacePrefixes -}}
{{- if not (has (lower .) $.Values.rbac.namespacePrefixes) -}}{{- fail "MCP client prefix is outside rbac.namespacePrefixes" -}}{{- end -}}
{{- end -}}
{{- if and .readOnly (or (or (has "exec_pod" .tools) (has "secure_secret_request" .tools) (has "secure_secret_targets" .tools) (has "secure_secret_status" .tools) (has "secure_secret_cancel" .tools) (has "secure_secret_revoke" .tools) (has "secure_secret_probe" .tools) (has "secure_secret_reconcile" .tools)) (not (empty .exec))) -}}
{{- fail "Read-only MCP clients cannot have exec or secret-management tools or grants" -}}
{{- end -}}
{{- range .exec -}}
{{- if .allNonSystemNamespaces -}}
{{- if or (not $.Values.rbac.execAllNonSystemNamespaces) (not $client.readAllNamespaces) -}}{{- fail "MCP broad exec requires RBAC and client all-namespace observation" -}}{{- end -}}
{{- else if .namespacePrefix -}}
{{- if not (has (lower .namespacePrefix) $.Values.rbac.namespacePrefixes) -}}{{- fail "MCP exec prefix is outside rbac.namespacePrefixes" -}}{{- end -}}
{{- else if not (has .namespace $.Values.rbac.execNamespaces) -}}{{- fail "MCP exec grant is outside rbac.execNamespaces" -}}{{- end -}}
{{- end -}}
{{- $clients = append $clients (dict "id" .id "readOnly" (.readOnly | default false) "tokenFile" (printf "/var/run/ops-clients/%s/token" .id) "namespaces" .namespaces "readAllNamespaces" (.readAllNamespaces | default false) "namespacePrefixes" (.namespacePrefixes | default list) "tools" .tools "exec" .exec) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ $name }}-policy}
data:
  policy.json: {{ dict "clients" $clients | toJson | quote }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $name }}}
spec:
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports: [{name: https-mcp, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $name }}}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ops-mcp
          image: {{ .Values.mcpImage | quote }}
          env:
            - {name: HOST, value: "0.0.0.0"}
            - {name: OPS_DEFAULT_NAMESPACE, value: {{ .Values.defaultNamespace | quote }}}
            - {name: OPS_ALLOWED_NAMESPACES, value: {{ join "," .Values.rbac.namespaces | quote }}}
            - {name: OPS_EXEC_ALL_NON_SYSTEM_NAMESPACES, value: {{ ternary "1" "0" .Values.rbac.execAllNonSystemNamespaces | quote }}}
            - {name: OPS_READ_ALL_NAMESPACES, value: {{ ternary "1" "0" .Values.rbac.readAllNamespaces | quote }}}
            - {name: OPS_ALLOWED_NAMESPACE_PREFIXES, value: {{ join "," .Values.rbac.namespacePrefixes | quote }}}
            - {name: ARGOCD_NAMESPACE, value: {{ .Values.argoNamespace | quote }}}
            {{- if .Values.mcp.monitoring.enabled }}
            - {name: OPS_PROMETHEUS_ORIGIN, value: {{ printf "http://%s.%s.svc.cluster.local:%v" .Values.mcp.monitoring.service .Values.mcp.monitoring.namespace .Values.mcp.monitoring.port | quote }}}
            {{- end }}
            {{- if .Values.mcp.secretInput.enabled }}
            - {name: OPS_SECRET_INPUT_CONFIG, value: /etc/secret-input/broker.json}
            {{- end }}
            - {name: OPS_MCP_POLICY_FILE, value: /etc/ops-mcp/policy.json}
            - {name: OPS_MCP_TLS_CERT_FILE, value: /etc/ops-tls/tls.crt}
            - {name: OPS_MCP_TLS_KEY_FILE, value: /etc/ops-tls/tls.key}
          ports: [{name: https-mcp, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toYaml .Values.resources.mcp | nindent 12 }}
          volumeMounts:
            - {name: kube-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            {{- if .Values.mcp.secretInput.enabled }}
            - {name: secret-input-config, mountPath: /etc/secret-input, readOnly: true}
            - {name: secret-input-tls, mountPath: /etc/secret-input-tls, readOnly: true}
            - {name: secret-input-state, mountPath: /var/lib/secret-input}
            {{- end }}
            - {name: policy, mountPath: /etc/ops-mcp, readOnly: true}
            - {name: tls, mountPath: /etc/ops-tls, readOnly: true}
            {{- range .Values.mcp.clients }}
            - {name: client-{{ .id }}, mountPath: /var/run/ops-clients/{{ .id }}, readOnly: true}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: https-mcp, scheme: HTTPS}
            periodSeconds: 10
          # Credential/policy failure affects readiness; it must not cause a
          # restart loop. Liveness only checks that the TLS listener responds.
          livenessProbe:
            tcpSocket: {port: https-mcp}
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        {{- if .Values.mcp.secretInput.enabled }}
        - name: secret-input-config
          configMap: {name: {{ $name }}-secret-input}
        - name: secret-input-tls
          secret: {secretName: {{ required "mcp.secretInput.brokerTlsSecret is required" .Values.mcp.secretInput.brokerTlsSecret }}, defaultMode: 0440}
        - name: secret-input-state
          persistentVolumeClaim: {claimName: {{ required "mcp.secretInput.existingClaim is required" .Values.mcp.secretInput.existingClaim }}}
        {{- end }}
        - name: policy
          configMap: {name: {{ $name }}-policy}
        - name: tls
          secret: {secretName: {{ required "mcp.tlsSecret is required" .Values.mcp.tlsSecret }}, defaultMode: 0440}
        {{- range .Values.mcp.clients }}
        - name: client-{{ .id }}
          secret: {secretName: {{ required "client tokenSecret is required" .tokenSecret }}, defaultMode: 0440}
        {{- end }}
        - name: kube-api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]

{{- if .Values.mcp.secretInput.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ $name }}-secret-input}
data:
  broker.json: {{ dict "publicOrigin" (required "mcp.secretInput.publicOrigin is required" .Values.mcp.secretInput.publicOrigin) "storeFile" "/var/lib/secret-input/requests.sqlite" "targets" .Values.mcp.secretInput.targets "tls" (dict "caFile" "/etc/secret-input-tls/ca.crt" "certFile" "/etc/secret-input-tls/tls.crt" "keyFile" "/etc/secret-input-tls/tls.key") | toJson | quote }}
{{- end }}
