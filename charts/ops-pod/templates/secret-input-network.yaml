{{- if .Values.mcp.secretInput.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-secret-delivery}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}-mcp}}
  policyTypes: [Egress]
  egress:
  {{- range .Values.mcp.secretInput.targets }}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .namespace | quote }}}}
          podSelector: {matchLabels: {security.kubeclaw.io/secret-custody: "true"}}
      ports: [{protocol: TCP, port: 8443}]
  {{- end }}
{{- end }}
