{{- $name := .Release.Name -}}
{{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" .Values.codexImage) }}
{{- fail "codexImage must be an immutable image@sha256:digest" }}
{{- end }}
{{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" .Values.mcpImage) }}
{{- fail "mcpImage must be an immutable image@sha256:digest" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports: [{name: identity, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  revisionHistoryLimit: 3
  # A single persistent CLI identity/workspace must never have two writers.
  updateStrategy: {type: RollingUpdate}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: codex
          image: {{ .Values.codexImage | quote }}
          env:
            - {name: HOME, value: /home/node}
            - {name: OPS_DEFAULT_NAMESPACE, value: {{ .Values.defaultNamespace | quote }}}
            - {name: OPS_MCP_URL, value: "https://{{ $name }}-mcp.{{ .Release.Namespace }}.svc:8080/mcp"}
            - {name: CODEX_CA_CERTIFICATE, value: /var/run/kubeclaw-ops/ca/ca.crt}
            {{- if .Values.githubSecret }}
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.githubSecret }}, key: token}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toYaml .Values.resources.codex | nindent 12 }}
          volumeMounts:
            - {name: home, mountPath: /home/node}
            - {name: workspace, mountPath: /workspace}
            - {name: codex-tmp, mountPath: /tmp}
            - {name: bearer, mountPath: /var/run/kubeclaw-ops/bearer, readOnly: true}
            - {name: mcp-ca, mountPath: /var/run/kubeclaw-ops/ca, readOnly: true}
          readinessProbe:
            exec:
              command: [python3, -c, "import json; s=json.load(open('/tmp/codex-ops-status.json')); raise SystemExit(0 if s['phase']=='remote-process-running' else 1)"]
            periodSeconds: 10
            timeoutSeconds: 3
          # Keep onboarding available while login/relay dependencies are unavailable.
        {{- if .Values.tailscale.enabled }}
        - name: tailscale
          image: {{ .Values.tailscale.image | quote }}
          env:
            - {name: TS_USERSPACE, value: "true"}
            - {name: TS_AUTH_ONCE, value: "true"}
            - {name: TS_KUBE_SECRET, value: ""}
            - {name: TS_STATE_DIR, value: /var/lib/tailscale}
            - {name: TS_SOCKET, value: /tmp/tailscaled.sock}
            - {name: TS_SOCKS5_SERVER, value: "127.0.0.1:1055"}
            - {name: TS_HOSTNAME, value: {{ .Values.tailscale.hostname | quote }}}
            - {name: TS_EXTRA_ARGS, value: {{ .Values.tailscale.extraArgs | quote }}}
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.tailscale.authSecret }}, key: authkey}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toYaml .Values.tailscale.resources | nindent 12 }}
          volumeMounts:
            - {name: tailscale-state, mountPath: /var/lib/tailscale}
            - {name: tailscale-tmp, mountPath: /tmp}
        {{- end }}
      volumes:
        - name: bearer
          secret:
            secretName: {{ .Values.bearerSecret }}
            defaultMode: 0440
        - name: mcp-ca
          configMap:
            name: {{ .Values.mcp.caConfigMap }}
        - {name: codex-tmp, emptyDir: {sizeLimit: 1Gi}}
        {{- if .Values.tailscale.enabled }}
        - {name: tailscale-tmp, emptyDir: {sizeLimit: 64Mi}}
        - name: tailscale-state
          persistentVolumeClaim: {claimName: {{ $name }}-tailscale}
        {{- end }}
  volumeClaimTemplates:
    {{- range $volume := list "home" "workspace" }}
    - metadata: {name: {{ $volume }}}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if $.Values.persistence.storageClass }}
        storageClassName: {{ $.Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ if eq $volume "home" }}2Gi{{ else }}{{ $.Values.persistence.size }}{{ end }}
    {{- end }}
