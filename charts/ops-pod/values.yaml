# Images must be immutable digests from the Ops image workflow.
codexImage: ""
mcpImage: ""
imagePullSecrets:
  - name: ghcr-secret
bearerSecret: codex-ops-bearer
githubSecret: "" # optional Secret with key `token`, mounted in Codex only

persistence:
  size: 20Gi
  storageClass: "" # existing cluster default

resources:
  codex:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 3Gi}
  mcp:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 500m, memory: 512Mi}

rbac:
  # Namespace-wide observation is authorized per client, never on agent SAs.
  readAllNamespaces: true
  # The deployment helper discovers existing platform namespaces. RoleBindings
  # must not refer to namespaces that do not exist yet.
  namespaces: [kubeclaw]
  # Upper bound on namespaces where the MCP may exec. Per-client grants below
  # further restrict target labels, containers, timeout and output size.
  execNamespaces: [kubeclaw]
  # Devbox may exec in existing/future workload namespaces; kube-* is excluded.
  execAllNonSystemNamespaces: true
  # Reconciled continuously for existing and future namespaces. Lowercase prefixes.
  namespacePrefixes: [test]
argoNamespace: argocd
defaultNamespace: kubeclaw

networkPolicy:
  enabled: true
  cilium: false # helper detects Cilium CRDs; adds explicit kube-apiserver entity
  apiServerCIDRs: [] # helper discovers Kubernetes endpoint IPs
  apiServerPort: 6443

tailscale:
  enabled: false
  image: ghcr.io/tailscale/tailscale:v1.102.3
  authSecret: codex-ops-tailscale # key: authkey
  hostname: kubeclaw-ops
  extraArgs: "--accept-dns=false"
  # Userspace SOCKS on localhost:1055; no NET_ADMIN, host networking or operator.
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# Central MCP service. Argo creates credential objects and a scoped Sync Job
# fills them inside the cluster. Each client receives only its own credential.
mcp:
  # Disabled until recipient keys and mTLS are provisioned. Contains public keys,
  # target names and encrypted request state only; never private recipient keys.
  secretInput:
    enabled: false
    publicOrigin: ""
    existingClaim: ""
    brokerTlsSecret: ""
    targets: []
  monitoring:
    enabled: false
    namespace: monitoring
    service: prometheus-kube-prometheus-prometheus
    port: 9090
    podLabels:
      app.kubernetes.io/name: prometheus
  provision:
    enabled: true
    caSecret: codex-ops-mcp-ca
    schedule: "17 3 * * *"
  tlsSecret: codex-ops-mcp-tls
  caConfigMap: ops-mcp-ca
  clients:
    - id: codex
      readOnly: true
      readAllNamespaces: true
      tokenSecret: codex-ops-bearer
      namespace: kubeclaw-ops
      podLabels: {app.kubernetes.io/name: codex-ops}
      namespaces: [kubeclaw]
      namespacePrefixes: [test]
      tools: [list_argocd_applications, platform_cluster_state, platform_network_state, namespace_overview, get_pod, get_events, get_pod_logs, get_hubble_flows, get_pod_metrics, get_resource_inventory, get_monitoring_metrics, get_monitoring_alerts]
      exec: []
    - id: nova
      tokenSecret: nova-ops-bearer
      namespace: kubeclaw
      podLabels: {app.kubernetes.io/instance: agent-nova}
      namespaces: [kubeclaw]
      namespacePrefixes: [test]
      tools: [namespace_overview, get_pod, get_events, get_pod_logs, get_hubble_flows, get_pod_metrics, get_resource_inventory, exec_pod]
      exec:
        - namespacePrefix: test
          allPods: true
          allContainers: true
          timeoutSeconds: 30
          maxOutputBytes: 65536
        - namespace: kubeclaw
          allPods: true
          allContainers: true
          timeoutSeconds: 30
          maxOutputBytes: 65536
    - id: buster
      tokenSecret: buster-ops-bearer
      namespace: kubeclaw
      podLabels: {app.kubernetes.io/instance: agent-buster}
      namespaces: []
      namespacePrefixes: [test]
      tools: [namespace_overview, get_pod, get_events, get_pod_logs, get_pod_metrics, exec_pod]
      exec:
        - namespacePrefix: test
          allPods: true
          allContainers: true
          timeoutSeconds: 30
          maxOutputBytes: 65536
