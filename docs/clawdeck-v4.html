/* ═══ TYPING ═════════════════════════════════════════════════════ */
const TypeText = ({ text, speed = 20, onDone }) => {
  const [n, setN] = useState(0);
  useEffect(() => {
    if (n < text.length) { const t = setTimeout(() => setN(v => v + 1), speed); return () => clearTimeout(t); }
    else if (onDone) onDone();
  }, [n, text.length, speed, onDone]);
  return <>{text.slice(0, n)}{n < text.length && <span style={{ animation: "blink .7s step-end infinite" }}>▌</span>}</>;
};

/* ═══ CONSTRUCTION RING ══════════════════════════════════════════ */
const Ring = ({ size, color, pct = 0.27 }) => {
  const r = (size - 4) / 2, circ = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} style={{ position: "absolute", top: -2, left: -2, transform: "rotate(-90deg)", pointerEvents: "none" }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={1.5} opacity={0.1} />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={1.5} strokeLinecap="round"
        strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)} style={{ transition: "stroke-dashoffset 1s ease" }} />
    </svg>
  );
};

        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 22 }}>
          {[{ l: "MODULES", v: `${passed}/${total}`, c: C.green }, { l: "ELAPSED", v: "5h 18m", c: C.sub }, { l: "ETA", v: "~2h 40m", c: C.amber }, { l: "COST", v: `$${cost.toFixed(2)}`, c: C.orange }].map(s => (
            <div key={s.l} style={{ textAlign: "right" }}>
              <div style={{ fontFamily: "var(--m)", fontSize: 13, fontWeight: 700, color: s.c }}>{s.v}</div>
              <div style={{ fontFamily: "var(--d)", fontSize: 7, fontWeight: 600, color: C.dim, letterSpacing: "0.12em" }}>{s.l}</div>
            </div>
          ))}
          <div style={{ borderLeft: `1px solid ${C.border}`, paddingLeft: 16, display: "flex", alignItems: "center", gap: 8 }}>
            <Ship damage={shipDmg} size={0.7} />
            <div>
              <div style={{ fontFamily: "var(--m)", fontSize: 9, color: shipDmg === 0 ? C.green : shipDmg <= 1 ? C.amber : C.red }}>
                {["NOMINAL", "SCRATCHED", "DAMAGED", "CRITICAL"][Math.min(shipDmg, 3)]}
              </div>
              <div style={{ fontFamily: "var(--d)", fontSize: 7, fontWeight: 600, color: C.dim, letterSpacing: "0.1em" }}>HULL</div>
            </div>
          </div>
          <div style={{ fontFamily: "var(--m)", fontSize: 10, color: C.dim, borderLeft: `1px solid ${C.border}`, paddingLeft: 16 }}>
            {time.toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}
          </div>
        </div>
      </header>

      {/* ═══ PIPELINE ═══ */}
      <div style={{ padding: "14px 22px 2px", flexShrink: 0 }}>
        <Sec right={<div style={{ display: "flex", gap: 6 }}><Badge color={C.green}>{passed} pass</Badge><Badge color={C.orange}>1 active</Badge><Badge color={C.dim}>{total - passed - 1} idle</Badge></div>}>Pipeline</Sec>
        <div style={{ position: "relative", padding: "22px 0 10px", isolation: "isolate" }}>
          {/* background connector lines — behind everything */}
          <div style={{ position: "absolute", top: "calc(50% + 4px)", left: 26, right: 26, height: 1, background: C.border, zIndex: -1 }} />
          <div style={{ position: "absolute", top: "calc(50% + 4px)", left: 26, width: activeIdx >= 0 ? `${(activeIdx / (MODULES.length - 1)) * 100}%` : "0%", height: 1, background: `linear-gradient(90deg, ${C.green}60, ${C.orange}80)`, zIndex: -1, transition: "width 2s ease" }} />
          {/* nodes */}
          <div style={{ display: "flex", alignItems: "flex-end", gap: 4, position: "relative" }}>
            {MODULES.map((m, i) => <Node key={m.id} mod={m} active={i === activeIdx} showShip={i === activeIdx} dmg={shipDmg} />)}
          </div>
        </div>
      </div>

      {/* ═══ MAIN GRID ═══ */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1.15fr 1fr", gap: 12, padding: "6px 22px 10px", flex: 1, minHeight: 0, overflow: "hidden" }}>

        {/* ACTIVITY */}
        <Pan style={{ display: "flex", flexDirection: "column" }}>
          <div style={{ padding: "10px 12px 0" }}>
            <Sec right={<div style={{ display: "flex", alignItems: "center", gap: 5 }}><div style={{ width: 4, height: 4, borderRadius: "50%", background: C.green, animation: "glow 1.5s ease-in-out infinite", boxShadow: `0 0 3px ${C.green}` }} /><span style={{ fontFamily: "var(--m)", fontSize: 8, color: C.green }}>LIVE</span></div>}>Activity</Sec>
          </div>
          <div ref={feedRef} style={{ flex: 1, overflowY: "auto", padding: "0 12px 10px" }}>
            {EVENTS.slice(0, visEv).map((ev, i) => {
              const isNew = i === visEv - 1;
              return (
                <div key={i} style={{ padding: "7px 0", borderBottom: `1px solid ${C.bg}`, animation: isNew ? "fadeUp .3s ease" : "none", display: "flex", gap: 8 }}>
                  <span style={{ fontFamily: "var(--m)", fontSize: 10, color: evC[ev.type], width: 12, textAlign: "center", marginTop: 1, flexShrink: 0 }}>{evI[ev.type]}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                      <span style={{ fontFamily: "var(--m)", fontSize: 9, fontWeight: 600, color: evC[ev.type] }}>
                        {isNew && !typed[i] ? <TypeText text={ev.msg} speed={22} onDone={() => markTyped(i)} /> : ev.msg}
                      </span>
                      <span style={{ fontFamily: "var(--m)", fontSize: 7, color: C.dim, flexShrink: 0, marginLeft: 4 }}>{ev.ts}</span>
                    </div>
                    {(typed[i] || !isNew) && <div style={{ fontSize: 10, color: C.sub, marginTop: 2, lineHeight: 1.3, fontWeight: 500, animation: isNew ? "fadeUp .2s ease" : "none" }}>{ev.detail}</div>}
                  </div>
                </div>
              );
            })}
          </div>
        </Pan>

        {/* AGENT */}
        <Pan style={{ display: "flex", flexDirection: "column" }}>
          <div style={{ padding: "10px 12px 0" }}><Sec right={<Badge color={C.orange}>FORGE</Badge>}>Active Agent</Sec></div>
          <div style={{ flex: 1, padding: "0 12px 12px", display: "flex", flexDirection: "column", gap: 10, overflow: "hidden" }}>
            <div style={{ padding: 12, borderRadius: 3, background: C.oD, border: `1px solid ${C.orange}15` }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
                <div style={{ width: 34, height: 34, borderRadius: 3, border: `1.5px solid ${C.orange}40`, background: C.oD, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: `inset 0 0 8px ${C.oG}` }}>
                  <span style={{ fontSize: 16 }}>⚒</span>
                </div>
                <div>
                  <div style={{ fontFamily: "var(--d)", fontSize: 13, fontWeight: 700 }}>forge-pro</div>
                  <div style={{ fontFamily: "var(--m)", fontSize: 8, color: C.sub, marginTop: 1 }}>gemini-pro · ACP</div>
                </div>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                {[["MODULE", "10 — FE Scaffold"], ["SUB-STEP", "10b: Auth Flow"], ["ATTEMPT", "1 / 3"], ["TIMEOUT", "45 min"]].map(([l, v]) => (
                  <div key={l}>
                    <div style={{ fontFamily: "var(--d)", fontSize: 7, fontWeight: 600, color: C.dim, letterSpacing: "0.1em", marginBottom: 1 }}>{l}</div>
                    <div style={{ fontFamily: "var(--m)", fontSize: 9, color: C.text }}>{v}</div>
                  </div>
                ))}
              </div>
            </div>
            <div>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                <span style={{ fontFamily: "var(--d)", fontSize: 7, fontWeight: 600, color: C.dim, letterSpacing: "0.1em" }}>SESSION</span>
                <span style={{ fontFamily: "var(--m)", fontSize: 9, color: C.amber }}>12:13 / 45:00</span>
              </div>
              <div style={{ height: 3, background: C.bg, borderRadius: 2, overflow: "hidden" }}>
                <div style={{ height: "100%", width: "27%", borderRadius: 2, background: C.orange, boxShadow: `0 0 6px ${C.oG}`, animation: "barG 1.5s ease" }} />
              </div>
            </div>
            <div>
              <div style={{ fontFamily: "var(--d)", fontSize: 7, fontWeight: 600, color: C.dim, letterSpacing: "0.1em", marginBottom: 4 }}>WORKING ON</div>
              {["src/App.tsx", "src/stores/authStore.ts", "src/pages/Setup.tsx", "src/components/AuthGuard.tsx"].map(f => (
                <div key={f} style={{ fontFamily: "var(--m)", fontSize: 8, color: C.sub, padding: "2px 7px", marginBottom: 1, borderLeft: `2px solid ${C.orange}30`, background: C.bg }}>{f}</div>
              ))}
            </div>
            <div style={{ padding: 8, borderRadius: 3, background: C.bg, border: `1px solid ${C.border}` }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 5 }}>
                <span style={{ fontFamily: "var(--d)", fontSize: 7, fontWeight: 700, color: C.cyan, letterSpacing: "0.1em" }}>AGENT OBSERVABILITY</span>
                <span style={{ fontFamily: "var(--m)", fontSize: 7, color: C.amber }}>{AGENT_OBSERVABILITY_DEBUG.status}</span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 4, marginBottom: 5 }}>
                {AGENT_OBSERVABILITY_DEBUG.coverage.map(([k, v, note]) => (
                  <div key={k} title={note} style={{ padding: "4px 5px", background: C.surface, borderLeft: `2px solid ${C.cyan}55` }}>
                    <div style={{ fontFamily: "var(--m)", fontSize: 8, color: C.text }}>{v}</div>
                    <div style={{ fontFamily: "var(--d)", fontSize: 6, color: C.dim, letterSpacing: "0.08em" }}>{k}</div>
                  </div>
                ))}
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "var(--m)", fontSize: 7, color: C.dim, marginBottom: 4 }}>
                <span>control lag <b style={{ color: C.amber }}>{AGENT_OBSERVABILITY_DEBUG.controlLag}</b></span>
                <span>payload len <b style={{ color: C.amber }}>{AGENT_OBSERVABILITY_DEBUG.payloadLength}</b></span>
              </div>
              {AGENT_OBSERVABILITY_DEBUG.spans.map(([k, v, note]) => (
                <div key={k} style={{ display: "flex", justifyContent: "space-between", fontFamily: "var(--m)", fontSize: 7, color: C.sub }}>
                  <span>{k}</span><span style={{ color: note.includes("orphan") ? C.amber : C.green }}>{v} · {note}</span>
                </div>
              ))}
              {AGENT_OBSERVABILITY_DEBUG.warnings.map(w => (
                <div key={w} style={{ fontFamily: "var(--m)", fontSize: 7, color: C.amber, marginTop: 2 }}>⚠ {w}</div>
              ))}
            </div>
            <div style={{ marginTop: "auto" }}>
              <div style={{ fontFamily: "var(--d)", fontSize: 7, fontWeight: 600, color: C.dim, letterSpacing: "0.1em", marginBottom: 4 }}>QDRANT MEMORY</div>
              {[{ t: "Zustand: create(set => ({...}))", c: 0.82 }, { t: "Vite proxy → localhost:8000", c: 0.71 }, { t: "Auth: Bearer in localStorage", c: 0.65 }].map((m, i) => (
                <div key={i} style={{ fontFamily: "var(--m)", fontSize: 7, color: C.dim, padding: "2px 7px", marginBottom: 1, background: C.bg, display: "flex", justifyContent: "space-between" }}>
                  <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{m.t}</span>
                  <span style={{ color: m.c >= .75 ? C.green : m.c >= .45 ? C.amber : C.red, flexShrink: 0 }}>{m.c >= .75 ? "★★★" : "★★☆"}</span>
                </div>
              ))}
            </div>
          </div>
        </Pan>

        {/* VISUAL */}
        <Pan style={{ display: "flex", flexDirection: "column" }}>
          <div style={{ padding: "10px 12px 0" }}><Sec right={<span style={{ fontFamily: "var(--m)", fontSize: 8, color: C.dim }}>3 captures</span>}>Visual Audit</Sec></div>
          <div style={{ flex: 1, padding: "0 12px 12px", display: "flex", flexDirection: "column", gap: 8 }}>
            <div style={{ flex: 1, borderRadius: 3, border: `1px solid ${C.border}`, background: C.bg, display: "flex", alignItems: "center", justifyContent: "center", position: "relative", minHeight: 120, overflow: "hidden" }}>
              {SCREENSHOTS[shot].active && <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 1, background: `linear-gradient(90deg, transparent, ${C.orange}, transparent)`, animation: "scan 3s linear infinite" }} />}
              <div style={{ width: "80%", maxWidth: 230, background: C.surface, borderRadius: 4, border: `1px solid ${C.border}`, overflow: "hidden", boxShadow: "0 4px 16px #00000050" }}>
                <div style={{ height: 18, background: C.bg, borderBottom: `1px solid ${C.border}`, display: "flex", alignItems: "center", gap: 3, padding: "0 7px" }}>
                  {[C.red, C.amber, C.green].map((c, i) => <span key={i} style={{ width: 4, height: 4, borderRadius: "50%", background: c, opacity: .6 }} />)}
                  <span style={{ fontFamily: "var(--m)", fontSize: 6, color: C.dim, marginLeft: 5 }}>localhost:19000</span>
                </div>
                <div style={{ padding: 12, minHeight: 90 }}>
                  {shot === 0 && ["[kube-system] coredns: Ready", "[default] nginx: Serving", "[monitoring] prom: Scraping"].map((l, i) => (
                    <div key={i} style={{ fontFamily: "var(--m)", fontSize: 7, color: C.green, marginBottom: 2, opacity: .5 + i * .2 }}>{l}</div>
                  ))}
                  {shot === 1 && [["CRIT", C.red, "OOMKilled"], ["WARN", C.amber, "High CPU"], ["INFO", C.cyan, "Scaled"]].map(([s, c, m], i) => (
                    <div key={i} style={{ display: "flex", gap: 5, marginBottom: 2 }}>
                      <span style={{ fontFamily: "var(--m)", fontSize: 6, color: c, fontWeight: 700, width: 24 }}>{s}</span>
                      <span style={{ fontSize: 8, color: C.sub }}>{m}</span>
                    </div>
                  ))}
                  {shot === 2 && <div style={{ textAlign: "center" }}>
                    <div style={{ fontFamily: "var(--d)", fontSize: 11, fontWeight: 700, marginBottom: 10 }}>KubeCommand</div>
                    <div style={{ height: 18, background: C.bg, borderRadius: 2, border: `1px solid ${C.border}`, marginBottom: 6, display: "flex", alignItems: "center", padding: "0 7px" }}>
                      <span style={{ fontFamily: "var(--m)", fontSize: 7, color: C.dim }}>sk-••••</span>
                    </div>
                    <div style={{ height: 20, background: C.orange, borderRadius: 2, display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <span style={{ fontFamily: "var(--d)", fontSize: 8, fontWeight: 700, color: C.bg }}>CONNECT</span>
                    </div>
                  </div>}
                </div>
              </div>
              {SCREENSHOTS[shot].active && <div style={{ position: "absolute", bottom: 6, right: 6, display: "flex", alignItems: "center", gap: 4 }}>
                <div style={{ width: 4, height: 4, borderRadius: "50%", background: C.orange, animation: "glow 1.5s ease-in-out infinite" }} />
                <span style={{ fontFamily: "var(--m)", fontSize: 7, color: C.orange }}>building</span>
              </div>}
            </div>
            <div style={{ display: "flex", gap: 5 }}>
              {SCREENSHOTS.map((s, i) => (
                <button key={i} onClick={() => setShot(i)} style={{ flex: 1, padding: "5px 6px", borderRadius: 3, cursor: "pointer", background: i === shot ? C.raised : C.bg, border: `1px solid ${i === shot ? C.orange + "40" : C.border}`, textAlign: "left", transition: "all .2s" }}>
                  <div style={{ fontFamily: "var(--m)", fontSize: 7, fontWeight: 600, color: i === shot ? C.orange : C.dim }}>MOD {s.module}</div>
                  <div style={{ fontSize: 8, color: C.dim }}>{s.label}</div>
                </button>
              ))}
            </div>
            <div style={{ padding: 10, borderRadius: 3, background: C.bg, border: `1px solid ${C.border}` }}>
              <div style={{ fontFamily: "var(--d)", fontSize: 7, fontWeight: 700, color: C.amber, letterSpacing: "0.1em", marginBottom: 8 }}>BUSTER · LAST RUN</div>
              <div style={{ display: "flex", justifyContent: "space-around" }}>
                {[{ v: "12", l: "PASS", c: C.green }, { v: "0", l: "FAIL", c: C.red }, { v: "26m", l: "TIME", c: C.sub }].map(s => (
                  <div key={s.l} style={{ textAlign: "center" }}>
                    <div style={{ fontFamily: "var(--m)", fontSize: 16, fontWeight: 700, color: s.c }}>{s.v}</div>
                    <div style={{ fontFamily: "var(--d)", fontSize: 6, fontWeight: 600, color: C.dim, letterSpacing: "0.1em" }}>{s.l}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </Pan>
      </div>

      {/* ═══ TERMINAL ═══ */}
      <div style={{ flexShrink: 0, height: termH, transition: "height 0.3s ease", borderTop: `1px solid ${C.border}`, background: C.termBg, display: "flex", flexDirection: "column" }}>
        {/* terminal header */}
        <div onClick={() => setTermOpen(o => !o)} style={{
          height: 32, padding: "0 22px", display: "flex", alignItems: "center", justifyContent: "space-between",
          cursor: "pointer", borderBottom: `1px solid ${C.border}`, flexShrink: 0, userSelect: "none",
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontFamily: "var(--d)", fontSize: 9, fontWeight: 700, color: C.sub, letterSpacing: "0.12em" }}>AGENT STREAM</span>
            <Badge color={C.orange}>forge-pro</Badge>
            <span style={{ fontFamily: "var(--m)", fontSize: 8, color: C.dim }}>gemini-pro · module 10</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <div style={{ width: 4, height: 4, borderRadius: "50%", background: C.green, animation: "glow 1.5s ease-in-out infinite" }} />
              <span style={{ fontFamily: "var(--m)", fontSize: 7, color: C.green }}>STREAMING</span>
            </div>
            <span style={{ fontFamily: "var(--m)", fontSize: 12, color: C.dim, transform: termOpen ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.3s", display: "inline-block" }}>▾</span>
          </div>
        </div>
        {/* terminal body */}
        {termOpen && (
          <div ref={termRef} style={{ flex: 1, overflowY: "auto", padding: "8px 22px", fontFamily: "var(--m)", fontSize: 10, lineHeight: 1.65, color: C.termText }}>
            {termLines.map((line, i) => (
              <div key={i} style={{ animation: "fadeUp 0.15s ease", whiteSpace: "pre", minHeight: line === "" ? 10 : "auto" }}>
                {line.startsWith("forge-pro@") ? (
                  <><span style={{ color: C.orange }}>{line.split("$")[0]}$</span><span style={{ color: C.text }}>{line.split("$").slice(1).join("$")}</span></>
                ) : line.startsWith("✓") ? (
                  <span style={{ color: C.green }}>{line}</span>
                ) : line.startsWith("#") ? (
                  <span style={{ color: C.amber }}>{line}</span>
                ) : line.startsWith("  ") && line.includes(":") && !line.includes("//") ? (
                  <span style={{ color: "#7aa4c4" }}>{line}</span>
                ) : line}
              </div>
            ))}
            <span style={{ animation: "termCursor .8s step-end infinite", color: C.orange }}>▌</span>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ClawDeck));
  </script>
</body>
</html>
