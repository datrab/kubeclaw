<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline runtime flow</title>
  <desc id="desc">Nova CLI, config loading, run lock, module and gate execution, telemetry, artifacts, and terminal completion.</desc>
  <style>
    text { font: 14px Arial, sans-serif; fill: #172033; }
    .title { font-size: 20px; font-weight: 700; }
    .box { fill: #fff; stroke: #315a8c; stroke-width: 1.5; rx: 6; }
    .term { stroke: #7a4b8f; }
    .line { stroke: #53657d; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .label { font-size: 12px; fill: #3d4b5f; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#53657d"/></marker></defs>
  <text x="36" y="36" class="title">Pipeline Runtime Flow</text>
  <rect x="40" y="100" width="130" height="54" class="box"/><text x="74" y="132">CLI start</text>
  <rect x="215" y="100" width="150" height="54" class="box"/><text x="244" y="132">load config</text>
  <rect x="410" y="100" width="150" height="54" class="box"/><text x="441" y="132">run lock</text>
  <rect x="605" y="100" width="160" height="54" class="box"/><text x="630" y="132">reconcile state</text>
  <rect x="810" y="60" width="160" height="54" class="box"/><text x="846" y="92">module flow</text>
  <rect x="810" y="145" width="160" height="54" class="box"/><text x="853" y="177">gate flow</text>
  <rect x="810" y="245" width="160" height="54" class="box term"/><text x="840" y="277">terminal finish</text>
  <rect x="605" y="245" width="160" height="54" class="box"/><text x="637" y="277">telemetry</text>
  <rect x="410" y="245" width="150" height="54" class="box"/><text x="442" y="277">artifacts</text>
  <path d="M170 127 L215 127" class="line"/>
  <path d="M365 127 L410 127" class="line"/>
  <path d="M560 127 L605 127" class="line"/>
  <path d="M765 127 C786 127 789 87 810 87" class="line"/>
  <path d="M765 127 C786 127 789 172 810 172" class="line"/>
  <path d="M890 114 L890 145" class="line"/>
  <path d="M890 199 L890 245" class="line"/>
  <path d="M810 272 L765 272" class="line"/>
  <path d="M605 272 L560 272" class="line"/>
  <text x="240" y="88" class="label">swarm.config + progress.json</text>
  <text x="822" y="227" class="label">typed terminal status</text>
</svg>
