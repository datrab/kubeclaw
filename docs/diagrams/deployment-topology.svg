<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">KubeClaw deployment topology</title>
  <desc id="desc">Operator workstation, Kubernetes namespace, agents, infrastructure services, OpenClaw gateway, Discord, model providers, registry, and Tailscale ingress relationships.</desc>
  <style>
    text { font: 14px Arial, sans-serif; fill: #172033; }
    .title { font-size: 20px; font-weight: 700; }
    .group { fill: #f7f9fc; stroke: #8290a8; stroke-width: 1.5; rx: 8; }
    .box { fill: #ffffff; stroke: #315a8c; stroke-width: 1.5; rx: 6; }
    .infra { stroke: #4e7d43; }
    .external { stroke: #8a5a2b; }
    .line { stroke: #53657d; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 7 5; }
    .label { font-size: 12px; fill: #3d4b5f; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
