<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">Buster worker flow</title>
  <desc id="desc">Buster readiness, Redis task consumption, validation, suite execution, output, completion, dead-letter, and ACK behavior.</desc>
  <style>
    text { font: 14px Arial, sans-serif; fill: #172033; }
    .title { font-size: 20px; font-weight: 700; }
    .box { fill: #fff; stroke: #315a8c; stroke-width: 1.5; rx: 6; }
    .bad { stroke: #a33d3d; }
    .line { stroke: #53657d; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .label { font-size: 12px; fill: #3d4b5f; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#53657d"/></marker></defs>
  <text x="36" y="36" class="title">Buster Worker Flow</text>
  <rect x="50" y="85" width="150" height="50" class="box"/><text x="83" y="115">gateway ready</text>
  <rect x="250" y="85" width="150" height="50" class="box"/><text x="282" y="115">Redis task</text>
  <rect x="450" y="85" width="150" height="50" class="box"/><text x="486" y="115">validate</text>
  <rect x="650" y="85" width="150" height="50" class="box"/><text x="684" y="115">run suites</text>
  <rect x="850" y="85" width="150" height="50" class="box"/><text x="878" y="115">completion</text>
  <rect x="450" y="230" width="150" height="50" class="box bad"/><text x="481" y="260">dead-letter</text>
  <rect x="650" y="230" width="150" height="50" class="box"/><text x="679" y="260">task output</text>
  <rect x="850" y="230" width="150" height="50" class="box"/><text x="907" y="260">ACK</text>
  <path d="M200 110 L250 110" class="line"/>
  <path d="M400 110 L450 110" class="line"/>
  <path d="M600 110 L650 110" class="line"/>
  <path d="M800 110 L850 110" class="line"/>
  <path d="M525 135 L525 230" class="line"/>
  <path d="M725 135 L725 230" class="line"/>
  <path d="M600 255 L650 255" class="line"/>
  <path d="M800 255 L850 255" class="line"/>
  <path d="M925 135 L925 230" class="line"/>
  <text x="462" y="205" class="label">invalid payload</text>
  <text x="678" y="205" class="label">suite evidence</text>
  <text x="824" y="305" class="label">only after completion or dead-letter</text>
</svg>
