<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">Secret setup flow</title>
  <desc id="desc">How operator inputs and setup-secrets create Kubernetes secrets used by agents and infrastructure components.</desc>
  <style>
    text { font: 14px Arial, sans-serif; fill: #172033; }
    .title { font-size: 20px; font-weight: 700; }
    .box { fill: #fff; stroke: #315a8c; stroke-width: 1.5; rx: 6; }
    .secret { stroke: #7a4b8f; }
    .line { stroke: #53657d; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .label { font-size: 12px; fill: #3d4b5f; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#53657d"/></marker></defs>
  <text x="36" y="36" class="title">Secret Flow</text>
  <rect x="50" y="90" width="170" height="55" class="box"/><text x="83" y="122">Operator inputs</text>
  <rect x="280" y="90" width="190" height="55" class="box"/><text x="302" y="122">scripts/deploy.sh secrets</text>
  <rect x="530" y="90" width="210" height="55" class="box"/><text x="555" y="122">my-values/setup-secrets.sh</text>
  <rect x="800" y="55" width="170" height="48" class="box secret"/><text x="829" y="85">agent secrets</text>
  <rect x="800" y="120" width="170" height="48" class="box secret"/><text x="827" y="150">litellm secrets</text>
  <rect x="800" y="185" width="170" height="48" class="box secret"/><text x="825" y="215">postgres secrets</text>
  <rect x="800" y="250" width="170" height="48" class="box secret"/><text x="832" y="280">redis secrets</text>
  <rect x="800" y="315" width="170" height="48" class="box secret"/><text x="817" y="345">operator-oauth</text>
  <rect x="530" y="250" width="210" height="55" class="box"/><text x="557" y="282">kubectl get secret</text>
  <path d="M220 118 L280 118" class="line"/>
  <path d="M470 118 L530 118" class="line"/>
  <path d="M740 118 C765 118 770 79 800 79" class="line"/>
  <path d="M740 118 L800 144" class="line"/>
  <path d="M740 118 C766 150 770 209 800 209" class="line"/>
  <path d="M740 118 C770 180 770 274 800 274" class="line"/>
  <path d="M740 118 C780 220 765 339 800 339" class="line"/>
  <path d="M635 145 L635 250" class="line"/>
  <text x="238" y="105" class="label">normal secret path</text>
  <text x="548" y="225" class="label">verify ownership and keys</text>
</svg>
