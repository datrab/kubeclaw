<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">Final preview Tailscale flow</title>
  <desc id="desc">Buster final preview deployment through registry, namespace, service, Tailscale Ingress, tailnet URL, and operator/user access.</desc>
  <style>
    text { font: 14px Arial, sans-serif; fill: #172033; }
    .title { font-size: 20px; font-weight: 700; }
    .box { fill: #fff; stroke: #315a8c; stroke-width: 1.5; rx: 6; }
    .infra { stroke: #4e7d43; }
    .line { stroke: #53657d; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .label { font-size: 12px; fill: #3d4b5f; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#53657d"/></marker></defs>
  <text x="36" y="36" class="title">Final Preview And Tailscale Flow</text>
  <rect x="50" y="100" width="150" height="54" class="box"/><text x="80" y="132">Buster k8s</text>
  <rect x="250" y="100" width="150" height="54" class="box infra"/><text x="283" y="132">local registry</text>
  <rect x="450" y="100" width="150" height="54" class="box"/><text x="480" y="132">test namespace</text>
  <rect x="650" y="55" width="150" height="54" class="box"/><text x="695" y="87">Service</text>
  <rect x="650" y="145" width="150" height="54" class="box"/><text x="693" y="177">Ingress</text>
  <rect x="850" y="145" width="150" height="54" class="box infra"/><text x="877" y="177">Tailscale op</text>
  <rect x="850" y="250" width="150" height="54" class="box infra"/><text x="902" y="282">Tailnet</text>
  <rect x="450" y="250" width="150" height="54" class="box"/><text x="477" y="282">credentials ref</text>
  <rect x="650" y="250" width="150" height="54" class="box"/><text x="683" y="282">Discord note</text>
  <path d="M200 127 L250 127" class="line"/>
  <path d="M400 127 L450 127" class="line"/>
  <path d="M600 127 C620 127 630 82 650 82" class="line"/>
  <path d="M600 127 C620 127 630 172 650 172" class="line"/>
  <path d="M800 172 L850 172" class="line"/>
  <path d="M925 199 L925 250" class="line"/>
  <path d="M600 277 L650 277" class="line"/>
  <path d="M800 277 L850 277" class="line"/>
