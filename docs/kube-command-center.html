function Sidebar({page,go}){
  const [open,setOpen]=useState(()=>{const o={};NAV.forEach(s=>o[s.s]=true);return o});
  const toggle=s=>setOpen(p=>({...p,[s]:!p[s]}));
  return <div style={{width:228,minWidth:228,background:C.bg1,borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",height:"100%"}}>
    <div style={{padding:"16px 14px 12px",borderBottom:`1px solid ${C.border}`}}>
      <div style={{display:"flex",alignItems:"center",gap:9}}>
        <div style={{width:32,height:32,borderRadius:8,background:`linear-gradient(135deg,${C.accent},#c47820)`,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:mono,fontWeight:800,fontSize:13,color:C.bg0,boxShadow:`0 0 14px ${C.accentGlow}`}}>KC</div>

      </div>
    </div>
    <div style={{flex:1,padding:"6px 6px",overflowY:"auto"}}>
      {NAV.map(sec=><div key={sec.s}style={{marginBottom:2}}>
        <div onClick={()=>toggle(sec.s)}style={{display:"flex",alignItems:"center",gap:6,padding:"6px 8px",cursor:"pointer",userSelect:"none",borderRadius:5}}>
          {open[sec.s]?<ChevronDown size={12}color={C.textM}/>:<ChevronRight size={12}color={C.textM}/>}
          <span style={{fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:".08em",color:C.textM,fontFamily:mono}}>{sec.s}</span>
        </div>
        {open[sec.s]&&sec.items.map(it=>{const a=page===it.r;return <div key={it.r}onClick={()=>go(it.r)}style={{display:"flex",alignItems:"center",gap:8,padding:"5px 10px 5px 26px",borderRadius:6,cursor:"pointer",marginBottom:1,background:a?C.accentDim:"transparent",color:a?C.accent:C.textS,fontWeight:a?500:400,fontSize:13,borderLeft:a?`2px solid ${C.accent}`:"2px solid transparent",transition:"background .1s"}}>
          <it.icon size={14}style={{opacity:a?1:.55,flexShrink:0}}/><span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.l}</span>
          {it.b&&<span style={{marginLeft:"auto",fontSize:9.5,fontFamily:mono,fontWeight:600,padding:"1px 5px",borderRadius:8,background:C.redDim,color:C.red}}>{it.b}</span>}
        </div>})}
      </div>)}

    </div>
  </div>;
}

/* ── Alerts ─────────────────────────────────────── */
function AlertsPage(){
  const[sev,setSev]=useState("all"),[res,setRes]=useState("active");
  const cr=ALERTS.filter(a=>a.sev==="critical"&&!a.resolved).length,wr=ALERTS.filter(a=>a.sev==="warning"&&!a.resolved).length;
  const list=ALERTS.filter(a=>(sev==="all"||a.sev===sev)&&(res==="all"||(res==="active"?!a.resolved:!!a.resolved)));
  const FB=({v,g,children})=>{const ac=(g==="s"?sev:res)===v;return <Btn sm onClick={()=>g==="s"?setSev(v):setRes(v)}style={ac?{borderColor:C.accent,color:C.accent,background:C.accentDim}:{}}>{children}</Btn>};
  return <div>
    <Panel style={{marginBottom:14,padding:"10px 16px",display:"flex",alignItems:"center",gap:18}}>
      <span style={{display:"flex",alignItems:"center",gap:6}}><Dot color={C.red}/><span style={{fontFamily:mono,fontSize:13,fontWeight:700,color:C.text}}>{cr}</span><span style={{fontSize:11.5,color:C.textM}}>Critical</span></span>
      <span style={{display:"flex",alignItems:"center",gap:6}}><Dot color={C.amber}/><span style={{fontFamily:mono,fontSize:13,fontWeight:700,color:C.text}}>{wr}</span><span style={{fontSize:11.5,color:C.textM}}>Warning</span></span>
    </Panel>
    <Panel><div style={{display:"flex",alignItems:"center",gap:6,padding:"10px 14px",borderBottom:`1px solid ${C.border}`,flexWrap:"wrap"}}>
      <FB v="all"g="s">All</FB><FB v="critical"g="s">Critical</FB><FB v="warning"g="s">Warning</FB><FB v="info"g="s">Info</FB>
      <div style={{width:1,height:16,background:C.border,margin:"0 3px"}}/>
      <FB v="all"g="r">All</FB><FB v="active"g="r">Active</FB><FB v="resolved"g="r">Resolved</FB>
    </div>
    {list.map(a=><div key={a.id}style={{display:"flex",alignItems:"flex-start",gap:9,padding:"9px 14px",borderBottom:`1px solid ${C.border}15`,opacity:a.resolved?.45:1}}>
      <Dot color={a.sev==="critical"?C.red:a.sev==="warning"?C.amber:C.blue}sz={7}/>
      <Badge color={a.sev==="critical"?C.red:a.sev==="warning"?C.amber:C.blue}bg={a.sev==="critical"?C.redDim:a.sev==="warning"?C.amberDim:C.blueDim}>{a.sev}</Badge>
      <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600,fontFamily:mono,color:C.text}}>{a.name}</div><div style={{fontSize:11.5,color:C.textS}}>{a.msg}</div></div>
      <div style={{fontSize:10.5,fontFamily:mono,color:C.textM}}>{a.fired}</div>
    </div>)}</Panel>
  </div>;
}

/* ── Terminal ──────────────────────────────────── */

    <Panel style={{padding:22,marginBottom:16}}>
      <div style={{fontSize:15,fontWeight:700,color:C.text,marginBottom:4,display:"flex",alignItems:"center",gap:8}}><SquareTerminal size={17}color={C.accent}/>Pod Exec Terminal</div>
      <div style={{fontSize:12.5,color:C.textS,marginBottom:18}}>Open an interactive shell into a running container. Opens in a new window.</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
        <div><label style={{display:"block",fontSize:11.5,fontWeight:500,color:C.textS,marginBottom:4}}>Namespace</label>
          <Sel value={ns}onChange={e=>{setNs(e.target.value);setPod("")}}style={{width:"100%"}}>{nss.map(n=><option key={n}value={n}>{n}</option>)}</Sel></div>
        <div><label style={{display:"block",fontSize:11.5,fontWeight:500,color:C.textS,marginBottom:4}}>Pod</label>
          <Sel value={pod}onChange={e=>setPod(e.target.value)}style={{width:"100%"}}><option value="">Select pod...</option>{podsInNs.map(p=><option key={p.name}value={p.name}>{p.name}</option>)}</Sel></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}}>
        <div><label style={{display:"block",fontSize:11.5,fontWeight:500,color:C.textS,marginBottom:4}}>Container</label>
          <Sel style={{width:"100%"}}><option>main</option></Sel></div>
        <div><label style={{display:"block",fontSize:11.5,fontWeight:500,color:C.textS,marginBottom:4}}>Shell</label>
          <Sel style={{width:"100%"}}><option>/bin/sh</option><option>/bin/bash</option></Sel></div>
      </div>

      <div style={{background:"#0c0a08",padding:16,fontFamily:mono,fontSize:12,lineHeight:1.8,color:C.green,minHeight:180}}>
        <div style={{color:C.textM}}>$ kubectl exec -it {pod||"<pod>"} -n {ns} -- /bin/sh</div>
        {pod&&<><div style={{color:C.textS}}>Connecting to {pod}...</div>
        <div><span style={{color:C.accent}}>/ #</span> <span style={{borderRight:`2px solid ${C.accent}`,paddingRight:2,animation:"kcblink 1s step-end infinite"}}>_</span></div></>}
        {!pod&&<div style={{color:C.textM,marginTop:8}}>Select a pod to start a terminal session.</div>}
      </div>
    </Panel>
  </div>;
}

/* ── Settings ──────────────────────────────────── */

/* ── Setup ─────────────────────────────────────── */
function SetupPage({onLogin}){
  const[step,setStep]=useState(1),[show,setShow]=useState(false),[key,setKey]=useState("");
  const Logo=()=><div style={{width:50,height:50,borderRadius:12,margin:"0 auto 16px",background:`linear-gradient(135deg,${C.accent},#c47820)`,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:mono,fontWeight:800,fontSize:19,color:C.bg0,boxShadow:`0 0 28px ${C.accentGlow}`}}>KC</div>;
  return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:C.bg0,fontFamily:sans,color:C.text,position:"relative"}}>
    <div style={{position:"absolute",width:450,height:450,borderRadius:"50%",background:`radial-gradient(circle,${C.accentGlow},transparent 70%)`,top:"50%",left:"50%",transform:"translate(-50%,-50%)"}}/>
    <div style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:14,padding:36,width:380,textAlign:"center",position:"relative",zIndex:1,boxShadow:`0 16px 40px ${C.bg0}cc`}}>
      <Logo/>
      {step===1?<><h1 style={{fontSize:20,fontWeight:700,marginBottom:6}}>Welcome to KubeCommand</h1>
        <p style={{fontSize:13.5,color:C.textS,marginBottom:24,lineHeight:1.5}}>Self-hosted Kubernetes management.</p>
        <Btn primary style={{width:"100%",justifyContent:"center",padding:"10px 20px",fontSize:14}}onClick={()=>setStep(2)}>Get Started</Btn></>
      :<><h1 style={{fontSize:20,fontWeight:700,marginBottom:6}}>Enter API Key</h1>
        <p style={{fontSize:13.5,color:C.textS,marginBottom:22,lineHeight:1.5}}>Connect to your backend.</p>
        <div style={{textAlign:"left",marginBottom:12}}>
          <label style={{display:"block",fontSize:11.5,fontWeight:500,color:C.textS,marginBottom:4}}>API Key</label>
          <div style={{position:"relative"}}><input type={show?"text":"password"}placeholder="kc_xxxx"value={key}onChange={e=>setKey(e.target.value)}onKeyDown={e=>e.key==="Enter"&&key&&onLogin()}style={{width:"100%",padding:"9px 40px 9px 12px",background:C.bg3,border:`1px solid ${C.border}`,borderRadius:7,color:C.text,fontFamily:mono,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
            <button onClick={()=>setShow(!show)}style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:C.textM,cursor:"pointer"}}>{show?<EyeOff size={15}/>:<Eye size={15}/>}</button></div>
        </div>
        <Btn primary style={{width:"100%",justifyContent:"center",padding:"10px 20px",fontSize:14}}onClick={()=>key&&onLogin()}>Connect</Btn>
        <div style={{marginTop:12,fontSize:11.5,color:C.textM}}><span onClick={()=>setStep(1)}style={{cursor:"pointer",color:C.accent}}>← Back</span></div></>}
    </div>
  </div>;
}

/* ═══ APP ═══════════════════════════════════════ */
function App(){
  const[page,setPage]=useState("setup"),[auth,setAuth]=useState(false);
  if(!auth)return <SetupPage onLogin={()=>{setAuth(true);setPage("dashboard")}}/>;
  const P={dashboard:<DashboardPage go={setPage}/>,directory:<DirectoryPage/>,pods:<PodsPage/>,deployments:<DeploymentsPage/>,nodes:<NodesPage/>,services:<ServicesPage/>,cronjobs:<CronJobsPage/>,storage:<StoragePage/>,events:<EventsPage/>,configmaps:<ConfigMapsPage/>,secrets:<SecretsPage/>,helm:<HelmPage/>,yamlapply:<YamlApplyPage/>,repos:<ReposPage/>,deploy:<DeployPage/>,alerts:<AlertsPage/>,terminal:<TerminalPage/>,settings:<SettingsPage/>};
  return <div style={{display:"flex",height:"100vh",overflow:"hidden",background:C.bg0,fontFamily:sans,color:C.text}}>
    <Sidebar page={page}go={setPage}/>
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <TopBar page={page}/>
      <div style={{flex:1,overflowY:"auto",padding:20}}>{P[page]||P.dashboard}</div>

}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
