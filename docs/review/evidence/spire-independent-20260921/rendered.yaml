        "default_jwt_svid_ttl": "1h",
        "default_x509_svid_ttl": "4h",
        "disable_jwt_svids": true,
        "jwt_issuer": "https://oidc-discovery.kubeclaw.internal",
        "log_format": "text",
        "log_level": "info",
