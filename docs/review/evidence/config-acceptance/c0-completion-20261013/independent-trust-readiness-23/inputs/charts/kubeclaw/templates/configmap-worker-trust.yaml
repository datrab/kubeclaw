{{- if .Values.workerTrust.spiffe.enabled }}
{{- if not .Values.serviceAccount.create }}
{{- fail "workerTrust.spiffe requires serviceAccount.create=true for the actual release ServiceAccount" }}
{{- end }}
{{- $trustDomain := required "workerTrust.spiffe.trustDomain is required" .Values.workerTrust.spiffe.trustDomain }}
{{- $namespace := .Release.Namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeclaw.fullname" . }}-worker-trust
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    node:
      id: {{ printf "%s.%s" (include "kubeclaw.fullname" .) $namespace | quote }}
      cluster: {{ printf "kubeclaw-%s" .Values.agentRole | quote }}
    admin:
      address: { socket_address: { address: 127.0.0.1, port_value: 9901 } }
    static_resources:
      listeners:
        {{- include "kubeclaw.trustReadinessListeners" (dict "identity" (printf "spiffe://%s/ns/%s/sa/%s" $trustDomain $namespace (include "kubeclaw.fullname" .)) "trustDomain" $trustDomain) | nindent 8 }}
      {{- if eq .Values.agentRole "nova" }}
      {{- range $listener := list (dict "name" "buster-plan" "port" 28891 "cluster" "buster-plan") (dict "name" "prism-agent" "port" 28080 "cluster" "prism-agent") }}
        - name: {{ $listener.name }}-egress
          address: { socket_address: { address: 127.0.0.1, port_value: {{ $listener.port }} } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: {{ $listener.name }}
                    cluster: {{ $listener.cluster }}
      {{- end }}
      {{- else if eq .Values.agentRole "buster" }}
      {{- range $listener := list (dict "name" "buster-plan" "port" 18891 "localPort" 28891) }}
        - name: {{ $listener.name }}-ingress
          address: { socket_address: { address: 0.0.0.0, port_value: {{ $listener.port }} } }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_certificate_sds_secret_configs:
                      - name: default
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }]
                    combined_validation_context:
                      default_validation_context:
                        match_typed_subject_alt_names:
                          - san_type: URI
                            matcher: { exact: {{ printf "spiffe://%s/ns/%s/sa/agent-nova" $trustDomain $namespace | quote }} }
                      validation_context_sds_secret_config:
                        name: {{ printf "spiffe://%s" $trustDomain | quote }}
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }]
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: {{ $listener.name }}
                    forward_client_cert_details: SANITIZE_SET
                    set_current_client_cert_details: { uri: true }
                    route_config:
                      name: local
                      virtual_hosts:
                        - name: local
                          domains: ["*"]
                          routes: [{ match: { prefix: "/" }, route: { cluster: {{ $listener.name }}-local } }]
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
      {{- end }}
      {{- else if eq .Values.agentRole "prism" }}
        - name: prism-dispatch-ingress
          address: { socket_address: { address: 0.0.0.0, port_value: 18082 } }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_certificate_sds_secret_configs:
                      - name: default
                        sds_config: { resource_api_version: V3, api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }] } }
                    combined_validation_context:
                      default_validation_context:
                        match_typed_subject_alt_names:
                          - { san_type: URI, matcher: { exact: {{ printf "spiffe://%s/ns/%s/sa/agent-nova" $trustDomain $namespace | quote }} } }
                          - { san_type: URI, matcher: { exact: {{ printf "spiffe://%s/ns/%s/sa/prism-control" $trustDomain $namespace | quote }} } }
                          - { san_type: URI, matcher: { exact: {{ printf "spiffe://%s/ns/%s/sa/prism-test-runner" $trustDomain $namespace | quote }} } }
                      validation_context_sds_secret_config:
                        name: {{ printf "spiffe://%s" $trustDomain | quote }}
                        sds_config: { resource_api_version: V3, api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }] } }
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: prism-dispatch
                    forward_client_cert_details: SANITIZE_SET
                    set_current_client_cert_details: { uri: true }
                    route_config: { name: local, virtual_hosts: [{ name: local, domains: ["*"], routes: [{ match: { prefix: "/" }, route: { cluster: prism-bridge-local } }] }] }
                    http_filters: [{ name: envoy.filters.http.router, typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router } }]
        - name: prism-control-egress
          address: { socket_address: { address: 127.0.0.1, port_value: 28080 } }
          filter_chains: [{ filters: [{ name: envoy.filters.network.tcp_proxy, typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy, stat_prefix: prism-control, cluster: prism-control } }] }]
      {{- else }}
      {{- fail "workerTrust.spiffe is supported only for nova, buster, and prism agent roles" }}
      {{- end }}
      clusters:
        {{- include "kubeclaw.trustReadinessCluster" (dict "identity" (printf "spiffe://%s/ns/%s/sa/%s" $trustDomain $namespace (include "kubeclaw.fullname" .)) "trustDomain" $trustDomain) | nindent 8 }}
        - name: spire-agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment:
            cluster_name: spire-agent
            endpoints: [{ lb_endpoints: [{ endpoint: { address: { pipe: { path: {{ .Values.workerTrust.spiffe.socketPath | quote }} } } } }] }]
      {{- if eq .Values.agentRole "nova" }}
      {{- range $cluster := list (dict "name" "buster-plan" "host" "agent-buster" "port" 18891 "peer" "agent-buster") (dict "name" "prism-agent" "host" "agent-prism" "port" 8080 "peer" "agent-prism") }}
        - name: {{ $cluster.name }}
          connect_timeout: 3s
          type: STRICT_DNS
          load_assignment:
            cluster_name: {{ $cluster.name }}
            endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: {{ $cluster.host }}, port_value: {{ $cluster.port }} } } } }] }]
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: default
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }]
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher: { exact: {{ printf "spiffe://%s/ns/%s/sa/%s" $trustDomain $namespace $cluster.peer | quote }} }
                  validation_context_sds_secret_config:
                    name: {{ printf "spiffe://%s" $trustDomain | quote }}
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }]
      {{- end }}
      {{- end }}
      {{- if eq .Values.agentRole "buster" }}
      {{- range $cluster := list (dict "name" "buster-plan" "port" 28891) }}
        - name: {{ $cluster.name }}-local
          connect_timeout: 1s
          type: STATIC
          load_assignment:
            cluster_name: {{ $cluster.name }}-local
            endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: {{ $cluster.port }} } } } }] }]
      {{- end }}
      {{- end }}
      {{- if eq .Values.agentRole "prism" }}
        - name: prism-bridge-local
          connect_timeout: 1s
          type: STATIC
          load_assignment: { cluster_name: prism-bridge-local, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 18080 } } } }] }] }
        - name: prism-control
          connect_timeout: 3s
          type: STRICT_DNS
          load_assignment: { cluster_name: prism-control, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: prism-control-internal, port_value: 8443 } } } }] }] }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: default
                    sds_config: { resource_api_version: V3, api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }] } }
                combined_validation_context:
                  default_validation_context: { match_typed_subject_alt_names: [{ san_type: URI, matcher: { exact: {{ printf "spiffe://%s/ns/%s/sa/prism-control" $trustDomain $namespace | quote }} } }] }
                  validation_context_sds_secret_config:
                    name: {{ printf "spiffe://%s" $trustDomain | quote }}
                    sds_config: { resource_api_version: V3, api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }] } }
      {{- end }}
{{- end }}
