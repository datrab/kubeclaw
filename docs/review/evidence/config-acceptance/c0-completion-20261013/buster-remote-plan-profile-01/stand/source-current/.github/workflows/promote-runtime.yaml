name: Promote image release
on:
  workflow_dispatch:
    inputs:
      family:
        description: Image family to select
        required: true
        type: choice
        default: runtime
        options: [runtime, ops]
      source_run_id:
        description: Successful main build run ID for the selected image family
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: promote-${{ inputs.family }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      RELEASE_FAMILY: ${{ inputs.family }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Verify source run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          case "$RELEASE_FAMILY" in
            runtime) source_workflow=.github/workflows/build-images.yaml ;;
            ops) source_workflow=.github/workflows/build-ops-mcp.yaml ;;
            *) exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          jq -e --arg workflow "$source_workflow" '.conclusion == "success" and .head_branch == "main" and .path == $workflow and (.event == "push" or .event == "workflow_dispatch")' "$RUNNER_TEMP/source-run.json"
          echo "SOURCE_COMMIT=$(jq -r .head_sha "$RUNNER_TEMP/source-run.json")" >> "$GITHUB_ENV"
          attempt="$(jq -r .run_attempt "$RUNNER_TEMP/source-run.json")"
          mkdir -p releases
          gh release download "$RELEASE_FAMILY-images-$RUN_ID-$attempt" --repo "$GITHUB_REPOSITORY" --pattern "$RELEASE_FAMILY-images.json" --dir releases --clobber
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        if: inputs.family == 'runtime' && vars.GITOPS_ENABLED == 'true'
        with:
          version: v3.18.4
      - name: Prepare release selection and values
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/updates/verify-release-source.mjs
          node scripts/updates/materialize-release.mjs "--family=$RELEASE_FAMILY"
      - name: Scan the selected immutable artifacts before proposing promotion
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          mapfile -t images < <(jq -r '.images[]' "releases/$RELEASE_FAMILY-images.json")
          bash scripts/scan-runtime-images.sh "${images[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proposed-runtime-release
          path: releases/
          if-no-files-found: error
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.DEPENDENCY_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Open release selection PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_ID: ${{ inputs.source_run_id }}
          GITOPS_ENABLED: ${{ vars.GITOPS_ENABLED }}
          CODE_BUNDLE_GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          branch="release/$RELEASE_FAMILY-$RUN_ID"
          git switch -c "$branch"
          git config user.name kubeclaw-updates
          git config user.email kubeclaw-updates@users.noreply.github.com
          if [[ "$RELEASE_FAMILY" == runtime && "$GITOPS_ENABLED" == true ]]; then
            bundle="releases/gitops/runtime-$RUN_ID-$(jq -r .sourceRunAttempt releases/runtime-images.json)"
            node scripts/gitops-continuous.mjs export "$bundle"
          fi
          git add releases
          git commit -m "Select tested $RELEASE_FAMILY images from run $RUN_ID"
          if [[ "$RELEASE_FAMILY" == runtime && "$GITOPS_ENABLED" == true ]]; then
            node scripts/gitops-continuous.mjs prepare "$bundle" "https://github.com/$GITHUB_REPOSITORY.git" "$(git rev-parse HEAD)"
            git add gitops/production
            git commit -m "Prepare production Argo deployment"
            node scripts/gitops-continuous.mjs check "$bundle" "https://github.com/$GITHUB_REPOSITORY.git" "$(git rev-parse HEAD)"
          fi
          gh auth setup-git
          git push origin "$branch"
          printf 'Select immutable image digests from successful main run %s, source commit %s. No images are rebuilt and no deployment is performed. Review the generated values before rollout.\n' "$RUN_ID" "$SOURCE_COMMIT" > "$RUNNER_TEMP/release-body.md"
          if [[ "$RELEASE_FAMILY" == runtime && "$GITOPS_ENABLED" == true ]]; then
            printf '\nThis PR includes the production Argo manifests. Once continuous GitOps has been bootstrapped, merging this PR authorizes Argo to deploy it automatically. Review gitops/production/apps/applications.yaml and the referenced release bundle.\n' >> "$RUNNER_TEMP/release-body.md"
          fi
          gh pr create --base main --head "$branch" --title "Select $RELEASE_FAMILY release $RUN_ID" --body-file "$RUNNER_TEMP/release-body.md"
