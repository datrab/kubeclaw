---
# Source: kubeclaw/templates/buster-namespace-fence.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-buster-58ac4314-namespace-fence
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["namespaces"]
        operations: ["CREATE", "DELETE"]
  matchConditions:
    - name: broker-identity
      expression: "request.userInfo.username in [\"system:serviceaccount:native-alternate-a:agent-buster-namespace-controller\", \"system:serviceaccount:native-alternate-a:agent-buster\"]"
  variables:
    - name: target
      expression: 'request.operation == "DELETE" ? oldObject : object'
  validations:
    - expression: "request.userInfo.username != \"system:serviceaccount:native-alternate-a:agent-buster\""
      message: Buster must request a lease rather than creating or deleting namespaces directly.
    - expression: >-
        ["proofa"].exists(prefix, variables.target.metadata.name.startsWith(prefix + "-")) &&
        has(variables.target.metadata.labels) &&
        "kubeclaw/managed-by" in variables.target.metadata.labels &&
        variables.target.metadata.labels["kubeclaw/managed-by"] == "buster-namespace-controller"
      message: Broker may only create or delete managed namespaces with configured prefixes.
---
# Source: kubeclaw/templates/buster-namespace-fence.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-buster-58ac4314-namespace-fence
spec:
  policyName: agent-buster-58ac4314-namespace-fence
  validationActions: [Deny]
