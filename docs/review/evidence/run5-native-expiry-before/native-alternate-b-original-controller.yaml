---
# Source: kubeclaw/templates/buster-namespace-controller.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-buster-namespace-controller
  namespace: native-alternate-b
  labels:
    app.kubernetes.io/name: kubeclaw
    app.kubernetes.io/instance: native-b
    app.kubernetes.io/component: buster
    app.kubernetes.io/managed-by: Helm
    kubeclaw/role: buster
    kubeclaw/controller: buster-namespace-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeclaw
      app.kubernetes.io/instance: native-b
      app.kubernetes.io/component: buster-namespace-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeclaw
        app.kubernetes.io/instance: native-b
        app.kubernetes.io/component: buster-namespace-controller
        kubeclaw/role: buster
    spec:
      serviceAccountName: agent-buster-namespace-controller
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: controller
          image: "ghcr.io/datrab/kubeclaw-namespace-controller:latest"
          imagePullPolicy: Always
          command:
            - /app/buster-namespace-controller
          env:
            - name: KUBECLAW_NAMESPACE
              value: "native-alternate-b"
            - name: BUSTER_CONTROLLER_SERVICE_ACCOUNT
              value: "agent-buster-namespace-controller"
            - name: BUSTER_SECRET_ROLE_NAME
              value: "agent-buster-controller-secrets"
            - name: BUSTER_DEPLOYER_ROLE_NAME
              value: "agent-buster-namespace-deployer"
            - name: BUSTER_TESTER_ROLE_NAME
              value: "agent-buster-namespace-tester"
            - name: BUSTER_ALLOWED_ACCESS_JSON
              value: "[{\"modes\":[\"deployer\"],\"subject\":\"kubeclaw/agent-nova\"},{\"modes\":[\"deployer\",\"tester\"],\"subject\":\"kubeclaw/agent-buster\"}]"
            - name: BUSTER_ALLOWED_SOURCE_SECRETS
              value: "kubeclaw-fixture-preflight,prism-test-provider,prism-test-runtime,prism-test-postgresql-auth,prism-test-ghcr"
            - name: BUSTER_LEASE_API_GROUP
              value: "kubeclaw.forgestack.ai"
            - name: BUSTER_LEASE_API_VERSION
              value: "v1alpha1"
            - name: BUSTER_ALLOWED_NAMESPACE_PREFIXES
              value: "proofb"
            - name: BUSTER_DEFAULT_TTL_SECONDS
              value: "7200"
            - name: BUSTER_MAX_TTL_SECONDS
              value: "86400"
            - name: BUSTER_CONTROLLER_POLL_MS
              value: "3000"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
