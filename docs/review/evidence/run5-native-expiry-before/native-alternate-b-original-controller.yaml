---
# Source: kubeclaw/templates/buster-namespace-controller.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-buster-namespace-deployer
rules:
  # Deployer subjects are explicitly allowlisted trusted agents. They need full
  # Service lifecycle access for Helm; external Service forms are rejected at
  # the broker manifest boundary because Kubernetes RBAC cannot filter spec.type.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  # A deployer can already project any Secret into a Pod it creates. Direct
  # read access avoids that indirect path for copied, lease-scoped credentials.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
---
# Source: kubeclaw/templates/buster-namespace-controller.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-buster-namespace-tester
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
---
