<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KubeClaw Pipeline — Vollständiger Ablauf</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #06090f;
      --panel: #0d1117;
      --card: #151b25;
      --border: #1e293b;
      --border-light: #2d3a4d;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --happy: #10b981;
      --happy-bg: #10b98115;
      --retry: #f59e0b;
      --retry-bg: #f59e0b12;
      --fail: #ef4444;
      --fail-bg: #ef444412;
      --timeout: #8b5cf6;
      --rate-limit: #3b82f6;
      --blocked: #dc2626;
      --info: #06b6d4;
      --gate: #ec4899;
      --gate-bg: #ec489912;
      --nova: #f97316;
      --forge: #a78bfa;
      --buster: #34d399;
      --review: #f472b6;
    }
    body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; }
    
    .header { padding: 24px 32px; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1.5px; }
    .header p { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
    
    .tabs { display: flex; gap: 6px; padding: 12px 32px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .tab { padding: 7px 16px; font-size: 11px; font-family: inherit; background: transparent; color: var(--text-dim);
           border: 1px solid var(--border); border-radius: 5px; cursor: pointer; transition: all 0.2s; }
    .tab:hover { color: var(--text-muted); border-color: var(--border-light); }
    .tab.active { background: var(--card); color: var(--text); border-color: var(--border-light); }
    
    .content { padding: 24px 32px; overflow-x: auto; }
    .view-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .view-subtitle { font-size: 11px; color: var(--text-dim); margin-bottom: 24px; }
    
    /* ── Pipeline Timeline ── */
    .pipeline { display: flex; flex-direction: column; gap: 0; position: relative; min-width: 1100px; }
    
    .step { display: flex; align-items: stretch; gap: 0; position: relative; }
    .step-connector { width: 48px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .step-connector .line { width: 2px; flex: 1; background: var(--border-light); }
    .step-connector .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid; flex-shrink: 0; z-index: 1; }
    .step-connector .dot.happy { border-color: var(--happy); background: var(--happy-bg); }
    .step-connector .dot.gate { border-color: var(--gate); background: var(--gate-bg); }
    .step-connector .dot.done { border-color: var(--happy); background: var(--happy); }
    
    .step-body { flex: 1; padding: 12px 0; }
    
    /* ── Module Card ── */
    .module-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
                   padding: 20px 24px; margin-bottom: 4px; }
    .module-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .module-id { font-size: 13px; font-weight: 700; color: var(--text); background: var(--panel);
                 padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border-light); }
    .module-title { font-size: 13px; color: var(--text-muted); }
    .module-stages { font-size: 10px; color: var(--text-dim); margin-left: auto; 
                     background: var(--panel); padding: 3px 8px; border-radius: 3px; }
    
    .phases { display: flex; gap: 16px; flex-wrap: wrap; }
    .phase { flex: 1; min-width: 320px; background: var(--panel); border: 1px solid var(--border);
             border-radius: 6px; padding: 14px 16px; }
    .phase-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .phase-icon { font-size: 14px; }
    .phase-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .phase-name.forge { color: var(--forge); }
    .phase-name.buster { color: var(--buster); }
    .phase-name.precheck { color: var(--info); }
    
    .phase-steps { display: flex; flex-direction: column; gap: 6px; }
    .phase-step { display: flex; align-items: flex-start; gap: 8px; font-size: 10px; line-height: 1.5; }
    .phase-step .num { color: var(--text-dim); min-width: 16px; text-align: right; flex-shrink: 0; }
    .phase-step .desc { color: var(--text-muted); }
    .phase-step .fn { color: var(--info); font-size: 9px; opacity: 0.7; }
    
    .phase-outcomes { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
                      display: flex; flex-direction: column; gap: 4px; }
    .outcome { display: flex; align-items: center; gap: 8px; font-size: 10px; padding: 3px 0; }
    .outcome .tag { padding: 2px 6px; border-radius: 3px; font-size: 9px; font-weight: 600; flex-shrink: 0; min-width: 70px; text-align: center; }
    .outcome .tag.pass { background: var(--happy-bg); color: var(--happy); border: 1px solid #10b98130; }
    .outcome .tag.fail { background: var(--fail-bg); color: var(--fail); border: 1px solid #ef444430; }
    .outcome .tag.timeout { background: #8b5cf615; color: var(--timeout); border: 1px solid #8b5cf630; }
    .outcome .tag.rate { background: #3b82f615; color: var(--rate-limit); border: 1px solid #3b82f630; }
    .outcome .tag.retry { background: var(--retry-bg); color: var(--retry); border: 1px solid #f59e0b30; }
    .outcome .tag.blocked { background: var(--fail-bg); color: var(--blocked); border: 1px solid #dc262630; }
    .outcome .tag.nova { background: #f9731615; color: var(--nova); border: 1px solid #f9731630; }
    .outcome .arrow { color: var(--text-dim); }
    .outcome .target { color: var(--text-muted); }
    
    /* ── Gate Card ── */
    .gate-card { background: var(--card); border: 1px solid var(--gate); border-radius: 8px;
                 padding: 20px 24px; margin-bottom: 4px; border-left: 3px solid var(--gate); }
    .gate-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .gate-type { font-size: 10px; font-weight: 600; color: var(--gate); background: var(--gate-bg);
                 padding: 3px 8px; border-radius: 3px; text-transform: uppercase; letter-spacing: 1px; }
    .gate-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .gate-config { font-size: 10px; color: var(--text-dim); margin-left: auto; }
    
    .gate-flow { display: flex; gap: 12px; flex-wrap: wrap; }
    .gate-phase { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
                  padding: 12px 16px; min-width: 200px; flex: 1; }
    .gate-phase-title { font-size: 10px; font-weight: 600; color: var(--review); margin-bottom: 8px;
                        text-transform: uppercase; letter-spacing: 0.5px; }
    .gate-phase-title.test { color: var(--buster); }
    .gate-phase-title.fix { color: var(--forge); }
    
    /* ── Pipeline End ── */
    .pipeline-end { background: var(--card); border: 2px solid var(--happy); border-radius: 8px;
                    padding: 20px 24px; text-align: center; }
    .pipeline-end h3 { font-size: 14px; color: var(--happy); margin-bottom: 4px; }
    .pipeline-end p { font-size: 11px; color: var(--text-dim); }
    
    /* ── Legend ── */
    .legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px 32px; border-top: 1px solid var(--border);
              margin-top: 24px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-dim); }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; }
    
    /* ── Fail Scenario Card ── */
    .scenario-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
                     padding: 20px 24px; margin-bottom: 16px; }
    .scenario-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .scenario-subtitle { font-size: 10px; color: var(--text-dim); margin-bottom: 16px; }
    .timeline { display: flex; flex-direction: column; gap: 0; }
    .tl-item { display: flex; gap: 12px; }
    .tl-marker { display: flex; flex-direction: column; align-items: center; width: 20px; }
    .tl-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .tl-line { width: 1px; flex: 1; min-height: 8px; }
    .tl-content { padding-bottom: 12px; flex: 1; }
    .tl-label { font-size: 11px; font-weight: 500; }
    .tl-detail { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
    .tl-fn { font-size: 9px; color: var(--info); opacity: 0.6; margin-top: 1px; }
    
    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
    
    /* ── Tool Reference Links ── */
    .tool-ref { color: var(--info); cursor: pointer; border-bottom: 1px dotted var(--info); 
                transition: all 0.15s; padding: 0 1px; }
    .tool-ref:hover { color: #22d3ee; background: #06b6d410; border-radius: 2px; }
    
    /* ── Tool Modal ── */
    .tool-overlay { position: fixed; inset: 0; background: #00000080; z-index: 1000; display: none;
                    align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .tool-overlay.open { display: flex; }
    .tool-modal { background: var(--panel); border: 1px solid var(--border-light); border-radius: 12px;
                  max-width: 640px; width: 90vw; max-height: 85vh; overflow-y: auto;
                  box-shadow: 0 24px 48px #00000060; }
    .tool-modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
                         display: flex; align-items: center; gap: 12px; position: sticky; top: 0;
                         background: var(--panel); z-index: 1; }
    .tool-modal-icon { font-size: 24px; }
    .tool-modal-title { font-size: 16px; font-weight: 700; flex: 1; }
    .tool-modal-path { font-size: 10px; color: var(--text-dim); }
    .tool-modal-close { background: none; border: 1px solid var(--border); color: var(--text-dim);
                        width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
                        font-size: 16px; font-family: inherit; display: flex; align-items: center;
                        justify-content: center; transition: all 0.15s; }
    .tool-modal-close:hover { color: var(--text); border-color: var(--border-light); background: var(--card); }
    .tool-modal-body { padding: 20px 24px; }
    .tool-modal-desc { font-size: 12px; color: var(--text-muted); line-height: 1.7; margin-bottom: 16px; }
    .tool-modal-section { margin-bottom: 16px; }
    .tool-modal-section h4 { font-size: 11px; color: var(--text-dim); text-transform: uppercase;
                             letter-spacing: 1px; margin-bottom: 8px; }
    .tool-modal-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .tool-modal-table th { text-align: left; padding: 6px 10px; color: var(--text-dim); font-weight: 500;
                           border-bottom: 1px solid var(--border); background: var(--card); }
    .tool-modal-table td { padding: 6px 10px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    .tool-modal-table code { color: var(--info); font-size: 10px; background: var(--bg); padding: 1px 4px;
                             border-radius: 2px; }
    .tool-modal-tag { display: inline-block; font-size: 9px; padding: 2px 6px; border-radius: 3px;
                      margin-right: 4px; margin-bottom: 2px; }
    .tool-modal-tag.input { background: #3b82f615; color: var(--rate-limit); border: 1px solid #3b82f625; }
    .tool-modal-tag.output { background: var(--happy-bg); color: var(--happy); border: 1px solid #10b98125; }
    .tool-modal-tag.stream { background: #8b5cf615; color: var(--timeout); border: 1px solid #8b5cf625; }
  </style>
</head>
<body>

<div class="header">
  <h1>KUBECLAW PIPELINE — VOLLSTÄNDIGER ABLAUF</h1>
  <p>pipeline.js v8 · 4921 Zeilen · Alle Pfade und Szenarien · Klick auf Tabs für Ansichten, klick auf Tool-Namen für Details</p>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-view="full">Kompletter Durchlauf (10 Module)</button>
  <button class="tab" data-view="happy">Happy Path (alles PASS)</button>
  <button class="tab" data-view="fail-scenarios">Fehler-Szenarien</button>
  <button class="tab" data-view="detail-module">Modul-Detail (Forge+Buster)</button>
  <button class="tab" data-view="detail-gate-buster">Gate-Detail (Buster + Fix-Loop)</button>
  <button class="tab" data-view="detail-gate-review">Gate-Detail (Review + Fix-Zyklen)</button>
  <button class="tab" data-view="tools">Externe Tools (6)</button>
</div>

<div class="content" id="content"></div>
<div class="legend" id="legend"></div>

<!-- Tool Detail Modal -->
<div class="tool-overlay" id="toolOverlay" onclick="if(event.target===this)closeToolModal()">
  <div class="tool-modal" id="toolModal"></div>
</div>

<script>
// ─── External Tool Database ──────────────────────────────────────────────────

const TOOLS = {
  'memory.js': {
    icon: '🧠', path: '/app/skills/memory.js', version: 'v1 (657 Zeilen)',
    desc: 'Qdrant-basiertes Vektorspeicher-System für Agenten-Wissen. Speichert technische Erkenntnisse als Embeddings (Gemini embedding-001), verwaltet Confidence-Scores über Feedback-Loops, und liefert kontextbasierte Erinnerungen für Agenten-Prompts.',
    functions: [
      { name: 'recall(query, opts)', desc: 'Semantische Suche in Qdrant. Natural-Language-Query → Top-N relevante Memories mit Score + Confidence.', tags: ['input'] },
      { name: 'feedback(moduleId, outcome, opts)', desc: 'Bulk-Update der Confidence-Scores aller zum Modul getaggten Memories. PASS = boost, FAIL = decay.', tags: ['input'] },
      { name: 'decayByIds(ids, opts)', desc: 'Gezielter Confidence-Decay für spezifische Memory-IDs (die im gescheiterten Prompt waren).', tags: ['input'] },
      { name: 'remember(text, opts)', desc: 'Neues Memory speichern mit Tags, Scope (global/project/agent), Modul-Zuordnung.', tags: ['output'] },
    ],
    integration: [
      'Pipeline ruft <code>recallForModule()</code> VOR jedem Forge-Spawn → Memories im Prompt',
      'Pipeline ruft <code>feedbackMemory()</code> NACH PASS/FAIL → Confidence aktualisieren',
      'Pipeline ruft <code>decayRecalledMemories()</code> NACH FAIL → Nur die genutzten IDs decayen',
      'Buster ruft <code>memory.js remember</code> via CLI als Teil des Completion-Protocols',
    ],
    config: 'memory.enabled · memory_js_path · recall_limit · recall_before_forge · feedback_after_outcome · targeted_decay_amount',
  },
  'redis.js': {
    icon: '📡', path: '/app/skills/redis.js', version: 'v2 (234 Zeilen)',
    desc: 'Redis-Client für Task-Dispatch und Completion-Signalisierung. Pipeline dispatcht Buster-Tasks via Redis-Streams, Buster signalisiert Completion zurück. Pipeline liest Completions via Direct-Import (keine Subprocesses).',
    functions: [
      { name: 'sendTask(agentType, taskType, payload, priority)', desc: 'Schreibt strukturierten Task-Payload in den Buster-Task-Stream.', tags: ['stream'] },
      { name: 'readCompletion(streamKey, moduleId)', desc: 'Liest neueste Completion-Entry für ein Modul aus dem aktiven Stream.', tags: ['stream'] },
      { name: 'archiveCompletions(streamKey, archiveKey, moduleId, maxLen)', desc: 'Verschiebt alte Entries vom Active- in den Archive-Stream, trimmt auf maxLen.', tags: ['stream'] },
      { name: 'disconnect()', desc: 'Schliesst die Redis-Verbindung.', tags: ['input'] },
    ],
    integration: [
      'Pipeline → <code>dispatchRedisTask()</code> schreibt in <code>swarm:buster:tasks</code>',
      'Buster (via Processor) liest Tasks, führt Tests aus, schreibt Completion',
      'Pipeline → <code>readCompletionFromRedis()</code> liest aus <code>swarm:pipeline:&lt;project&gt;:completions</code>',
      'Pipeline → <code>archiveModuleCompletions()</code> VOR jedem Dispatch (verhindert stale Reads)',
      'Direct-Import via <code>getRedisModule()</code> — keine Temp-Files, keine Subprocesses',
    ],
    config: 'agents.buster.redis_js_path · COMPLETION_ARCHIVE_MAX_LEN = 1000',
  },
  'lint-report.js': {
    icon: '📊', path: '/app/skills/lint-report.js', version: 'v1 (1099 Zeilen)',
    desc: 'Statische Analyse-Aggregator mit 14 Tools in 2 Tiers. Erkennt automatisch Projekttypen (TS, Python, Docker, K8s, Shell) und führt nur relevante Tools aus. Jedes Tool hat individuellen Timeout und Graceful Degradation.',
    functions: [
      { name: 'runAllTools(opts)', desc: 'Führt alle Tools des gewählten Tiers aus. Returns strukturiertes JSON mit Findings pro Tool.', tags: ['output'] },
      { name: 'detectProjectTypes(repoRoot)', desc: 'Erkennt Projekttypen via Marker-Files (tsconfig.json, pyproject.toml, Chart.yaml, etc.)', tags: ['input'] },
    ],
    integration: [
      'Pipeline → <code>runPreCheck()</code>: Tier pre-check (tsc, ruff, shellcheck) nach Forge, vor Buster',
      'Pipeline → <code>_runReviewOnce()</code>: Tier full (alle 14 Tools) vor jedem Echo-Review',
      'Errors → <code>formatLintErrors()</code> → Anti-Pattern-Block für Forge-Retry',
      'Vollreport → <code>formatLintReportForReviewer()</code> → Reviewer-Prompt-Injection',
    ],
    tools: [
      { name: 'tsc', lang: 'TypeScript', tier: 'pre-check', detect: 'tsconfig.json' },
      { name: 'ruff', lang: 'Python', tier: 'pre-check', detect: 'pyproject.toml' },
      { name: 'shellcheck', lang: 'Shell', tier: 'pre-check', detect: '*.sh' },
      { name: 'eslint', lang: 'JS/TS', tier: 'full', detect: 'package.json' },
      { name: 'knip', lang: 'JS/TS', tier: 'full', detect: 'package.json' },
      { name: 'madge', lang: 'JS/TS', tier: 'full', detect: 'package.json' },
      { name: 'npm-audit', lang: 'JS/TS', tier: 'full', detect: 'package.json' },
      { name: 'mypy', lang: 'Python', tier: 'full', detect: 'pyproject.toml' },
      { name: 'pip-audit', lang: 'Python', tier: 'full', detect: 'pyproject.toml' },
      { name: 'semgrep', lang: 'Multi', tier: 'full', detect: 'immer (.semgrep.yml)' },
      { name: 'hadolint', lang: 'Docker', tier: 'full', detect: 'Dockerfile' },
      { name: 'helm-lint', lang: 'K8s', tier: 'full', detect: 'Chart.yaml' },
      { name: 'kubeconform', lang: 'K8s', tier: 'full', detect: 'Chart.yaml' },
      { name: 'yamllint', lang: 'YAML', tier: 'full', detect: '*.yaml' },
    ],
    config: 'pre_check.enabled · pre_check.lint_report_path · pre_check.timeout_seconds · pre_check.semgrep_config_path',
  },
  'verify-task.js': {
    icon: '🛡️', path: '/app/skills/buster/verify-task.js', version: 'v2 (270 Zeilen)',
    desc: 'Agent-Scope-Firewall und Push-Gate im Buster-Pod. Stellt sicher, dass der Buster-Agent nur innerhalb seines erlaubten Scope arbeitet (innerhalb .swarm/). Kontrolliert Git-Push als letzten Schritt nach erfolgreicher Verifikation.',
    functions: [
      { name: 'verifyScope(taskPayload)', desc: 'Prüft ob alle vom Agent geschriebenen Dateien innerhalb des erlaubten Pfads liegen.', tags: ['input'] },
      { name: 'pushResults()', desc: 'Git add + commit + push — nur erlaubt wenn Scope-Check bestanden.', tags: ['output'] },
    ],
    integration: [
      'Läuft im Buster-Pod als Teil des Completion-Protocols',
      'Wird von <code>buster-processor.cjs</code> nach jedem Task aufgerufen',
      'Verhindert, dass Buster-Agents Code ausserhalb von .swarm/ verändern',
      'Kontrolliert den einzigen Git-Push-Pfad für Buster-Ergebnisse',
    ],
    config: 'Scope-Pfade: .swarm/ Unterverzeichnisse',
  },
  'buster-processor.cjs': {
    icon: '⚙️', path: '/app/skills/buster/buster-processor.cjs (Sidecar)', version: 'v6.0 (432 Zeilen)',
    desc: 'Processor-Sidecar im Buster-Pod. Liest Tasks aus dem Redis-Stream, reichert sie mit Qdrant-Kontext an, spawnt einen ACP-Subagent via Gateway, wartet auf Completion, und verifiziert das Ergebnis via verify-task.js.',
    functions: [
      { name: 'processTask(task)', desc: 'Hauptloop: Task lesen → Qdrant-Enrichment → Subagent spawnen → Warten → Verify → Push', tags: ['stream'] },
    ],
    integration: [
      'Liest aus <code>swarm:buster:tasks</code> Redis-Stream',
      'Spawnt Buster-Subagent via Gateway Tool API (sessions_spawn)',
      'Überwacht Subagent-Lifecycle (Health-Check, Timeout)',
      'Ruft <code>verify-task.js</code> nach Task-Completion',
      'Schreibt Completion in <code>swarm:pipeline:&lt;project&gt;:completions</code>',
    ],
    config: 'Deployment: Sidecar-Container im Buster-Pod · Podman-in-Pod Sandbox (SYS_ADMIN, SYS_CHROOT)',
  },
  '.semgrep.yml': {
    icon: '🔒', path: 'writable platform config surface (.semgrep.yml neben swarm.config.json)', version: 'v1',
    desc: 'Kuratiertes Semgrep-Regelset für Security- und Code-Quality-Checks. Helm liefert das Beispiel unter charts/kubeclaw/files/config/.semgrep.yml; lint-report.js auto-detectet zuerst die Plattformdatei neben swarm.config.json, dann ~/.openclaw/.semgrep.yml, danach <repo>/.semgrep.yml, sonst auto.',
    rules: [
      { lang: 'JS/TS', items: 'eval(), Shell-Injection, hardcoded Secrets, console.log' },
      { lang: 'Python', items: 'bare except, SQL-Injection, compare_digest, subprocess shell=True, requests timeout' },
      { lang: 'K8s', items: 'Privileged Containers, fehlende Resource-Limits, RBAC-Wildcards' },
    ],
    integration: [
      'Verwendet von <code>lint-report.js</code> im full-Tier (semgrep Tool)',
      'Helm-Beispiel: <code>charts/kubeclaw/files/config/.semgrep.yml</code> → writable platform config surface',
      'Override via <code>pre_check.semgrep_config_path</code>, sonst auto-detect (plattformweit → <code>~/.openclaw</code> → Repo → auto)',
    ],
    config: 'pre_check.semgrep_config_path (optional override, sonst auto-detect)',
  },
};

function toolRef(name, label) {
  return `<span class="tool-ref" onclick="openToolModal('${name}')">${label || name}</span>`;
}

function openToolModal(toolName) {
  const tool = TOOLS[toolName];
  if (!tool) return;
  
  let body = `<div class="tool-modal-desc">${tool.desc}</div>`;
  
  // Functions
  if (tool.functions) {
    body += `<div class="tool-modal-section"><h4>Funktionen / API</h4>

  if (tool.tools) {

  // Rules (.semgrep.yml)
  if (tool.rules) {
    body += `<div class="tool-modal-section"><h4>Regeln</h4>

      </tbody></table></div>`;
  }
  
  // Integration points
  if (tool.integration) {
    body += `<div class="tool-modal-section"><h4>Integration in pipeline.js</h4>
      <div style="display:flex;flex-direction:column;gap:6px;">

      </div></div>`;
  }
  
  // Config
  if (tool.config) {
    body += `<div class="tool-modal-section"><h4>Konfiguration</h4>
      <div style="font-size:11px;color:var(--text-dim);background:var(--bg);padding:8px 12px;border-radius:4px;"><code>${tool.config}</code></div></div>`;

function renderStep(stepId, index, total) {
  const isFirst = index === 0;
  const isLast = index === total - 1;
  const isGate = stepId.startsWith('gate:');
  
  let body;
  if (isGate) {
    const gateId = stepId.replace('gate:', '');
    const gate = GATES.find(g => g.id === gateId);
    body = renderGateCard(gate);
  } else {
    const mod = MODULES.find(m => m.id === stepId);
    body = renderModuleCard(mod);
  }
  
  return `
  <div class="step">
    <div class="step-connector">
      ${isFirst ? '' : '<div class="line"></div>'}
      <div class="dot ${isGate ? 'gate' : 'happy'}"></div>
      ${isLast ? '' : '<div class="line"></div>'}
    </div>
    <div class="step-body">${body}</div>
  </div>`;
}

        { color: 'var(--happy)', label: '✅ GO', detail: 'Review approved — EXIT_OK', fn: 'runReviewGate → return EXIT_OK' },
      ]
    },
  ];

  return scenarios.map(s => `
    <div class="scenario-card">
      <div class="scenario-title">${s.title}</div>
      <div class="scenario-subtitle">${s.subtitle}</div>

      </div>
    </div>`).join('');
}

  document.getElementById('legend').innerHTML = `
    <div class="legend-item"><div class="legend-dot" style="background: var(--happy);"></div>Erfolg / PASS</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--forge);"></div>Forge (Build)</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--buster);"></div>Buster (Test)</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--review);"></div>Echo (Review)</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--retry);"></div>Auto-Retry</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--fail);"></div>Fehler / FAIL</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--timeout);"></div>Timeout</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--rate-limit);"></div>Rate-Limit</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--blocked);"></div>BLOCKED</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--nova);"></div>NEEDS_NOVA</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--gate);"></div>Gate</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--info);"></div>Info / Skip</div>
  `;
}

// ─── Tab Switching ───────────────────────────────────────────────────────────

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderView(tab.dataset.view);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

// Initial render
renderView('full');
</script>
</body>
</html>
