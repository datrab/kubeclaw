apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-nova-archviewer
  namespace: kubeclaw
  labels:
    kubeclaw.dev/gitops-owner: kubeclaw-nova
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubeclaw
      app.kubernetes.io/instance: agent-nova
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/managed: 'true'
              tailscale.com/parent-resource-type: ingress
              tailscale.com/parent-resource: agent-nova-archviewer
              tailscale.com/parent-resource-ns: kubeclaw
      ports:
        - port: 3456
          protocol: TCP
---
