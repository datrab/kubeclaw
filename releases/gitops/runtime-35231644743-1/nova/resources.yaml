                let headers = {};

                const releaseInfo = token ? parseGitHubReleaseUrl(url) : null;
                if (releaseInfo) {
                  const apiHeaders = {
                    Authorization: `Bearer ${token}`,
                    Accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28',
                  };
                  const releaseResponse = await fetch(
                    `https://api.github.com/repos/${releaseInfo.owner}/${releaseInfo.repo}/releases/tags/${encodeURIComponent(releaseInfo.tag)}`,
                    { headers: apiHeaders, redirect: 'follow' },
                  );
                  if (!releaseResponse.ok) {
                    throw new Error(`bundle release lookup failed with HTTP ${releaseResponse.status}`);
                  }
                  const release = await releaseResponse.json();
                  const asset = Array.isArray(release.assets)
                    ? release.assets.find((entry) => entry && entry.name === releaseInfo.assetName)
                    : null;
                  if (!asset?.url) {
                    throw new Error(`bundle release asset not found: ${releaseInfo.assetName}`);
                  }
                  url = asset.url;
                  headers = {
                    Authorization: `Bearer ${token}`,
                    Accept: 'application/octet-stream',
                    'X-GitHub-Api-Version': '2022-11-28',
                  };
                } else if (token) {
