              const expectedAgent = process.env.AGENT_NAME;

              const expectedCommit = String(process.env.CODE_BUNDLE_EXPECTED_COMMIT || '').trim();

              const expectedContract = String(process.env.CODE_BUNDLE_CONTRACT_VERSION || '').trim();


              function isDirectory(candidate) {
                try {
                  return fs.statSync(candidate).isDirectory();
                } catch {
                  return false;
                }
              }


              function manifestCandidates(root) {
                const direct = path.join(root, 'manifest.json');
                const candidates = [];
                if (fs.existsSync(direct)) candidates.push(root);
                for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
                  if (!entry.isDirectory()) continue;
                  const nested = path.join(root, entry.name, 'manifest.json');
                  if (fs.existsSync(nested)) candidates.push(path.join(root, entry.name));
                }
                return candidates;
              }


              const candidates = manifestCandidates(extractedRoot);

              if (candidates.length !== 1) {
                throw new Error(`expected exactly one bundle root with manifest.json, found ${candidates.length}`);
              }


              const bundleRoot = candidates[0];

              const manifestPath = path.join(bundleRoot, 'manifest.json');

              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));

              const skillsPath = path.join(bundleRoot, 'skills');


              if (!isDirectory(skillsPath)) {
                throw new Error('bundle must contain a top-level skills/ directory');
              }

              if (manifest.schemaVersion !== 'pipeline-runtime-bundle.v1'
                || manifest.bundleKind !== 'app-skills-package-set') {
                throw new Error('bundle uses an unsupported package contract');
              }

              if (manifest.role !== expectedAgent) {
                throw new Error(`bundle role ${manifest.role || '<missing>'} does not match ${expectedAgent}`);
              }

              if (expectedCommit && manifest.commit !== expectedCommit) {
                throw new Error(`bundle commit ${manifest.commit || '<missing>'} does not match ${expectedCommit}`);
              }

              if (expectedContract && manifest.contractVersion !== expectedContract) {
                throw new Error(`bundle contract ${manifest.contractVersion || '<missing>'} does not match ${expectedContract}`);
              }


              for (const entry of fs.readdirSync(skillsPath)) {
                fs.cpSync(path.join(skillsPath, entry), path.join('/skills-merged', entry), { recursive: true, force: true });
              }

              fs.copyFileSync(manifestPath, manifestOut);

              console.log(`    bundle manifest accepted: ${manifest.role}@${manifest.commit}`);

              NODE

              fi

              protected_skill_overlay() {
                case "$1" in
                  pipeline.ts|runtime.ts|contracts|contracts/*|packages|packages/*|node_modules|node_modules/*|plugins|plugins/*)
                    return 0
                    ;;
                esac
                return 1
              }

              # Overlay: optional user-defined custom skills from ConfigMap

              if [ -d /init-skills ] && [ -n "$(ls -A /init-skills 2>/dev/null)" ]; then
                while IFS= read -r -d '' custom_skill_path; do
                  custom_skill_rel="${custom_skill_path#/init-skills/}"
                  if protected_skill_overlay "$custom_skill_rel"; then
                    echo "    ERROR: customSkills may not override protected runtime skill path: $custom_skill_rel" >&2
                    exit 1
                  fi
                done < <(find /init-skills -mindepth 1 -print0)
                cp -r /init-skills/. /skills-merged/
                echo "    Custom skills overlaid ($(ls /init-skills | wc -l) files)"
              fi


              echo "==> 6. Fixing Permissions"

              if [ "$INIT_RUN_AS_ROOT" = "true" ]; then
                chown -R 0:0 /config /runtime-config /skills-merged
                if [ "${AGENT_NAME}" = "buster" ]; then
                  chown -R 1000:1000 /workspace
                  chmod -R g+rwX /workspace
                  find /workspace -type d -exec chmod g+s {} +
                  chown -R 0:1000 "$INIT_SSH_HOME"
                  find "$INIT_SSH_HOME" -type d -exec chmod 750 {} +
                  if [ -f "$INIT_SSH_HOME/id_rsa" ]; then chmod 640 "$INIT_SSH_HOME/id_rsa"; fi
                else
                  chown -R 0:0 /workspace
                  chown -R 0:0 "$INIT_SSH_HOME"
                fi
              else
                echo "    Non-root init selected; persistent volumes already use fsGroup 1000."
              fi

              echo "==> Init Complete."

              ls -la /workspace/
