                  const match = parsed.pathname.match(/^\/([^/]+)\/([^/]+)\/releases\/download\/([^/]+)\/([^/]+)$/);
                  if (!match) return null;
                  return {
                    owner: match[1],
                    repo: match[2],
                    tag: decodeURIComponent(match[3]),
                    assetName: decodeURIComponent(match[4]),
                  };
                } catch {
                  return null;
                }
