apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-nova-swarm-config
  labels:
    app.kubernetes.io/name: kubeclaw
    app.kubernetes.io/instance: agent-nova
    app.kubernetes.io/component: nova
    app.kubernetes.io/managed-by: Helm
    kubeclaw/role: nova
    kubeclaw.dev/gitops-owner: kubeclaw-nova
  namespace: kubeclaw
data:
  swarm.config.json: |
    {
      "_doc": "Compact authored swarm config rendered to /home/node/.openclaw/swarm.config.json. profile=standard expands to the full strict runtime config; code consumes only the expanded effective config.",
      "profile": "standard",
      "features": {
        "observability": true,
        "buster": true,
        "discord_alerts": true
      },
      "tuning": {
        "safety_margins": "high",
        "retention": "high",
        "alerts": "rich",
        "logs": "verbose",
        "checks": "strict",
        "determinism": "strict"
      },
      "overrides": {}
    }
  .semgrep.yml: |
    # =============================================================================
    # .semgrep.yml — Curated Security & Correctness Rules
    # =============================================================================
    #
    # Deployed to /home/node/.openclaw/.semgrep.yml via Helm ConfigMap.
    # lint-policy.json provides this one exact config path. Missing config fails.
    #
    # Design principles:
    #   - Security + correctness patterns that other tools in the pipeline miss
    #   - Excludes style rules (eslint/ruff handle those)
    #   - Excludes dependency vulns (npm-audit/pip-audit handle those)
    #   - Excludes Dockerfile best practices (hadolint handles that)
    #   - Excludes shell scripting (shellcheck handles that)
    #   - Low noise — every rule should catch real bugs, not style preferences
    #
    # Coverage: JS/TS, Python, React/Frontend, and Node.js backend code.
    # Findings use Semgrep WARNING output for stable tool exit behavior; policy
    # blocks warning severity, so these are not advisory warnings.
    # =============================================================================

    rules:

      # ─── JavaScript / TypeScript ───────────────────────────────────────────────

      # Detect eval() and equivalent dynamic code execution
      - id: no-eval
        pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
        message: "Dynamic code execution detected — potential code injection risk"
        languages: [javascript, typescript]
        severity: WARNING

      # Detect string-evaluated timers, which execute code dynamically.
      - id: no-string-timer-code
        patterns:
          - pattern-either:
              - pattern: setTimeout($X, ...)
              - pattern: setInterval($X, ...)
          - metavariable-regex:
              metavariable: $X
              regex: ^["']
        message: "String-evaluated timer detected — pass a function instead of executable source text"
        languages: [javascript, typescript]
        severity: WARNING

      # Detect command injection via string interpolation in exec/spawn
      - id: no-shell-interpolation
        patterns:
          - pattern-either:
              - pattern: child_process.exec(`...${...}...`)
              - pattern: child_process.execSync(`...${...}...`)
              - pattern: require("child_process").exec(`...${...}...`)
              - pattern: require("child_process").execSync(`...${...}...`)
        message: "Shell command with string interpolation — use execFileSync with arg arrays instead"
        languages: [javascript, typescript]
        severity: WARNING

      # Detect hardcoded secrets/tokens
      - id: no-hardcoded-secrets
        patterns:
          - pattern-either:
              - pattern: |
                  $X = "sk-..."
              - pattern: |
                  $X = "ghp_..."
              - pattern: |
                  $X = "glpat-..."
              - pattern: |
                  $X = "AKIA..."
              - pattern: |
                  $X = "Bearer ..."
              - pattern: |
                  password = "..."
              - pattern: |
                  secret = "..."
              - pattern: |
                  token = "..."
        paths:
          exclude:
            - "*.test.*"
            - "*.spec.*"
            - "**/test/**"
            - "**/tests/**"
            - "**/__tests__/**"
            - "**/fixtures/**"
        message: "Potential hardcoded secret or token"
        languages: [javascript, typescript, python]
        severity: WARNING

      # Detect raw SQL outside common data-access layers in JS/TS.
      - id: no-raw-sql-outside-data-layer-js
        patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.query($SQL)
              - pattern: $DB.execute($SQL, ...)
              - pattern: $DB.execute($SQL)
              - pattern: $DB.raw($SQL, ...)
              - pattern: $DB.raw($SQL)
              - pattern: sequelize.query($SQL, ...)
              - pattern: sequelize.query($SQL)
              - pattern: $SEQUELIZE.query($SQL, ...)
              - pattern: $SEQUELIZE.query($SQL)
              - pattern: knex.raw($SQL, ...)
              - pattern: knex.raw($SQL)
              - pattern: $KNEX.raw($SQL, ...)
              - pattern: $KNEX.raw($SQL)
              - pattern: prisma.$queryRawUnsafe($SQL, ...)
              - pattern: prisma.$queryRawUnsafe($SQL)
              - pattern: prisma.$executeRawUnsafe($SQL, ...)
              - pattern: prisma.$executeRawUnsafe($SQL)
              - pattern: $PRISMA.$queryRawUnsafe($SQL, ...)
              - pattern: $PRISMA.$queryRawUnsafe($SQL)
              - pattern: $PRISMA.$executeRawUnsafe($SQL, ...)
              - pattern: $PRISMA.$executeRawUnsafe($SQL)
          - metavariable-regex:
              metavariable: $SQL
              regex: ^[`'\"]\s*(SELECT|INSERT|UPDATE|DELETE|WITH|CREATE|ALTER|DROP)\b
        paths:
          exclude:
            - "**/db/**"
            - "**/database/**"
            - "**/sql/**"
            - "**/query/**"
            - "**/queries/**"
            - "**/repository/**"
            - "**/repositories/**"
            - "**/storage/**"
            - "**/persistence/**"
            - "**/migrations/**"
            - "*.test.*"
            - "*.spec.*"
            - "**/test/**"
            - "**/tests/**"
            - "**/__tests__/**"
        message: "Raw SQL outside the common data-access layer — route queries through the project’s query/repository abstraction"
        languages: [javascript, typescript]
        severity: WARNING

      # ─── Node.js Backend Security ───────────────────────────────────────────────

      # Detect Math.random() used for security-sensitive purposes
      - id: no-math-random-security
        patterns:
          - pattern-either:
              - pattern: $VAR = Math.random()
              - pattern: const $VAR = Math.random()
              - pattern: let $VAR = Math.random()
              - pattern: var $VAR = Math.random()
          - metavariable-regex:
              metavariable: $VAR
              regex: .*(token|secret|key|session|nonce|salt|csrf|auth|password|uuid).*
        message: "Math.random() is not cryptographically secure — use crypto.randomUUID() or crypto.randomBytes() for tokens/secrets/IDs"
        languages: [javascript, typescript]
        severity: WARNING

      # Detect prototype pollution vectors
      - id: no-prototype-pollution
        patterns:
          - pattern-either:
              - pattern: $OBJ["__proto__"]
              - pattern: $OBJ.__proto__
              - pattern: $OBJ["constructor"]["prototype"]
        message: "Potential prototype pollution — validate keys and use Object.create(null) or Map for untrusted data"
        languages: [javascript, typescript]
        severity: WARNING

      # Detect unvalidated redirects in Express-style handlers
      - id: no-open-redirect
        patterns:
          - pattern-either:
              - pattern: $RES.redirect($INPUT)
              - pattern: $RES.redirect(301, $INPUT)
              - pattern: $RES.redirect(302, $INPUT)
        message: "Unvalidated redirect — ensure the target URL is on an allowlist to prevent open redirect attacks"
        languages: [javascript, typescript]
        severity: WARNING

      # ─── Python ────────────────────────────────────────────────────────────────

      # Detect bare except clauses
      - id: no-bare-except
        pattern: |
          try:
              ...
          except:
              ...
        message: "Bare except clause — catches SystemExit and KeyboardInterrupt. Use 'except Exception:' instead"
        languages: [python]
        severity: WARNING

      # Detect SQL injection via string formatting
      - id: no-sql-string-format
        patterns:
          - pattern-either:
              - pattern: $CURSOR.execute(f"...")
              - pattern: $CURSOR.execute("..." % ...)
              - pattern: $CURSOR.execute("...".format(...))
              - pattern: $CURSOR.executemany(f"...")
        message: "SQL query built with string formatting — use parameterized queries instead"
        languages: [python]
        severity: WARNING

      # Detect == comparison for secrets (should use compare_digest)
      - id: use-compare-digest
        patterns:
          - pattern-either:
              - pattern: $TOKEN == $OTHER
              - pattern: $OTHER == $TOKEN
          - metavariable-regex:
              metavariable: $TOKEN
              regex: .*(token|secret|key|password|api_key|apikey).*
        message: "Secret comparison using == — use hmac.compare_digest() or secrets.compare_digest() to prevent timing attacks"
        languages: [python]
        severity: WARNING

      # Detect subprocess.call with shell=True
      - id: no-subprocess-shell
        patterns:
          - pattern-either:
              - pattern: subprocess.call(..., shell=True, ...)
              - pattern: subprocess.run(..., shell=True, ...)
              - pattern: subprocess.Popen(..., shell=True, ...)
              - pattern: subprocess.check_output(..., shell=True, ...)
        message: "subprocess with shell=True — risk of shell injection. Use shell=False with arg list"
        languages: [python]
        severity: WARNING

      # Detect requests without timeout
      - id: requests-no-timeout
        patterns:
          - pattern-either:
              - pattern: requests.get($URL)
              - pattern: requests.post($URL, ...)
              - pattern: requests.put($URL, ...)
              - pattern: requests.delete($URL)
              - pattern: requests.patch($URL, ...)
        message: "HTTP request without timeout — can hang indefinitely. Add timeout parameter"
        languages: [python]
        severity: WARNING

      # Detect verify=False without comment (SSL bypass)
      - id: requests-no-verify
        pattern: requests.$METHOD(..., verify=False, ...)
        message: "SSL verification disabled — ensure this is intentional and documented"
        languages: [python]
        severity: WARNING

      # Detect unsafe deserialization via pickle (arbitrary code execution)
      - id: no-pickle-load
        patterns:
          - pattern-either:
              - pattern: pickle.load(...)
              - pattern: pickle.loads(...)
              - pattern: cPickle.load(...)
              - pattern: cPickle.loads(...)
        message: "pickle.load() executes arbitrary code — use json or a safe serialization format for untrusted data"
        languages: [python]
        severity: WARNING

      # Detect unsafe YAML loading (arbitrary code execution)
      - id: no-unsafe-yaml-load
        patterns:
          - pattern: yaml.load($DATA)
          - pattern-not: yaml.load($DATA, Loader=...)
        message: "yaml.load() without Loader executes arbitrary code — use yaml.safe_load() or yaml.load(data, Loader=SafeLoader)"
        languages: [python]
        severity: WARNING

      # Detect Jinja2 templates without autoescape (SSTI / XSS)
      - id: jinja2-no-autoescape
        patterns:
          - pattern: jinja2.Environment(...)
          - pattern-not: jinja2.Environment(..., autoescape=True, ...)
          - pattern-not: jinja2.Environment(..., autoescape=select_autoescape(...), ...)
        message: "Jinja2 Environment without autoescape — enables server-side template injection and XSS"
        languages: [python]
        severity: WARNING

      # Detect swallowed Python exceptions — hidden failures break maintainability.
      - id: no-swallowed-exception-py
        pattern-either:
          - pattern: |
              try:
                  ...
              except Exception:
                  pass
          - pattern: |
              try:
                  ...
              except $ERR:
                  pass
          - pattern: |
              try:
                  ...
              except Exception:
                  return
          - pattern: |
              try:
                  ...
              except $ERR:
                  return
          - pattern: |
              try:
                  ...
              except Exception:
                  return None
          - pattern: |
              try:
                  ...
              except $ERR:
                  return None
        paths:
          exclude:
            - "*.test.*"
            - "*.spec.*"
            - "**/test/**"
            - "**/tests/**"
            - "**/__tests__/**"
        message: "Swallowed exception — handle the failure explicitly or re-raise with context"
        languages: [python]
        severity: WARNING

      # Detect dynamic module loading in Python — hides the dependency graph from static tooling.
      - id: no-dynamic-module-load-py
        patterns:
          - pattern-either:
              - pattern: importlib.import_module(...)
              - pattern: __import__(...)
        paths:
          exclude:
            - "**/plugin/**"
            - "**/plugins/**"
            - "**/registry/**"
            - "**/registries/**"
            - "**/loader/**"
            - "**/loaders/**"
            - "**/migrations/**"
            - "*.test.*"
            - "*.spec.*"
            - "**/test/**"
            - "**/tests/**"
            - "**/__tests__/**"
        message: "Dynamic module loading reduces static discoverability — prefer static imports or an explicit registry/loader boundary"
        languages: [python]
        severity: WARNING

      # Detect raw SQL outside common data-access layers in Python.
      - id: no-raw-sql-outside-data-layer-py
        patterns:
          - pattern-either:
              - pattern: $DB.execute($SQL, ...)
              - pattern: $DB.execute($SQL)
              - pattern: $DB.executemany($SQL, ...)
              - pattern: $DB.executemany($SQL)
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.query($SQL)
              - pattern: session.execute($SQL, ...)
              - pattern: session.execute($SQL)
              - pattern: $SESSION.execute($SQL, ...)
              - pattern: $SESSION.execute($SQL)
              - pattern: engine.execute($SQL, ...)
              - pattern: engine.execute($SQL)
              - pattern: $ENGINE.execute($SQL, ...)
              - pattern: $ENGINE.execute($SQL)
          - metavariable-regex:
              metavariable: $SQL
              regex: ^[fFrRuU]*[`'\"]\s*(SELECT|INSERT|UPDATE|DELETE|WITH|CREATE|ALTER|DROP)\b
        paths:
          exclude:
            - "**/db/**"
            - "**/database/**"
            - "**/sql/**"
            - "**/query/**"
            - "**/queries/**"
            - "**/repository/**"
            - "**/repositories/**"
            - "**/storage/**"
            - "**/persistence/**"
            - "**/migrations/**"
            - "*.test.*"
            - "*.spec.*"
            - "**/test/**"
            - "**/tests/**"
            - "**/__tests__/**"
        message: "Raw SQL outside the common data-access layer — route queries through the project’s query/repository abstraction"
        languages: [python]
        severity: WARNING

      # ─── React / Frontend (XSS Prevention) ─────────────────────────────────────

      # Detect dangerouslySetInnerHTML — XSS vector in React components
      - id: react-no-dangerously-set-html
        pattern: dangerouslySetInnerHTML={...}
        message: "dangerouslySetInnerHTML is an XSS vector — sanitize input with DOMPurify or use safe alternatives"
        languages: [javascript, typescript]
        severity: WARNING

      # Detect direct innerHTML assignment — XSS vector outside React
      - id: no-innerhtml
        patterns:
          - pattern-either:
              - pattern: $EL.innerHTML = $VAL
              - pattern: $EL.outerHTML = $VAL
        message: "Direct innerHTML/outerHTML assignment — XSS risk. Use textContent or a sanitization library"
        languages: [javascript, typescript]
        severity: WARNING

      # Detect unsanitized URL construction from user input in React
      - id: react-no-unsanitized-href
        patterns:
          - pattern-either:
              - pattern: <a href={$VAR} ...>...</a>
              - pattern: window.location.href = $VAR
              - pattern: window.location = $VAR
        message: "Dynamic URL from variable — validate against javascript: protocol injection"
        languages: [javascript, typescript]
        severity: WARNING

      # ─── Cross-Language: Weak Cryptography ──────────────────────────────────────

      # Detect MD5 usage for security purposes (JS/TS)
      - id: no-weak-crypto-js
        patterns:
          - pattern-either:
              - pattern: crypto.createHash("md5")
              - pattern: crypto.createHash("sha1")
              - pattern: CryptoJS.MD5(...)
              - pattern: CryptoJS.SHA1(...)
        message: "MD5/SHA1 are cryptographically broken — use SHA-256+ for hashing and bcrypt/scrypt/argon2 for passwords"
        languages: [javascript, typescript]
        severity: WARNING

      # Detect MD5/SHA1 usage for security purposes (Python)
      - id: no-weak-crypto-py
        patterns:
          - pattern-either:
              - pattern: hashlib.md5(...)
              - pattern: hashlib.sha1(...)
              - pattern: hashlib.new("md5", ...)
              - pattern: hashlib.new("sha1", ...)
        message: "MD5/SHA1 are cryptographically broken — use hashlib.sha256() or bcrypt/scrypt/argon2 for passwords"
        languages: [python]
