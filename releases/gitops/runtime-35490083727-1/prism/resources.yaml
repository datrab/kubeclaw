apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-prism-worker-trust
  labels:
    app.kubernetes.io/name: kubeclaw
    app.kubernetes.io/instance: agent-prism
    app.kubernetes.io/component: prism
    app.kubernetes.io/managed-by: Helm
    kubeclaw/role: prism
    kubeclaw.dev/gitops-owner: kubeclaw-prism
  namespace: kubeclaw
data:
  envoy.yaml: |
    node:
      id: "agent-prism.kubeclaw"
      cluster: "kubeclaw-prism"
    admin:
      address: { socket_address: { address: 127.0.0.1, port_value: 9901 } }
    static_resources:
      listeners:
        - name: kubelet-health
          address: { socket_address: { address: 0.0.0.0, port_value: 19000 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: worker_trust_readiness
                    stream_idle_timeout: 2s
                    request_timeout: 2s
                    max_request_headers_kb: 8
                    route_config:
                      name: readiness-only
                      request_headers_to_remove: [x-envoy-upstream-rq-timeout-ms, x-envoy-upstream-rq-per-try-timeout-ms, x-envoy-retry-on, x-envoy-max-retries, x-envoy-hedge-on-per-try-timeout]
                      virtual_hosts:
                        - name: readiness-only
                          domains: ["*"]
                          routes:
                            - match: { path: /health, headers: [{ name: ":method", string_match: { exact: GET } }] }
                              direct_response: { status: 200 }
                            - match: { path: /bootstrap, headers: [{ name: ":method", string_match: { exact: GET } }] }
                              direct_response: { status: 200 }
                            - match: { path: /ready, headers: [{ name: ":method", string_match: { exact: GET } }] }
                              route: { cluster: worker-trust-self-check, timeout: 1s }
                            - match: { prefix: / }
                              direct_response: { status: 404 }
                    access_log:
                      - name: envoy.access_loggers.stderr
                        filter:
                          status_code_filter: { comparison: { op: GE, value: { default_value: 500, runtime_key: worker_trust_log_failure_status } } }
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StderrAccessLog
                          log_format:
                            json_format: { event: worker.trust.readiness.failure, response_code: "%RESPONSE_CODE%", response_flags: "%RESPONSE_FLAGS%", duration_ms: "%DURATION%" }
                    http_filters: [{ name: envoy.filters.http.router, typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router } }]
        # This listener can only acknowledge its own identity; it has no business route.
        - name: worker-trust-self-check
          address: { socket_address: { address: 127.0.0.1, port_value: 19001 } }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  disable_stateless_session_resumption: true
                  disable_stateful_session_resumption: true
                  common_tls_context:
                    tls_certificate_sds_secret_configs:
                      - name: default
                        sds_config:
                          resource_api_version: V3
                          api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }] }
                    combined_validation_context:
                      default_validation_context:
                        match_typed_subject_alt_names: [{ san_type: URI, matcher: { exact: "spiffe://kubeclaw.internal/ns/kubeclaw/sa/agent-prism" } }]
                      validation_context_sds_secret_config:
                        name: "spiffe://kubeclaw.internal"
                        sds_config:
                          resource_api_version: V3
                          api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }] }
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: worker_trust_self_check
                    common_http_protocol_options: { max_requests_per_connection: 1 }
                    route_config:
                      name: self-check-only
                      virtual_hosts:
                        - name: self-check-only
                          domains: ["*"]
                          routes:
                            - match: { path: /ready, headers: [{ name: ":method", string_match: { exact: GET } }] }
                              direct_response: { status: 200 }
                            - match: { prefix: / }
                              direct_response: { status: 404 }
                    http_filters: [{ name: envoy.filters.http.router, typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router } }]
        - name: prism-dispatch-ingress
          address: { socket_address: { address: 0.0.0.0, port_value: 18082 } }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_certificate_sds_secret_configs:
                      - name: default
                        sds_config: { resource_api_version: V3, api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }] } }
                    combined_validation_context:
                      default_validation_context:
                        match_typed_subject_alt_names:
                          - { san_type: URI, matcher: { exact: "spiffe://kubeclaw.internal/ns/kubeclaw/sa/agent-nova" } }
                          - { san_type: URI, matcher: { exact: "spiffe://kubeclaw.internal/ns/kubeclaw/sa/prism-control" } }
                          - { san_type: URI, matcher: { exact: "spiffe://kubeclaw.internal/ns/kubeclaw/sa/prism-test-runner" } }
                      validation_context_sds_secret_config:
                        name: "spiffe://kubeclaw.internal"
                        sds_config: { resource_api_version: V3, api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }] } }
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: prism-dispatch
                    forward_client_cert_details: SANITIZE_SET
                    set_current_client_cert_details: { uri: true }
                    route_config: { name: local, virtual_hosts: [{ name: local, domains: ["*"], routes: [{ match: { prefix: "/" }, route: { cluster: prism-bridge-local } }] }] }
                    http_filters: [{ name: envoy.filters.http.router, typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router } }]
        - name: prism-control-egress
          address: { socket_address: { address: 127.0.0.1, port_value: 28080 } }
          filter_chains: [{ filters: [{ name: envoy.filters.network.tcp_proxy, typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy, stat_prefix: prism-control, cluster: prism-control } }] }]
      clusters:
        - name: worker-trust-self-check
          type: STATIC
          connect_timeout: 0.5s
          per_connection_buffer_limit_bytes: 4096
          circuit_breakers:
            thresholds: [{ priority: DEFAULT, max_connections: 4, max_pending_requests: 4, max_requests: 4, max_retries: 0 }]
          load_assignment:
            cluster_name: worker-trust-self-check
            endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 19001 } } } }] }]
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              common_http_protocol_options: { max_requests_per_connection: 1 }
              explicit_http_config: { http_protocol_options: {} }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              max_session_keys: 0
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: default
                    sds_config:
                      resource_api_version: V3
                      api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }] }
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names: [{ san_type: URI, matcher: { exact: "spiffe://kubeclaw.internal/ns/kubeclaw/sa/agent-prism" } }]
                  validation_context_sds_secret_config:
                    name: "spiffe://kubeclaw.internal"
                    sds_config:
                      resource_api_version: V3
                      api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }] }
        - name: spire-agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment:
            cluster_name: spire-agent
            endpoints: [{ lb_endpoints: [{ endpoint: { address: { pipe: { path: "/run/spire/sockets/spire-agent.sock" } } } }] }]
        - name: prism-bridge-local
          connect_timeout: 1s
          type: STATIC
          load_assignment: { cluster_name: prism-bridge-local, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 18080 } } } }] }] }
        - name: prism-control
          connect_timeout: 3s
          type: STRICT_DNS
          load_assignment: { cluster_name: prism-control, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: prism-control-internal, port_value: 8443 } } } }] }] }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: default
                    sds_config: { resource_api_version: V3, api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }] } }
                combined_validation_context:
                  default_validation_context: { match_typed_subject_alt_names: [{ san_type: URI, matcher: { exact: "spiffe://kubeclaw.internal/ns/kubeclaw/sa/prism-control" } }] }
                  validation_context_sds_secret_config:
                    name: "spiffe://kubeclaw.internal"
                    sds_config: { resource_api_version: V3, api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire-agent } }] } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-prism-workspace
  labels:
    app.kubernetes.io/name: kubeclaw
    app.kubernetes.io/instance: agent-prism
    app.kubernetes.io/component: prism
    app.kubernetes.io/managed-by: Helm
    kubeclaw/role: prism
    kubeclaw.dev/gitops-owner: kubeclaw-prism
  namespace: kubeclaw
data:
  SOUL.md: >
    You are Prism, KubeClaw's single design agent. Nova gives you an architecture and product context.

    Produce exactly three materially distinct, complete, accessible Prism designs and commit them with
    prism_create_design_set.

    When Studio or Discord sends feedback, continue the same project session and commit the complete update with
    prism_apply_revision.

    Never call a model provider outside OpenClaw. All reasoning uses the managed OpenAI route through this OpenClaw
    gateway.
  TOOLS.md: >
    prism_create_design_set is mandatory for a new architecture and accepts exactly three designs.

    prism_apply_revision is mandatory for Studio or Discord design changes.

    Read /app/skills/packages/prism-contract/schemas/prism-v1.schema.json for the canonical contract and
    /app/skills/packages/prism-contract/fixtures/minimal-web.json for a minimal valid example before creating a
    document.
---
