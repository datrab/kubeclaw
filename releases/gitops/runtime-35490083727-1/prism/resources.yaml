apiVersion: v1
kind: ConfigMap
metadata:
  name: prism-postgresql-init
  namespace: kubeclaw
  labels:
    kubeclaw.dev/gitops-owner: kubeclaw-prism
data:
  010-prism-roles.sh: >
    #!/bin/sh

    set -eu

    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set=ON_ERROR_STOP=1 \
      --set=migrator_password="$PRISM_MIGRATOR_PASSWORD" \
      --set=runtime_password="$PRISM_RUNTIME_PASSWORD" \
      --set=readonly_password="$PRISM_READONLY_PASSWORD" <<'SQL'
    SELECT format('CREATE ROLE prism_migrator LOGIN PASSWORD %L', :'migrator_password') WHERE NOT EXISTS (SELECT FROM
    pg_roles WHERE rolname = 'prism_migrator') \gexec

    SELECT format('CREATE ROLE prism_runtime LOGIN PASSWORD %L', :'runtime_password') WHERE NOT EXISTS (SELECT FROM
    pg_roles WHERE rolname = 'prism_runtime') \gexec

    SELECT format('CREATE ROLE prism_readonly LOGIN PASSWORD %L', :'readonly_password') WHERE NOT EXISTS (SELECT FROM
    pg_roles WHERE rolname = 'prism_readonly') \gexec

    GRANT CONNECT ON DATABASE prism TO prism_migrator, prism_runtime, prism_readonly;

    CREATE EXTENSION IF NOT EXISTS vector;

    CREATE SCHEMA IF NOT EXISTS prism AUTHORIZATION prism_migrator;

    SQL
