        - podSelector:
            matchLabels:
              app: prism-postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: prism-ingestion
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: prism-control
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubeclaw
          podSelector:
            matchLabels:
              app.kubernetes.io/component: prism
      ports:
        - protocol: TCP
          port: 18082
