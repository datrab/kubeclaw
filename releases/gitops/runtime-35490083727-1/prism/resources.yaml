apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-prism
  annotations:
    argocd.argoproj.io/sync-wave: '3'
  labels:
    app.kubernetes.io/name: kubeclaw
    app.kubernetes.io/instance: agent-prism
    app.kubernetes.io/component: prism
    app.kubernetes.io/managed-by: Helm
    kubeclaw/role: prism
    kubeclaw.dev/gitops-owner: kubeclaw-prism
  namespace: kubeclaw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeclaw
      app.kubernetes.io/instance: agent-prism
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeclaw
        app.kubernetes.io/instance: agent-prism
        app.kubernetes.io/component: prism
        app.kubernetes.io/managed-by: Helm
        kubeclaw/role: prism
        kubeclaw.dev/worker-trust: 'true'
      annotations:
        checksum/config: 88154b5686a67b692015136f9866a36b31a669b1f391c592fae90f52ec3a4742
        checksum/swarm-config: 6daac10c6fa24fef56c3de32dde97eaf0ab5407e2404fa266022888b6cda9906
        checksum/worker-trust: ac194bffe9a90c846510d7fdcce80b3734410923a9281cbd595e1676706642ed
        checksum/workspace: 6d7c1d69b407e3a5ec3ade819a7277e1a5e8d82a22d3f4e1bb93a88f85497b88
    spec:
      terminationGracePeriodSeconds: 180
      imagePullSecrets:
        - name: ghcr-secret
      serviceAccountName: agent-prism
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      initContainers:
        - name: openclaw-state-permissions
          image: ghcr.io/datrab/kubeclaw-prism-agent@sha256:162c824aaee80a21376b70f07caf23204bd861a795afc91e45527990d20cbd97
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - '-c'
            - |
              set -eu
              find /home/node/.openclaw -xdev -exec chown -h 1000:1000 {} +
              echo "==> Reconciled persistent OpenClaw state ownership to UID/GID 1000"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_READ_SEARCH
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /home/node/.openclaw
        - name: openclaw-state-migration
          image: ghcr.io/datrab/kubeclaw-prism-agent@sha256:162c824aaee80a21376b70f07caf23204bd861a795afc91e45527990d20cbd97
          imagePullPolicy: IfNotPresent
          stdin: true
          tty: true
          command:
            - /bin/sh
            - '-c'
            - |
              set -eu
              state_db="/home/node/.openclaw/state/openclaw.sqlite"
              if [ ! -f "$state_db" ]; then
                echo "==> No existing OpenClaw state database; migration not required"
                exit 0
              fi
              config_path="/home/node/.openclaw/openclaw.json"
              if [ -f "$config_path" ]; then
                node <<'NODE'
              const fs = require('node:fs');
              const configPath = '/home/node/.openclaw/openclaw.json';
              const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
              const legacyEntries = Array.isArray(config?.agents?.list)
                ? config.agents.list
                : [];
              const keyedEntries = config?.agents?.entries
                && typeof config.agents.entries === 'object'
                && !Array.isArray(config.agents.entries)
                ? Object.entries(config.agents.entries)
                : [];
              let changed = false;
              config.agents = config.agents || {};
              if (legacyEntries.length > 0) {
                const canonicalEntries = Object.fromEntries(keyedEntries);
                for (const legacyEntry of legacyEntries) {
                  if (!legacyEntry || typeof legacyEntry !== 'object' || !legacyEntry.id) continue;
                  const { id, ...entry } = legacyEntry;
                  delete entry.default;
                  canonicalEntries[id] = { ...(canonicalEntries[id] || {}), ...entry };
                }
                config.agents.entries = canonicalEntries;
                delete config.agents.list;
                changed = true;
                console.log('==> Migrated agents.list to canonical keyed agents.entries');
              }
              if (Object.hasOwn(config.agents, 'ownership')) {
                delete config.agents.ownership;
                changed = true;
                console.log('==> Removed multi-agent ownership from the managed single-agent roster');
              }
              const currentEntries = config?.agents?.entries
                && typeof config.agents.entries === 'object'
                && !Array.isArray(config.agents.entries)
                ? config.agents.entries
                : {};
              const managedMainEntry = {
                ...(currentEntries.main && typeof currentEntries.main === 'object'
                  ? currentEntries.main
                  : {}),
              };
              delete managedMainEntry.default;
              const managedEntries = { main: managedMainEntry };
              if (JSON.stringify(currentEntries) !== JSON.stringify(managedEntries)) {
                config.agents.entries = managedEntries;
                changed = true;
                console.log('==> Converged the managed OpenClaw roster to the sole main agent');
              }
              config.agents.defaults = config.agents.defaults || {};
              if (config.agents.defaults.systemAgent?.agentId !== 'main') {
                config.agents.defaults.systemAgent = { agentId: 'main' };
                changed = true;
                console.log('==> Set agents.defaults.systemAgent.agentId=main');
              }
              if (config.agents.defaults.heartbeat?.agentId
                  && config.agents.defaults.heartbeat.agentId !== 'main') {
                config.agents.defaults.heartbeat.agentId = 'main';
                changed = true;
                console.log('==> Reassigned heartbeat ownership to main');
              }
              if (config?.channels?.discord
                  && Object.hasOwn(config.channels.discord, 'groupAllowFrom')) {
                delete config.channels.discord.groupAllowFrom;
                changed = true;
                console.log('==> Removed retired Discord groupAllowFrom configuration');
              }
              const isBroadDefaultDiscordBinding = (binding) => {
                const match = binding?.match;
                return !binding?.type
                  && match?.channel === 'discord'
                  && (match.accountId === undefined || match.accountId === 'default')
                  && match.peer === undefined
                  && match.guildId === undefined
                  && match.teamId === undefined
                  && match.roles === undefined;
              };
              if (config?.channels?.discord?.enabled === true) {
                const existingBindings = Array.isArray(config.bindings) ? config.bindings : [];
                const retainedBindings = existingBindings.filter(
                  (binding) => !isBroadDefaultDiscordBinding(binding),
                );
                config.bindings = [
                  { agentId: 'main', match: { channel: 'discord', accountId: 'default' } },
                  ...retainedBindings,
                ];
                if (JSON.stringify(config.bindings) !== JSON.stringify(existingBindings)) {
                  changed = true;
                  console.log('==> Bound discord:default to the main agent');
                }
              }
              const managedPluginAllow = ['discord', 'acpx', 'codex', 'openai'];
              if (process.env.AGENT_ROLE === 'buster') managedPluginAllow.push('kubeclaw-agent-observer');
              if (process.env.AGENT_ROLE === 'prism') managedPluginAllow.push('kubeclaw-prism');
              config.plugins = config.plugins || {};
              config.plugins.entries = config.plugins.entries || {};
              if (JSON.stringify(config.plugins.allow) !== JSON.stringify(managedPluginAllow)) {
                config.plugins.allow = managedPluginAllow;
                changed = true;
                console.log('==> Synchronized installed plugin allowlist');
              }
              if (process.env.AGENT_ROLE !== 'buster'
                  && config.plugins.entries['kubeclaw-agent-observer']) {
                delete config.plugins.entries['kubeclaw-agent-observer'];
                changed = true;
                console.log('==> Removed Buster-only observer configuration from non-Buster agent');
              }
              if (process.env.AGENT_ROLE !== 'prism'
