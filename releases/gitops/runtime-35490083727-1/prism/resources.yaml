        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubeclaw
          podSelector:
            matchLabels:
              app.kubernetes.io/component: nova
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubeclaw
          podSelector:
            matchLabels:
              app.kubernetes.io/component: prism
      ports:
        - protocol: TCP
          port: 8443
