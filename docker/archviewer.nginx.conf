server {
    listen 3456;
    listen [::]:3456;
    server_name _;

    root /designs;
    autoindex off;
    auth_basic "Architecture presentations";
    auth_basic_user_file /etc/archviewer-auth/htpasswd;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
