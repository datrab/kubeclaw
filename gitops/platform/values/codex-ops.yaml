# Non-secret cluster configuration; preserve Ops platform reads explicitly.
# Images and chart revision come from releases/ops-images.json in the generator.
networkPolicy:
  apiServerCIDRs:
    - 10.43.0.1/32
    - 100.97.157.101/32
  apiServerPort: 6443
  cilium: false
rbac:
  readAllNamespaces: true
  namespaces:
    - kubeclaw-ops
    - kubeclaw
    - argocd
    - kube-system
    - tailscale
    - spire-server
    - spire-system
mcp:
  clients:
    - id: codex
      readAllNamespaces: true
      tokenSecret: codex-ops-bearer
      namespace: kubeclaw-ops
      podLabels:
        app.kubernetes.io/name: codex-ops
      namespaces:
        - kubeclaw-ops
        - kubeclaw
        - argocd
        - kube-system
        - tailscale
        - spire-server
        - spire-system
      namespacePrefixes:
        - test
      tools:
        - platform_cluster_state
        - platform_network_state
        - list_argocd_applications
        - get_namespace
        - namespace_overview
        - get_pod
        - get_events
        - get_pod_logs
        - get_hubble_flows
        - get_pod_metrics
        - exec_pod
      exec:
        - namespacePrefix: test
          allPods: true
          allContainers: true
          timeoutSeconds: 30
          maxOutputBytes: 65536
        - namespace: kubeclaw
          podLabels:
            app.kubernetes.io/instance: agent-buster
          containers:
            - buster-v2-runtime
          timeoutSeconds: 30
          maxOutputBytes: 65536
        - namespace: kubeclaw
          podLabels:
            app.kubernetes.io/instance: agent-nova
          containers:
            - kubeclaw
            - archviewer
          timeoutSeconds: 30
          maxOutputBytes: 65536
    - id: nova
      tokenSecret: nova-ops-bearer
      namespace: kubeclaw
      podLabels:
        app.kubernetes.io/instance: agent-nova
      namespaces:
        - kubeclaw
      namespacePrefixes:
        - test
      tools:
        - get_namespace
        - namespace_overview
        - get_pod
        - get_events
        - get_pod_logs
        - get_pod_metrics
        - exec_pod
      exec:
        - namespacePrefix: test
          allPods: true
          allContainers: true
          timeoutSeconds: 30
          maxOutputBytes: 65536
        - namespace: kubeclaw
          podLabels:
            app.kubernetes.io/instance: agent-buster
          containers:
            - buster-v2-runtime
          timeoutSeconds: 30
          maxOutputBytes: 65536
    - id: buster
      tokenSecret: buster-ops-bearer
      namespace: kubeclaw
      podLabels:
        app.kubernetes.io/instance: agent-buster
      namespaces: []
      namespacePrefixes:
        - test
      tools:
        - get_namespace
        - namespace_overview
        - get_pod
        - get_events
        - get_pod_logs
        - get_pod_metrics
        - exec_pod
      exec:
        - namespacePrefix: test
          allPods: true
          allContainers: true
          timeoutSeconds: 30
          maxOutputBytes: 65536
