# Non-secret cluster configuration; preserve Ops platform reads explicitly.
# Images and chart revision come from releases/ops-images.json in the generator.
networkPolicy:
  apiServerCIDRs:
    - 10.43.0.1/32
    - 100.97.157.101/32
  apiServerPort: 6443
  cilium: false
rbac:
  readAllNamespaces: true
  execAllNonSystemNamespaces: true
  namespaces:
    - kubeclaw-ops
    - kubeclaw
    - argocd
    - kube-system
    - tailscale
    - spire-server
    - spire-system
mcp:
  monitoring:
    enabled: true
  clients:
    - id: codex
      readOnly: false
      readAllNamespaces: true
      tokenSecret: codex-ops-bearer
      namespace: kubeclaw-ops
      podLabels:
        app.kubernetes.io/name: codex-ops
      namespaces:
        - kubeclaw-ops
        - kubeclaw
        - argocd
        - kube-system
        - tailscale
        - spire-server
        - spire-system
      namespacePrefixes:
        - test
      tools:
        - platform_cluster_state
        - platform_network_state
        - list_argocd_applications
        - namespace_overview
        - get_pod
        - get_events
        - get_pod_logs
        - get_hubble_flows
        - get_pod_metrics
        - get_resource_inventory
        - get_monitoring_metrics
        - get_monitoring_alerts
        - exec_pod
      exec:
        - allNonSystemNamespaces: true
          allPods: true
          allContainers: true
          timeoutSeconds: 30
          maxOutputBytes: 65536
    - id: nova
      tokenSecret: nova-ops-bearer
      namespace: kubeclaw
      podLabels:
        app.kubernetes.io/instance: agent-nova
      namespaces:
        - kubeclaw
        - argocd
      namespacePrefixes:
        - test
      tools:
        - list_argocd_applications
        - namespace_overview
        - get_pod
        - get_events
        - get_pod_logs
        - get_hubble_flows
        - get_pod_metrics
        - get_resource_inventory
        - exec_pod
      exec:
        - namespacePrefix: test
          allPods: true
          allContainers: true
          timeoutSeconds: 30
          maxOutputBytes: 65536
        - namespace: kubeclaw
          allPods: true
          allContainers: true
          timeoutSeconds: 30
          maxOutputBytes: 65536
    - id: buster
      tokenSecret: buster-ops-bearer
      namespace: kubeclaw
      podLabels:
        app.kubernetes.io/instance: agent-buster
      namespaces: []
      namespacePrefixes:
        - test
      tools:
        - namespace_overview
        - get_pod
        - get_events
        - get_pod_logs
        - get_pod_metrics
        - exec_pod
      exec:
        - namespacePrefix: test
          allPods: true
          allContainers: true
          timeoutSeconds: 30
          maxOutputBytes: 65536
