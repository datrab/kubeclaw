apiVersion: v1
kind: ServiceAccount
metadata:
  name: familyclaw-telegram-enrollment
  namespace: kubeclaw-ops
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: familyclaw-telegram-enrollment
  namespace: familyclaw
rules:
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [familyclaw-telegram]
    verbs: [get]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: familyclaw-telegram-enrollment
  namespace: familyclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: familyclaw-telegram-enrollment
subjects:
  - kind: ServiceAccount
    name: familyclaw-telegram-enrollment
    namespace: kubeclaw-ops
---
apiVersion: batch/v1
kind: Job
metadata:
  name: familyclaw-telegram-enrollment-v1
  namespace: kubeclaw-ops
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: familyclaw-telegram-enrollment
    spec:
      serviceAccountName: familyclaw-telegram-enrollment
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-secret
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: enroll
          image: ghcr.io/datrab/kubeclaw-codex-ops@sha256:5503432010b853b1a4d59727fee00a017604de754f541fe908c678a4f47d7b65
          command: [node, /bootstrap/telegram-enrollment.mjs]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
          volumeMounts:
            - {name: code, mountPath: /bootstrap, readOnly: true}
            - {name: work, mountPath: /work}
      volumes:
        - name: code
          configMap: {name: familyclaw-telegram-enrollment-code}
        - name: work
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
