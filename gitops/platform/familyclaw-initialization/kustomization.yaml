apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - resources.yaml
  - telegram-enrollment.yaml
configMapGenerator:
  - name: familyclaw-initialization-code
    namespace: kubeclaw-ops
    files:
      - run.mjs
      - argo-sync.mjs
      - runtime-configuration.mjs
