apiVersion: v1
kind: Namespace
metadata:
  name: familyclaw
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: familyclaw-initialization
  namespace: argocd
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: familyclaw-initialization
  namespace: familyclaw
rules:
  - apiGroups: ['']
    resources: [secrets, configmaps, persistentvolumeclaims]
    verbs: [get]
  - apiGroups: ['']
    resources: [secrets, configmaps]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: familyclaw-initialization
  namespace: familyclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: familyclaw-initialization
subjects:
  - kind: ServiceAccount
    name: familyclaw-initialization
    namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: familyclaw-initialization-sync
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [familyclaw]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: familyclaw-initialization-sync
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: familyclaw-initialization-sync
subjects:
  - kind: ServiceAccount
    name: familyclaw-initialization
    namespace: argocd
---
apiVersion: batch/v1
kind: Job
metadata:
  name: familyclaw-initialization-v1
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: familyclaw-initialization
    spec:
      serviceAccountName: familyclaw-initialization
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: initialize
          image: ghcr.io/datrab/kubeclaw-codex-ops@sha256:5503432010b853b1a4d59727fee00a017604de754f541fe908c678a4f47d7b65
          command: [node, /bootstrap/run.mjs]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          volumeMounts:
            - {name: code, mountPath: /bootstrap, readOnly: true}
            - {name: repository, mountPath: /repository, readOnly: true}
            - {name: known-hosts, mountPath: /known-hosts, readOnly: true}
            - {name: work, mountPath: /work}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: code
          configMap: {name: familyclaw-initialization-code}
        - name: repository
          secret:
            secretName: familyclaw-repository
            defaultMode: 0440
            items: [{key: sshPrivateKey, path: sshPrivateKey}]
        - name: known-hosts
          configMap: {name: argocd-ssh-known-hosts-cm}
        - name: work
          emptyDir: {medium: Memory, sizeLimit: 128Mi}
        - name: temporary
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
