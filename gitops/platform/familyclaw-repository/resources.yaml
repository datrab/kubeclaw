apiVersion: v1
kind: Secret
metadata:
  name: familyclaw-repository
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
# Only nonsecret binding fields. Argo preserves /data after first creation;
# the Job generates and patches the private key directly in the cluster.
data:
  type: Z2l0
  url: c3NoOi8vZ2l0QHNzaC5naXRodWIuY29tOjQ0My9kYXRyYWIvRmFtaWx5Y2xhdy5naXQ=
  project: ZmFtaWx5Y2xhdw==
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: familyclaw-repository-bootstrap
  namespace: argocd
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: familyclaw-repository-bootstrap
  namespace: argocd
rules:
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [familyclaw-repository]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: familyclaw-repository-bootstrap
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: familyclaw-repository-bootstrap
subjects:
  - kind: ServiceAccount
    name: familyclaw-repository-bootstrap
    namespace: argocd
---
apiVersion: batch/v1
kind: Job
metadata:
  name: familyclaw-repository-bootstrap-v1
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: familyclaw-repository-bootstrap
    spec:
      serviceAccountName: familyclaw-repository-bootstrap
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          # Existing immutable Node runtime already used by the household Core.
          image: registry-local.kubeclaw.svc.cluster.local:5001/kubeclaw/pipeline/application@sha256:9e1649caf23d4c83be70a5315a2352e94415d5c937c5cbb48a1245a9870ad6c2
          command: [node, /bootstrap/provision-key.mjs]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: familyclaw-repository-code
