# Additive same-namespace mTLS path; no image, service, RBAC or ingress changes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nova-prism-control-access
  namespace: kubeclaw
  labels:
    app.kubernetes.io/name: prism-control-access
    app.kubernetes.io/part-of: kubeclaw
    app.kubernetes.io/component: network-access
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubeclaw
      app.kubernetes.io/instance: agent-nova
      app.kubernetes.io/component: nova
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: prism-control }
      ports: [{ protocol: TCP, port: 8443 }]
