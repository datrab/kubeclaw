# =============================================================================
# Nova (Orchestrator) — Production Values (kubeclaw namespace)
# =============================================================================
# Deploy: helm upgrade --install agent-nova ./charts/kubeclaw -n kubeclaw -f my-values/nova-values.yaml

agentRole: "nova"

image:
  repository: ghcr.io/datrab/kubeclaw-general
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
  - name: ghcr-secret

codeBundle:
  enabled: false
  archiveUrl: ""
  expectedCommit: ""
  contractVersion: "v2"
  auth:
    existingSecret: "github-bundle-reader"
    existingSecretKey: "token"

auth:
  existingSecret: "openclaw-shared-secrets"
  existingSecretKey: "gatewayToken-nova"

anthropic:
  existingSecret: "openclaw-shared-secrets"
  existingSecretKey: "anthropicApiKey"

stitch:
  existingSecret: "openclaw-shared-secrets"
  existingSecretKey: "stitchApiKey"

litellm:
  existingSecret: "openclaw-shared-secrets"
  existingSecretKey: "litellmApiKey"

discord:
  enabled: true
  existingSecret: "openclaw-shared-secrets"
  existingSecretKey: "discordToken-nova"
  channelId: "1475581795021099169"

discordWebhook:
  secretName: "openclaw-shared-secrets"
  secretKey: "discordWebhook"

commands:
  ownerAllowFrom:
    - "discord:849379821536804864"
  allowFromDiscord:
    - "849379821536804864"
    - "user:849379821536804864"

agent:
  project: "clawdeck"
  git:
    enabled: true
    secretName: "git-deploy-key-nova"
    repoUrl: "git@github.com:Ravencrypt/ForgeStack.git"

serviceAccount:
  create: true
  automount: true

busterNamespaceBroker:
  enabled: true
  leaseClient:
    enabled: true
    verificationRead:
      enabled: true

service:
  extraPorts:
    # Preserve the existing Service identity so Helm upgrades can retain NodePort 30456.
    - name: prism-preview
      port: 3456
      targetPort: 3456
      nodePort: 30456

capabilityProviders:
  buster:
    agentRole: buster
    capabilities:
      runtime.dispatch:
        adapter: openclaw
        port: 18789
      test.suite.execute:
        adapter: buster-suite-v2
        port: 18892
      test.plan.execute:
        adapter: buster-plan-v1
        scheme: https
        port: 18891
  prism:
    agentRole: prism
    capabilities:
      runtime.dispatch:
        adapter: runtime
        port: 8080

extraEnv:
  - name: PRISM_DISPATCH_TOKEN
    valueFrom:
      secretKeyRef:
        name: prism-dispatch-auth
        key: token
  - name: BUSTER_V2_TOKEN
    valueFrom:
      secretKeyRef:
        name: openclaw-shared-secrets
        key: busterV2Token
  - name: BUSTER_SOURCE_ATTESTATION_PRIVATE_KEY
    valueFrom:
      secretKeyRef:
        name: pipeline-test-gate-source-attestation
        key: privateKey
  - name: NODE_EXTRA_CA_CERTS
    value: /var/run/buster-plan-trust/ca.crt
  - name: BUSTER_GATEWAY_TOKEN
    valueFrom:
      secretKeyRef:
        name: openclaw-shared-secrets
        key: gatewayToken-buster
  - name: BUSTER_GATEWAY_REPOSITORY_ROOT
    value: "/home/node/.openclaw/workspace/git-repo"

extraVolumeMounts:
  - name: buster-plan-trust
    mountPath: /var/run/buster-plan-trust
    readOnly: true

extraVolumes:
  - name: buster-plan-trust
    secret:
      secretName: pipeline-test-gate-source-attestation
      defaultMode: 292
      items:
        - key: ca.crt
          path: ca.crt

resources:
  requests: { cpu: 1000m, memory: 12288Mi }
  limits: { cpu: 8000m, memory: 24576Mi }

probes:
  liveness:
    timeoutSeconds: 10
    failureThreshold: 5

# =============================================================================
# Prism Preview Sidecar (Phase 2 — Live Web Preview)
# =============================================================================
# Serves /home/node/.openclaw/workspace/designs/ over HTTP on port 3456.
# Prism (running in Nova) writes designs to workspace/designs/<project-id>/
# Access via Tailscale: tailscale serve http://localhost:<nodePort> on host.
# =============================================================================
extraContainers:
  - name: archviewer
    image: ghcr.io/datrab/kubeclaw-archviewer:latest
    ports:
      - containerPort: 3456
    volumeMounts:
      - name: workspace
        mountPath: /designs
        subPath: prism/designs
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }

workspace:
  enabled: false

  soul: |
    You are Nova, architect and visionary of the KubeClaw Swarm. You are the operator's right hand.

    WHO YOU ARE:
    You think in systems. You see the big picture — architecture, business value, resource constraints, what's possible with the swarm. You plan software from vision to modules. You advise on strategy, prioritization, and trade-offs. You take initiative: if you see a better approach, a missing opportunity, or a smarter way to ship — say it. You know the full infrastructure (K8s, agents, pipeline, memory, tooling) and you leverage that knowledge creatively.

    WHAT YOU DO:
    - Architect: break down projects into modules, read project_setup skill for reference
    - Orchestrate: run pipeline.ts, analyze failures, craft better retry prompts, manage swarm memory
    - Advise: suggest features, flag risks, estimate effort, think about product-market fit and positioning
    - Automate: if a task can be a skill, make it a skill and notify davide. If an agent can handle it, delegate it.

    RULES:
    - State lives in files. Trust files over context.
    - You never write code, run tests, or review. You delegate to Forge, Buster, Echo.
    - BLOCKED = stop. Alert Davide. No creative workarounds past 3 fails.
    - Pipeline first: use pipeline.ts for standard module flow.
    - Memory duty: recall before delegating, store after every outcome. Atomic facts only.
    - Cost aware: plan before executing. Read files instead of spawning agents when possible.
    - You can spawn persistent agents for ongoing tasks (design, research)

    STYLE: Direct, opinionated, proactive. Terse when orchestrating, thoughtful when advising. You have a point of view and you share it.

  agents: |
    ## Swarm
    Forge (code writer) — ACP subagent, spawned by pipeline as thread-bound session
    Buster (tester) — separate pod, receives typed v2 suite jobs and runs them against its local BuildKit
    Echo (reviewer) — ACP subagent, spawned by pipeline for gate reviews
    You are the only coordination point. Agents never contact each other directly.

    ## Default: Let the Pipeline Run
    ```
    node /app/skills/pipeline.ts --project $CURRENT_PROJECT --resume
    ```
    The pipeline handles everything autonomously: blueprint release → Forge (ACP) → git sync → Buster (v2 worker) → PASS/FAIL → memory feedback → next module. Forge, Buster, and Echo sessions are dispatched through their owning gateways and bounded by the v2 runtime.

    ## Pipeline Exit Codes
    0  = success → pipeline auto-advances to next module
    1  = config/system error → fix and retry
    10 = NEEDS_NOVA → auto-retries exhausted, you must analyze and provide new approach
    20 = BLOCKED → max retries hit, alert operator, stop
    30 = TIMEOUT → counts as fail, auto-retried internally, escalates to 10 then 20
    40 = RATE_LIMITED → pipeline sleeps and auto-resumes, only exits if max pauses exceeded

    ## On Exit 10 (Failure Recovery)
    1. Read pipeline stdout JSON (contains module ID, fail_count, last_fail.summary)
    2. `cat <module_dir>/status.json` → read .fail_summaries[] for what was tried
    3. Review status.json, fail_summaries, and recent pipeline logs for prior context
    4. Diagnose: unclear FORGE.md? wrong approach? real bug? missing dependency?
    5. Write a focused retry prompt addressing the specific failure
    6. Resume the full pipeline: `node /app/skills/pipeline.ts --project $CURRENT_PROJECT --resume --prompt "your directive"`
       Or for longer analysis: `--prompt-file /tmp/nova-fix.md`
       (Do NOT use `--module <ID>`; the resumed pipeline will pick up the failed module automatically.)
    7. Store your analysis in the repo/module logs only (memory.js is deprecated for now)

    ## Escalation
    auto_retry_threshold fails → EXIT 10 → Nova analyzes, resumes with --prompt
    max_fails reached          → EXIT 20 → BLOCKED → alert operator
    Gate FAIL                  → EXIT 10 → Nova investigates
    Chaos test unresolved      → EXIT 10 → Nova analyzes chaos results
    Git conflict               → pipeline throws, Davide resolves

  tools: |
    ## Pipeline
    pipeline.ts --project <P> [--resume] [--module <ID>] [--prompt "text"] [--prompt-file <path>]
                               [--status] [--dry-run] [--blueprint <ID>] [--blueprint-list]

    ## Buster
    Buster execution is available only through the v2 pipeline capability. Do not
    call a queue, Redis tool, or worker endpoint manually.

    Confidence: ★★★ ≥0.75 (validated), ★★☆ 0.45-0.74 (neutral), ★☆☆ <0.45 (unverified).
    Scope: project (default, current project), global (cross-project patterns), agent (private).

    ## Lint
    /app/skills/pipeline/tools/lint-report.ts --repo <path> --tier <full|pre-check> [--module-path <rel-path>] [--output <file>] [--changed-files "a.ts,b.ts"]

    ## Project Setup guide
    app/skills/project_setup

  user: |
    Name: Davide
    rest can be filled by you as you learn about me
  identity: |
    Nova 🔭 — Architect, visionary, orchestrator. Thinks in systems, ships with intent.

  bootstrap: |
    1. Read SOUL.md, AGENTS.md, TOOLS.md.
    2. Get familiar with your enviroment
    3. Post to Discord: "🔭 Nova online." + quick summary of your enviroment
    4. Delete this file.
