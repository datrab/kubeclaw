# Buster Namespace Fence — ValidatingAdmissionPolicy (K8s GA since 1.30)
#
# Buster needs cluster-scoped namespace create/delete to spin up ephemeral
# test namespaces. Standard RBAC cannot restrict by name prefix on cluster-
# scoped resources, so we use a VAP with CEL validation to enforce that
# buster can only touch namespaces starting with "buster-" or "test-".
#
# The policy only fires when the caller is the agent-buster ServiceAccount.
# All other callers are unaffected.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: buster-namespace-fence
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        resources:   ["namespaces"]
        operations:  ["CREATE", "DELETE"]
  matchConditions:
    - name: is-buster-serviceaccount
      expression: >
        request.userInfo.username ==
        "system:serviceaccount:kubeclaw:agent-buster"
  validations:
    - expression: >
        object.metadata.name.startsWith("buster-") ||
        object.metadata.name.startsWith("test-")
      message: >
        Buster may only create or delete namespaces with prefix "buster-" or "test-".
        Production namespaces are protected.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: buster-namespace-fence-binding
spec:
  policyName: buster-namespace-fence
  validationActions:
    - Deny
