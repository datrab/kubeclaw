# Buster Namespace Fence — ValidatingAdmissionPolicy (K8s GA since 1.30)
#
# The Buster namespace controller needs cluster-scoped namespace create/delete
# to spin up ephemeral test namespaces. Standard RBAC cannot restrict by name
# prefix on cluster-scoped resources, so we use a VAP with CEL validation to
# enforce that only the broker controller can touch managed namespaces starting
# with "test-".
#
# The policy only fires when the caller is the Buster ServiceAccount or the
# Buster namespace-controller ServiceAccount. All other callers are unaffected.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: buster-namespace-fence
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        resources:   ["namespaces"]
        operations:  ["CREATE", "UPDATE", "DELETE"]
  matchConditions:
    - name: is-buster-namespace-actor
      expression: >
        request.userInfo.username ==
        "system:serviceaccount:kubeclaw:agent-buster" ||
        request.userInfo.username ==
        "system:serviceaccount:kubeclaw:agent-buster-namespace-controller"
  validations:
    - expression: >
        request.operation != "UPDATE" || (
          oldObject.metadata.name.startsWith("test-") &&
          has(oldObject.metadata.labels) &&
          "kubeclaw/managed-by" in oldObject.metadata.labels &&
          oldObject.metadata.labels["kubeclaw/managed-by"] == "buster-namespace-controller"
        )
      message: The controller cannot adopt an existing unowned namespace by updating its labels.
    - expression: >
        request.userInfo.username !=
        "system:serviceaccount:kubeclaw:agent-buster"
      message: >
        Buster must request BusterNamespaceLease objects instead of creating or
        deleting namespaces directly.
    - expression: >
        request.operation != "DELETE"
          ? (
              object.metadata.name.startsWith("test-") &&
              has(object.metadata.labels) &&
              "kubeclaw/managed-by" in object.metadata.labels &&
              object.metadata.labels["kubeclaw/managed-by"] ==
                "buster-namespace-controller"
            )
          : (
              oldObject.metadata.name.startsWith("test-") &&
              has(oldObject.metadata.labels) &&
              "kubeclaw/managed-by" in oldObject.metadata.labels &&
              oldObject.metadata.labels["kubeclaw/managed-by"] ==
                "buster-namespace-controller"
            )
      message: >
        The Buster namespace controller may only create, update or delete managed
        namespaces with prefix "test-".
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: buster-namespace-fence-binding
spec:
  policyName: buster-namespace-fence
  validationActions:
    - Deny

---
# Reserve the trust-bearing label against ordinary namespace creators/updaters.
# Platform break-glass uses system:masters. Add future GitOps identity explicitly
# here before delegating ownership; do not authorize arbitrary namespace admins.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: buster-namespace-owner-label
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["namespaces"]
        operations: ["CREATE", "UPDATE"]
  variables:
    - name: oldOwner
      expression: 'oldObject != null && has(oldObject.metadata.labels) && "kubeclaw/managed-by" in oldObject.metadata.labels ? oldObject.metadata.labels["kubeclaw/managed-by"] : ""'
    - name: newOwner
      expression: 'has(object.metadata.labels) && "kubeclaw/managed-by" in object.metadata.labels ? object.metadata.labels["kubeclaw/managed-by"] : ""'
  validations:
    - expression: >
        variables.oldOwner == variables.newOwner ||
        (variables.oldOwner != "buster-namespace-controller" && variables.newOwner != "buster-namespace-controller") ||
        request.userInfo.groups.exists(g, g == "system:masters") ||
        request.userInfo.username == "system:serviceaccount:kubeclaw:agent-buster-namespace-controller"
      message: Only the platform or Buster namespace controller may change the reserved namespace ownership label.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: buster-namespace-owner-label-binding
spec:
  policyName: buster-namespace-owner-label
  validationActions: [Deny]
