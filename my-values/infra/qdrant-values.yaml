replicaCount: 1
args:
  - >-
    if ! [[ ${QDRANT__SERVICE__API_KEY:-} =~ ^[A-Za-z0-9._~-]{32,512}$ ]]; then
    printf '%s\n' 'QDRANT_API_KEY_REQUIRED' >&2; exit 1; fi;
    if ! [[ ${QDRANT__SERVICE__READ_ONLY_API_KEY:-} =~ ^[A-Za-z0-9._~-]{32,512}$ ]] ||
    [[ ${QDRANT__SERVICE__READ_ONLY_API_KEY} == ${QDRANT__SERVICE__API_KEY} ]]; then
    printf '%s\n' 'QDRANT_DISTINCT_READ_ONLY_KEY_REQUIRED' >&2; exit 1; fi;
    exec ./config/initialize.sh
env:
  - name: QDRANT__SERVICE__API_KEY
    valueFrom:
      secretKeyRef:
        name: qdrant-auth
        key: api-key
  - name: QDRANT__SERVICE__READ_ONLY_API_KEY
    valueFrom:
      secretKeyRef:
        name: qdrant-auth
        key: read-only-api-key
image:
  repository: docker.io/qdrant/qdrant
  # The pinned chart uses semverCompare on this field. The required deployment
  # post-renderer binds the resulting image to versions.json's exact digest.
  tag: v1.19.1
persistence:
  size: 15Gi
snapshotPersistence:
  enabled: true
  size: 30Gi
config:
  service:
    enable_tls: true
  tls:
    cert: /qdrant/tls/tls.crt
    key: /qdrant/tls/tls.key
    ca_cert: /qdrant/tls/ca.crt
additionalVolumes:
  - name: qdrant-tls
    secret:
      secretName: qdrant-tls
additionalVolumeMounts:
  - name: qdrant-tls
    mountPath: /qdrant/tls
    readOnly: true
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 4Gi }
chartTests:
  dbInteraction:
    image: registry.suse.com/bci/bci-base:latest@sha256:3e961532089c1ca792d004250b56f02af782ee909f5543086166d89730d8eaab
