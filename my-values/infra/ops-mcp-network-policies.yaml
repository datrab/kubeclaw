# Ops-owned Cilium policies. Apply before Ops workloads after the CNI cutover.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  namespace: kubeclaw
  name: ops-mcp-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ops-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: ops-mcp-tunnel
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
            tailscale.com/managed: "true"
            tailscale.com/parent-resource-type: ingress
            tailscale.com/parent-resource: ops-mcp
            tailscale.com/parent-resource-ns: kubeclaw
      toPorts:
        - ports:
            - protocol: TCP
              port: "8080"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  namespace: kubeclaw
  name: ops-mcp-kubernetes-api-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ops-mcp
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - protocol: TCP
              port: "443"
            - protocol: TCP
              port: "6443"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  namespace: kubeclaw
  name: ops-mcp-hubble-relay-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ops-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cilium
            k8s-app: hubble-relay
      toPorts:
        - ports:
            - protocol: TCP
              port: "4245"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  namespace: kubeclaw
  name: ops-mcp-tunnel-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ops-mcp-tunnel
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: ops-mcp
      toPorts:
        - ports:
            - protocol: TCP
              port: "8080"
    - toEntities:
        - world
      toPorts:
        - ports:
            - protocol: TCP
              port: "443"

