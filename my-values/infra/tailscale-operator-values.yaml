# Tailscale Kubernetes Operator values.
#
# OAuth credentials are intentionally not stored here. The official chart
# mounts Secret/operator-oauth from the operator namespace when oauth.clientId
# and oauth.clientSecret are empty. The secret must contain:
#
#   client_id: <Tailscale OAuth client ID>
#   client_secret: <Tailscale OAuth client secret>

oauth:
  clientId: ""
  clientSecret: ""

installCRDs: true

ingressClass:
  enabled: true
  name: tailscale

operatorConfig:
  image:
    repository: docker.io/tailscale/k8s-operator
    digest: sha256:d86a8be7ad9d38714968f5d4e010ba8dad30c8f672736ef94eda9b250febeb12
  defaultTags:
    - tag:k8s-operator
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }

proxyConfig:
  image:
    repository: docker.io/tailscale/tailscale
    digest: sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
  defaultTags: tag:k8s
