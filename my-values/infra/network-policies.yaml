# KubeClaw project-owned Cilium policy.
#
# Cilium itself is central cluster infrastructure. These rules belong here
# because they describe KubeClaw workload connectivity inside namespace kubeclaw.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubeclaw-default-deny
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubeclaw-allow-dns-egress
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - protocol: UDP
              port: "53"
            - protocol: TCP
              port: "53"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubeclaw-agents-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubeclaw
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [prism]
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: redis
            app.kubernetes.io/name: redis
      toPorts:
        - ports:
            - protocol: TCP
              port: "6379"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: qdrant
            app.kubernetes.io/name: qdrant
      toPorts:
        - ports:
            - protocol: TCP
              port: "6333"
            - protocol: TCP
              port: "6334"
    - toEndpoints:
        - matchLabels:
            app: litellm
      toPorts:
        - ports:
            - protocol: TCP
              port: "4000"
    - toEndpoints:
        - matchLabels:
            app: registry-local
      toPorts:
        - ports:
            - protocol: TCP
              port: "5000"
            - protocol: TCP
              port: "5001"
    - toEndpoints:
        - matchLabels:
            app: registry-mirror
      toPorts:
        - ports:
            - protocol: TCP
              port: "5000"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kubeclaw
      toPorts:
        - ports:
            - protocol: TCP
              port: "18789"
            - protocol: TCP
              port: "18790"
    - toEntities:
        - world
      toPorts:
        - ports:
            - protocol: TCP
              port: "22"
            - protocol: TCP
              port: "80"
            - protocol: TCP
              port: "443"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubeclaw-agents-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubeclaw
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [prism]
  ingress:
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            - protocol: TCP
              port: "18789"
            - protocol: TCP
              port: "18790"
    - fromEntities:
        - world
      toPorts:
        - ports:
            - protocol: TCP
              port: "3456"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubeclaw-nova-buster-test-gates
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubeclaw
      app.kubernetes.io/component: nova
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kubeclaw
            app.kubernetes.io/component: buster
      toPorts:
        - ports:
            - protocol: TCP
              port: "18891"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubeclaw-buster-test-gates-from-nova
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubeclaw
      app.kubernetes.io/component: buster
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kubeclaw
            app.kubernetes.io/component: nova
      toPorts:
        - ports:
            - protocol: TCP
              port: "18891"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubeclaw-nova-prism-agent-trust
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubeclaw
      app.kubernetes.io/component: nova
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kubeclaw
            app.kubernetes.io/component: prism
      toPorts:
        - ports:
            - protocol: TCP
              port: "18082"
    - toEndpoints:
        - matchLabels:
            "io.cilium.k8s.namespace.labels.kubeclaw/managed-by": buster-namespace-controller
            app.kubernetes.io/name: kubeclaw
            app.kubernetes.io/component: prism
      toPorts:
        - ports:
            - protocol: TCP
              port: "18082"
---
apiVersion: cilium.io/v2
