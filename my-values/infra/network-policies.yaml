# KubeClaw project-owned network allow policies.
#
# The central `dtlabs-workload-default-deny` and `dtlabs-workload-allow-dns`
# CiliumClusterwideNetworkPolicy objects already select the kubeclaw namespace.
# This file therefore contains only KubeClaw-specific explicit allows.
#
# Most rules use CiliumNetworkPolicy. `kubeclaw-agents-ingress` deliberately
# remains a portable Kubernetes NetworkPolicy because its `podSelector: {}`
# source expresses exactly "all pods in this policy's namespace" without
# hard-coding or templating the deployment namespace. Cilium enforces KNP too.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubeclaw-agents-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubeclaw
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [prism]
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: redis
            app.kubernetes.io/name: redis
      toPorts:
        - ports:
            - protocol: TCP
              port: "6379"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: qdrant
            app.kubernetes.io/name: qdrant
      toPorts:
        - ports:
            - protocol: TCP
              port: "6333"
            - protocol: TCP
              port: "6334"
    - toEndpoints:
        - matchLabels:
            app: litellm
      toPorts:
        - ports:
            - protocol: TCP
              port: "4000"
    - toEndpoints:
        - matchLabels:
            app: registry-local
      toPorts:
        - ports:
            - protocol: TCP
              port: "5000"
            - protocol: TCP
              port: "5001"
    - toEndpoints:
        - matchLabels:
            app: registry-mirror
      toPorts:
        - ports:
            - protocol: TCP
              port: "5000"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kubeclaw
      toPorts:
        - ports:
            - protocol: TCP
              port: "18789"
            - protocol: TCP
              port: "18790"
    - toEntities:
        - world
      toPorts:
        - ports:
            - protocol: TCP
              port: "22"
            - protocol: TCP
              port: "80"
            - protocol: TCP
              port: "443"
---
# Keep this rule portable on purpose. In Kubernetes NetworkPolicy a bare
# podSelector source is inherently scoped to this policy's namespace, which is
# exactly the desired behavior even when NAMESPACE is customized.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeclaw-agents-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubeclaw
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [prism]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 18789
        - protocol: TCP
          port: 18790
    # Archviewer is intentionally exposed through its NodePort.
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 3456
---
apiVersion: cilium.io/v2
