apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubeclaw-nova-prism-agent-trust
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubeclaw
      app.kubernetes.io/component: nova
  egress:
    # Production Prism is selected by workload identity only. Because this is a
    # namespaced CNP, this selector retains the CNP's owning-namespace scope and
    # therefore follows a custom NAMESPACE without hard-coding `kubeclaw`.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kubeclaw
            app.kubernetes.io/component: prism
      toPorts:
        - ports:
            - protocol: TCP
              port: "18082"
    # Short-lived Prism test namespaces are trusted only when the Buster
    # namespace controller owns the namespace. This existing ownership label is
    # a trust boundary, not a general namespace policy-profile mechanism.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kubeclaw
            app.kubernetes.io/component: prism
            io.cilium.k8s.namespace.labels.kubeclaw/managed-by: buster-namespace-controller
      toPorts:
        - ports:
            - protocol: TCP
              port: "18082"
---
