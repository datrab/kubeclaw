# Requires Secret/kubeclaw-openai-tunnel in namespace kubeclaw with:
#   api_key: <OpenAI runtime API key>
#   tunnel_id: <tunnel_...>
#
# Create the tunnel in OpenAI Platform first, then apply this manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-mcp-tunnel
  namespace: kubeclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-mcp-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-mcp-tunnel
    spec:
      automountServiceAccountToken: false
      containers:
        - name: tunnel-client
          image: ghcr.io/openai/tunnel-client:v0.0.10
          imagePullPolicy: IfNotPresent
          env:
            - name: CONTROL_PLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubeclaw-openai-tunnel
                  key: api_key
            - name: CONTROL_PLANE_TUNNEL_ID
              valueFrom:
                secretKeyRef:
                  name: kubeclaw-openai-tunnel
                  key: tunnel_id
            - name: MCP_SERVER_URL
              value: http://ops-mcp.kubeclaw.svc.cluster.local:8080/mcp
            - name: LOG_LEVEL
              value: info
            - name: LOG_FORMAT
              value: json
            - name: HEALTH_LISTEN_ADDR
              value: :8081
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # Upstream tunnel-client currently runs as root in its Alpine image.
          # Keep privileges constrained without forcing runAsNonRoot, which would
          # prevent the image from starting.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
