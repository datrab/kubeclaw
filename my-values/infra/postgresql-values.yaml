architecture: standalone
auth:
  database: litellm
  username: litellm
  existingSecret: postgresql-secrets
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: litellm-password
primary:
  persistence:
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }
