# Initial single-node profile, not a measured workload capacity guarantee.
# Render and review before activation; reconcile ordinary Pod requests first.
# Worker ceilings: 3.5 CPUs / 24 GiB, one active scope per role.
# CPU is deliberately shared with native pools; RAM/PID reservations stay dedicated.
# Total withheld from Pods: 1 CPU / 27.5 GiB -> 11 CPU Allocatable on this 12-CPU node.
schemaVersion: 1
nodeName: ax41-production
runtime:
  containerdVersion: 2.3.4-k3s1.36
# Scheduler accounting only; does not change native pool cgroups or their digests.
cpuReservation:
  mode: overcommit
  systemMillicores: 500
  kubernetesMillicores: 500
systemReserve:
  cpuMillicores: 1000
  memoryBytes: 3221225472
  tasks: 2048
kubernetesReserve:
  cpuMillicores: 500
  memoryBytes: 536870912
  tasks: 2048
pools:
  buster:
    namespace: kubeclaw
    cpuMillicores: 1500
    memoryBytes: 8589934592
    tasks: 4096
    maximumActiveScopes: 1
  prism:
    namespace: kubeclaw
    cpuMillicores: 2000
    memoryBytes: 17179869184
    tasks: 2048
    maximumActiveScopes: 1
