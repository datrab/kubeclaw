# Registry Local — Writable registry for buster ephemeral test images
#
# Unlike registry-mirror (pull-through cache, read-only), this is a plain
# registry:2 with no proxy config, so push is enabled. Buster builds the
# production Dockerfile and pushes to this registry before deploying to
# the test namespace.
#
# Anonymous HTTP lab registry only; never select it implicitly for node pulls.
# No PVC: replacing this Pod can lose every image. Deleting a test namespace
# does not delete shared registry data. There is no reference-aware GC here.
# Operators must retain required digests for active leases/demos and resumable
# runs, provision storage/capacity explicitly, and perform deliberate cleanup.
# See docs/operations/registry-clients.md. This is not a durable registry service.
# Port 5001 to avoid clash with registry-mirror (5000).
# The registry image uses a mirror only if the node CRI is separately configured.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-local
  labels:
    app: registry-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-local
  template:
    metadata:
      labels:
        app: registry-local
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: registry-local
  labels:
    app: registry-local
spec:
  selector:
    app: registry-local
  ports:
    - port: 5001
      targetPort: 5000
      protocol: TCP
  type: ClusterIP
