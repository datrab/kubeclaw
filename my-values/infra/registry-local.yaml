# Anonymous HTTP lab registry. Render through scripts/render-registry-local.mjs.
# Storage class/capacity MUST be supplied explicitly; do not apply this template.
# RWOP needs a supporting CSI provisioner. Never substitute RWO: it allows
# concurrent writer/GC Pods on the same node. See docs/operations/registry-clients.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-local-data
spec:
  accessModes: [ReadWriteOncePod]
  storageClassName: REQUIRED_STORAGE_CLASS
  resources:
    requests:
      storage: REQUIRED_CAPACITY
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-local-config
data:
  config.yml: |
    version: 0.1
    log:
      level: info
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: false
      maintenance:
        uploadpurging:
          enabled: false
    http:
      addr: :5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-local
  labels:
    app: registry-local
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry-local
  template:
    metadata:
      labels:
        app: registry-local
    spec:
      containers:
        - name: registry
          image: registry:3.0.0
          args: [serve, /etc/kubeclaw-registry/config.yml]
          ports:
            - containerPort: 5000
          env:
            - name: OTEL_TRACES_EXPORTER
              value: none
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: config
              mountPath: /etc/kubeclaw-registry
              readOnly: true
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-local-data
        - name: config
          configMap:
            name: registry-local-config
---
apiVersion: v1
kind: Service
metadata:
  name: registry-local
  labels:
    app: registry-local
spec:
  selector:
    app: registry-local
  ports:
    - port: 5001
      targetPort: 5000
      protocol: TCP
  type: ClusterIP
