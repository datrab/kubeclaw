# Buster production values. The gateway owns Buster agent sessions; the
# colocated v2 runtime owns deterministic suites and rootless BuildKit.
agentRole: "buster"

anthropic:
  existingSecret: "openclaw-shared-secrets"
  existingSecretKey: "anthropicApiKey"

gateway:
  resources:
    requests: { cpu: 1000m, memory: 12288Mi, ephemeral-storage: 1Gi }
    limits: { cpu: 1000m, memory: 24576Mi, ephemeral-storage: 50Gi }

image:
  repository: ghcr.io/datrab/kubeclaw-buster-gateway
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
  - name: ghcr-secret

codeBundle:
  enabled: false
  archiveUrl: ""
  expectedCommit: ""
  contractVersion: "v2"
  auth:
    existingSecret: "github-bundle-reader"
    existingSecretKey: "token"

auth:
  existingSecret: "openclaw-shared-secrets"
  existingSecretKey: "gatewayToken-buster"

litellm:
  existingSecret: "openclaw-shared-secrets"
  existingSecretKey: "litellmApiKey"

discord:
  enabled: true
  existingSecret: "openclaw-shared-secrets"
  existingSecretKey: "discordToken-buster"
  channelId: "1473692599125540985"
  execApprovers:
    - "user:849379821536804864"

commands:
  ownerAllowFrom:
    - "discord:849379821536804864"
  allowFromDiscord:
    - "849379821536804864"
    - "user:849379821536804864"

discordWebhook:
  secretName: "openclaw-shared-secrets"
  secretKey: "discordWebhook"

agent:
  project: "clawdeck"
  git:
    enabled: true
    secretName: "git-deploy-key-buster"
    repoUrl: "git@github.com:Ravencrypt/ForgeStack.git"

serviceAccount:
  create: true
  automount: false

service:
  extraPorts:
    - name: buster-v2
      port: 18891
      targetPort: buster-v2

extraContainers:
  - name: buster-v2-runtime
    image: ghcr.io/datrab/kubeclaw-buster-runtime:latest
    imagePullPolicy: Always
    env:
      - name: BUSTER_V2_TOKEN
        valueFrom:
          secretKeyRef:
            name: openclaw-shared-secrets
            key: busterV2Token
      - name: BUSTER_V2_PORT
        value: "18891"
      - name: BUSTER_V2_STATE_DIR
        value: /var/lib/buster-v2/jobs
      - name: BUSTER_V2_RUN_DIR
        value: /tmp/buster-v2-runs
      - name: BUSTER_V2_MAX_ARCHIVE_BYTES
        value: "67108864"
      - name: BUSTER_V2_MAX_EXTRACTED_BYTES
        value: "536870912"
      - name: BUSTER_V2_RESULT_ROOT
        value: /workspace/git-repo/.swarm/runtime-results
      - name: BUSTER_V2_KUBERNETES_CREDENTIALS
        value: /var/run/buster-worker/kubernetes
      - name: KUBECLAW_LOCAL_REGISTRY
        value: registry-local.kubeclaw.svc.cluster.local:5001
    ports:
      - name: buster-v2
        containerPort: 18891
        protocol: TCP
    startupProbe:
      httpGet:
        path: /healthz
        port: buster-v2
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 60
    readinessProbe:
      httpGet:
        path: /healthz
        port: buster-v2
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /healthz
        port: buster-v2
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: buster-v2-state
        mountPath: /var/lib/buster-v2
      - name: buster-api-token
        mountPath: /var/run/buster-worker/kubernetes
        readOnly: true
    resources:
      requests: { cpu: "2", memory: 8Gi, ephemeral-storage: 8Gi }
      limits: { cpu: "8", memory: 24Gi, ephemeral-storage: 60Gi }
    securityContext:
      # A narrowly-capable supervisor starts BuildKit as UID 1000 and enters
      # UID 1001 for each submitted suite before dropping every capability.
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
      privileged: false
      allowPrivilegeEscalation: true
      appArmorProfile: { type: Unconfined }
      seccompProfile: { type: Unconfined }
      capabilities:
        drop: ["ALL"]
        # The supervisor uses these only to prepare and enter the unprivileged
        # per-job identity. setpriv drops the complete capability set before
        # any submitted suite code starts.
        add: ["CHOWN", "SETGID", "SETPCAP", "SETUID"]
    readinessProbe:
      httpGet: { path: /healthz, port: buster-v2 }
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 6
    livenessProbe:
      httpGet: { path: /healthz, port: buster-v2 }
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 2
      failureThreshold: 3

extraVolumes:
  # Only the v2 sidecar mounts this authoritative receipt store. The Buster
  # gateway and submitted suite code cannot read or mutate worker state.
  - name: buster-v2-state
    emptyDir:
      sizeLimit: 64Mi
  - name: buster-api-token
    # The chart's pod security context fixes fsGroup at 1000. Kubernetes
    # therefore presents these 0440 projected files to the non-root worker as
    # root:1000; submitted jobs run with different groups and cannot read them.
    projected:
      defaultMode: 288
      sources:
        - serviceAccountToken:
            path: token
            expirationSeconds: 3600
        - configMap:
            name: kube-root-ca.crt
            items:
              - key: ca.crt
                path: ca.crt
        - downwardAPI:
            items:
              - path: namespace
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace

busterNamespaceBroker:
  enabled: true
  controller:
    additionalRunnerServiceAccounts:
      - "kubeclaw/agent-nova"
    image:
      repository: ghcr.io/datrab/kubeclaw-namespace-controller
      tag: "latest"
      pullPolicy: Always

resources:
  requests: { cpu: 500m, memory: 4096Mi }
  limits: { cpu: 4000m, memory: 24576Mi }

workspace:
  enabled: false
  soul: |
    You are Buster. Hunt for bugs, report exact reproduction evidence, and
    never repair product code. Pipeline lifecycle authority stays in v2 core.
  identity: |
    Buster 💥 — Destructive tester. Cold, precise, relentless.
