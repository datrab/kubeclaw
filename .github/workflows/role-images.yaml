name: Role image acceptance
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'skills/**'
      - 'docker/**'
      - 'versions.json'
      - '.dockerignore'
      - 'tsconfig.base.json'
      - 'scripts/versions.mjs'
      - 'scripts/check-role-image.sh'
      - 'scripts/check-built-runtime-image.sh'
      - 'scripts/registry-client-config.mjs'
      - 'scripts/build-plugin-sandbox.mjs'
      - 'tests/verification/contracts/check-pipeline-container-build-production.mts'
      - 'tests/verification/contracts/check-pipeline-container-build-recovery.mts'
      - 'tests/verification/live/**'
      - 'tests/verification/deployment/check-buster-build.sh'
      - 'contracts/**'
      - 'go.mod'
      - 'cmd/**'
      - 'scripts/prepare-image-build-runner.sh'
      - '.github/workflows/role-images.yaml'
      - 'charts/kubeclaw/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: [nova, prism-agent, buster-gateway, buster-runtime, namespace-controller, archviewer, prism-control, prism-studio, prism-worker, prism-ingestion]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: node scripts/versions.mjs --check
      - name: Provision image build capacity
        run: bash scripts/prepare-image-build-runner.sh
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build the image once for acceptance
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.name }}
          load: true
          push: false
          tags: kubeclaw-${{ matrix.name }}:proof
          build-args: |
            KUBECLAW_BUILD_REVISION=${{ github.sha }}
            TRIVY_DATABASE_REFRESH=${{ github.run_id }}.${{ github.run_attempt }}
          cache-from: type=gha,scope=runtime-acceptance-${{ matrix.name }}
          cache-to: type=gha,scope=runtime-acceptance-${{ matrix.name }},mode=min,ignore-error=true
      - name: Verify the built artifact
        env:
          ROLE: ${{ matrix.name }}
          IMAGE: kubeclaw-${{ matrix.name }}:proof
        run: bash scripts/check-built-runtime-image.sh "$ROLE" "$IMAGE"
