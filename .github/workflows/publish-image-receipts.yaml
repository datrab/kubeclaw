name: Preserve image release receipts
on:
  workflow_call:
    inputs:
      family:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-receipt-*
          merge-multiple: true
          path: receipt-input
      - name: Preserve immutable source record beyond CI artifact retention
        env:
          GH_TOKEN: ${{ github.token }}
          FAMILY: ${{ inputs.family }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          case "$FAMILY" in runtime|ops) ;; *) exit 1 ;; esac
          node scripts/updates/release-images.mjs receipt-input "$GITHUB_SHA" "receipt-output/$FAMILY-images.json" "$FAMILY"
          tag="$FAMILY-images-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'Immutable %s image receipts for source commit %s, workflow run %s attempt %s. Eligibility additionally requires that source attempt to finish successfully.\n' "$FAMILY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/receipt-notes.md"
          gh release create "$tag" "receipt-output/$FAMILY-images.json" --target "$GITHUB_SHA" --title "$FAMILY image receipts $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --notes-file "$RUNNER_TEMP/receipt-notes.md" --latest=false
