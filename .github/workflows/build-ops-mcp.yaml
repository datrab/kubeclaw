name: Build Ops Images

on:
  pull_request:
    paths:
      - 'versions.json'
      - 'scripts/versions.mjs'
      - 'tools/ops-mcp/**'
      - 'ops/pod/**'
      - 'charts/ops-pod/**'
      - 'scripts/deploy-ops-pod.sh'
      - '.github/workflows/build-ops-mcp.yaml'
  push:
    branches: [main]
    paths:
      - 'versions.json'
      - 'scripts/versions.mjs'
      - 'tools/ops-mcp/**'
      - 'ops/pod/**'
      - 'charts/ops-pod/**'
      - 'scripts/deploy-ops-pod.sh'
      - '.github/workflows/build-ops-mcp.yaml'
  workflow_dispatch:

concurrency:
  group: ops-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kubeclaw-ops-mcp
            context: tools/ops-mcp
          - image: kubeclaw-codex-ops
            context: ops/pod
    env:
      IMAGE_NAME: ${{ matrix.image }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check central runtime versions
        run: node scripts/versions.mjs --check

      - name: Test Ops MCP
        working-directory: tools/ops-mcp
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0

      - name: Test Ops Pod and actual Codex CLI
        working-directory: ops/pod
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=candidate-,format=long

      - name: Build and load for runtime validation
        if: github.event_name == 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: false
          sbom: false

      - name: Smoke-test the actual Codex container without account credentials
        if: github.event_name == 'pull_request' && matrix.image == 'kubeclaw-codex-ops'
        env:
          TEST_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: bash ops/pod/test-image.sh "$TEST_IMAGE"

      - name: Smoke-test the actual MCP container
        if: github.event_name == 'pull_request' && matrix.image == 'kubeclaw-ops-mcp'
        env:
          TEST_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: bash tools/ops-mcp/test-image.sh "$TEST_IMAGE"

      - name: Publish candidate image with attestations
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Exercise the exact published artifact and record its receipt
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.publish.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          if [[ "$IMAGE_NAME" == kubeclaw-codex-ops ]]; then
            bash ops/pod/test-image.sh "$IMAGE"
          else
            bash tools/ops-mcp/test-image.sh "$IMAGE"
          fi
          mkdir -p dist/image-receipts
          node -e 'const name=process.env.IMAGE_NAME.replace(/^kubeclaw-/, "");require("fs").writeFileSync(`dist/image-receipts/${name}.json`,JSON.stringify({name,image:process.env.IMAGE,commit:process.env.GITHUB_SHA})+"\n")'
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: image-receipt-${{ matrix.image }}
          path: dist/image-receipts/*.json
          if-no-files-found: error

      - name: Summary
        run: |
          echo '### ${{ matrix.image }} image' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            echo 'PR validation build only; image was not pushed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Deploy: `${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
          fi

  preserve-receipts:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/publish-image-receipts.yaml
    with:
      family: ops
    permissions:
      contents: write
      actions: read
