name: Build Ops Images
on:
  pull_request:
    paths:
      - versions.json
      - scripts/versions.mjs
      - tools/ops-mcp/**
      - my-values/infra/**
      - scripts/*cilium*
      - examples/cilium/**
      - ops/pod/**
      - charts/ops-pod/**
      - scripts/deploy-ops-pod.sh
      - .github/workflows/build-ops-mcp.yaml
  push:
    branches:
      - main
    paths:
      - versions.json
      - scripts/versions.mjs
      - tools/ops-mcp/**
      - my-values/infra/**
      - scripts/*cilium*
      - examples/cilium/**
      - ops/pod/**
      - charts/ops-pod/**
      - scripts/deploy-ops-pod.sh
      - .github/workflows/build-ops-mcp.yaml
  workflow_dispatch: null
concurrency:
  group: ops-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kubeclaw-ops-mcp
            context: tools/ops-mcp
          - image: kubeclaw-codex-ops
            context: ops/pod
    env:
      IMAGE_NAME: ${{ matrix.image }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check central runtime versions
        run: node scripts/versions.mjs --check
      - name: Test Ops MCP
        working-directory: tools/ops-mcp
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Test Cilium policy contracts
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 tools/ops-mcp/test/policy_contract_test.py
          bash -n scripts/deploy-cilium.sh scripts/migrate-kubeclaw-network-policies-to-cilium.sh
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Test Ops Pod and actual Codex CLI
        working-directory: ops/pod
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=candidate-,format=long
      - name: Build and load for runtime validation
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
      - name: Smoke-test the actual Codex container without account credentials
        if: matrix.image == 'kubeclaw-codex-ops'
        env:
          TEST_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: bash ops/pod/test-image.sh "$TEST_IMAGE"
      - name: Smoke-test the actual MCP container
        if: matrix.image == 'kubeclaw-ops-mcp'
        env:
          TEST_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: bash tools/ops-mcp/test-image.sh "$TEST_IMAGE"
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kubeclaw-ops-mcp
            context: tools/ops-mcp
          - image: kubeclaw-codex-ops
            context: ops/pod
    env:
      IMAGE_NAME: ${{ matrix.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check central runtime versions
        run: node scripts/versions.mjs --check
      - name: Test Ops MCP
        working-directory: tools/ops-mcp
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Test Cilium policy contracts
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 tools/ops-mcp/test/policy_contract_test.py
          bash -n scripts/deploy-cilium.sh scripts/migrate-kubeclaw-network-policies-to-cilium.sh
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Test Ops Pod and actual Codex CLI
        working-directory: ops/pod
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=candidate-,format=long
      - name: Publish candidate image with attestations
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Exercise the exact published artifact and record its receipt
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.publish.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          if [[ "$IMAGE_NAME" == kubeclaw-codex-ops ]]; then
            bash ops/pod/test-image.sh "$IMAGE"
          else
            bash tools/ops-mcp/test-image.sh "$IMAGE"
          fi
          mkdir -p dist/image-receipts
          node -e 'const name=process.env.IMAGE_NAME.replace(/^kubeclaw-/, "");require("fs").writeFileSync(`dist/image-receipts/${name}.json`,JSON.stringify({name,image:process.env.IMAGE,commit:process.env.GITHUB_SHA})+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-receipt-${{ matrix.image }}
          path: dist/image-receipts/*.json
          if-no-files-found: error
      - name: Summary
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}
        run: |
          printf "### Published candidate image\n\n%s\n" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
  preserve-receipts:
    needs: publish
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-image-receipts.yaml
    with:
      family: ops
    permissions:
      contents: write
      actions: read
permissions:
  contents: read
