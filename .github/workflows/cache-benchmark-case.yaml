name: Cache benchmark case
on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      role:
        type: string
        required: true
jobs:
  measure:
    name: Cache benchmark (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Reject untrusted registry writes and invalid benchmark roles
        env:
          PROFILE: ${{ inputs.profile }}
          ROLE: ${{ inputs.role }}
        run: |
          case "$ROLE" in nova|buster-runtime|buster-gateway|prism-agent) ;; *) exit 2 ;; esac
          case "$PROFILE" in gha-min|gha-max) ;; registry-max) test "$GITHUB_REF" = refs/heads/main && test "$GITHUB_EVENT_NAME" != pull_request ;; *) exit 2 ;; esac
      - name: Provision image build capacity
        run: bash scripts/prepare-image-build-runner.sh
      - name: Login only for trusted registry cache export
        if: inputs.profile == 'registry-max'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Configure isolated measured cache
        id: cache
        env:
          ROLE: ${{ inputs.role }}
          PROFILE: ${{ inputs.profile }}
        run: node scripts/ci/cache-profile.mjs "$ROLE" "$PROFILE" "bench-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PROFILE}-${ROLE}"
      - name: Create clean cold builder
        id: cold-builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Cold cache-only build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile.${{ inputs.role }}
          builder: ${{ steps.cold-builder.outputs.name }}
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-to: ${{ steps.cache.outputs.to }}
          build-args: |
            KUBECLAW_BUILD_REVISION=${{ github.sha }}
            TRIVY_DATABASE_REFRESH=benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
          sbom: true
      - name: Create independent warm builder
        id: warm-builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Reject local builder reuse
        env:
          COLD: ${{ steps.cold-builder.outputs.name }}
          WARM: ${{ steps.warm-builder.outputs.name }}
        run: test -n "$WARM" && test "$COLD" != "$WARM"
      - name: Warm cache-only build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile.${{ inputs.role }}
          builder: ${{ steps.warm-builder.outputs.name }}
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          build-args: |
            KUBECLAW_BUILD_REVISION=${{ github.sha }}
            TRIVY_DATABASE_REFRESH=benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
          sbom: true
