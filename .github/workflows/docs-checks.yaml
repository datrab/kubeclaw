name: Docs Checks
on:
  pull_request:
    paths:
      - docs/**
      - scripts/docs-*.mjs
      - scripts/tests/docs-status.test.mjs
      - scripts/deploy.sh
      - package.json
      - package-lock.json
      - .github/workflows/**
      - my-values/**
      - charts/kubeclaw/**
      - deploy/**
      - docker/**
      - tests/**
      - skills/**
  push:
    branches:
      - main
    paths:
      - docs/**
      - scripts/docs-*.mjs
      - scripts/tests/docs-status.test.mjs
      - scripts/deploy.sh
      - package.json
      - package-lock.json
      - .github/workflows/**
      - my-values/**
      - charts/kubeclaw/**
      - deploy/**
      - docker/**
      - tests/**
      - skills/**
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  validate:
    name: Read-only documentation drift guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install repository dependencies
        run: npm ci --ignore-scripts
      - name: Check canonical open-issue register and generated view
        run: npm run docs:status:check && node --test scripts/tests/docs-status.test.mjs
      - name: Regenerate docs
        run: npm run plugin-system:inventory && npm run docs:inventory && npm run docs:generate
      - name: Reject generated docs drift
        run: |
          if git diff --quiet -- docs/generated docs/reference docs/architecture/plugin-system-current-inventory.md; then
            echo "Generated docs are already current."
            exit 0
          fi

          echo "::error::Generated docs are stale. Run npm run plugin-system:inventory && npm run docs:inventory && npm run docs:generate and commit the result."
          git diff --name-only -- docs/generated docs/reference docs/architecture/plugin-system-current-inventory.md
          exit 1
      - name: Check generated docs freshness
        run: npm run docs:check:generated
      - name: Check Markdown hygiene
        run: node scripts/docs-check.mjs
      - name: Verify reference-checking boundaries
        run: node --test tests/verification/deployment/docs-reference-scope.test.mjs
      - name: Check cited repository references
        run: npm run docs:check:refs
      - name: Check documentation topic map
        run: npm run docs:check:coverage
      - name: Check whitespace
        run: git diff --check
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    permissions:
      contents: read
  update:
    name: Trusted main documentation update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install repository dependencies
        run: npm ci --ignore-scripts
      - name: Check canonical open-issue register and generated view
        run: npm run docs:status:check && node --test scripts/tests/docs-status.test.mjs
      - name: Regenerate docs
        run: npm run plugin-system:inventory && npm run docs:inventory && npm run docs:generate
      - name: Check generated docs freshness
        run: npm run docs:check:generated
      - name: Check Markdown hygiene
        run: node scripts/docs-check.mjs
      - name: Verify reference-checking boundaries
        run: node --test tests/verification/deployment/docs-reference-scope.test.mjs
      - name: Check cited repository references
        run: npm run docs:check:refs
      - name: Check documentation topic map
        run: npm run docs:check:coverage
      - name: Check whitespace
        run: git diff --check
      - name: Commit generated docs
        run: |
          if git diff --quiet -- docs/generated docs/reference docs/architecture/plugin-system-current-inventory.md; then
            echo "Generated docs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated docs/reference docs/architecture/plugin-system-current-inventory.md
          git commit -m "docs: refresh generated references"
          git push origin HEAD:refs/heads/main
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write
