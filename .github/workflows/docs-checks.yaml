name: Docs Checks

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/docs-*.mjs'
      - 'scripts/deploy.sh'
      - 'my-values/**'
      - 'charts/kubeclaw/**'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs-*.mjs'
      - 'scripts/deploy.sh'
      - 'my-values/**'
      - 'charts/kubeclaw/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  docs:
    name: Generated docs and Markdown hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check docs
        run: npm run docs:check
      - name: Check whitespace
        run: git diff --check
