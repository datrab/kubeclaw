name: Docs Checks

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/docs-*.mjs'
      - 'scripts/deploy.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
      - 'my-values/**'
      - 'charts/kubeclaw/**'
      - 'deploy/**'
      - 'docker/**'
      - 'tests/**'
      - 'skills/**'
      - 'plugins/**'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs-*.mjs'
      - 'scripts/deploy.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
      - 'my-values/**'
      - 'charts/kubeclaw/**'
      - 'deploy/**'
      - 'docker/**'
      - 'tests/**'
      - 'skills/**'
      - 'plugins/**'
  workflow_dispatch:

jobs:
  docs:
    name: Documentation drift guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check generated docs freshness
        run: npm run docs:check:generated
      - name: Check Markdown hygiene
        run: node scripts/docs-check.mjs
      - name: Check cited repository references
        run: npm run docs:check:refs
      - name: Check coverage matrix and topic map
        run: npm run docs:check:coverage
      - name: Check whitespace
        run: git diff --check
