name: Documentation
on:
  pull_request:
    paths: ['docs/**', 'scripts/docs-reader/**', 'scripts/lib/docs-markdown-anchors.mjs', 'scripts/lib/docs-route-continuity.mjs', 'scripts/docs-published-route-baseline.json', 'scripts/tests/docs-reader*.mjs', 'scripts/tests/docs-root-layout.test.mjs', 'package.json', 'package-lock.json', '.github/workflows/docs-checks.yaml']
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/docs-reader/**', 'scripts/lib/docs-markdown-anchors.mjs', 'scripts/lib/docs-route-continuity.mjs', 'scripts/docs-published-route-baseline.json', 'scripts/tests/docs-reader*.mjs', 'scripts/tests/docs-root-layout.test.mjs', 'package.json', 'package-lock.json', '.github/workflows/docs-checks.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --include=dev
      - run: npm ci --ignore-scripts --prefix scripts/docs-reader
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run docs:check
      - run: npm run docs:test
      - run: npm run docs:build
      - run: node scripts/docs-reader/check-artifact.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-reader
          path: .tmp/docs-publication/
          include-hidden-files: true
          if-no-files-found: error
