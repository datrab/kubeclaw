name: Dependency updates
on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-updates
  cancel-in-progress: false
jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Require updater identity
        env:
          APP_ID: ${{ vars.DEPENDENCY_APP_ID }}
          APP_KEY: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
        run: test -n "$APP_ID" && test -n "$APP_KEY"
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.DEPENDENCY_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Prepare trusted updater
        run: |
          mkdir -p "$RUNNER_TEMP/kubeclaw-updates/updates"
          cp scripts/updates/refresh-versions.mjs "$RUNNER_TEMP/kubeclaw-updates/updates/"
          cp scripts/updates/renovate.cjs scripts/versions.mjs scripts/infrastructure-chart-lock.mjs scripts/runtime-tool-locks.mjs "$RUNNER_TEMP/kubeclaw-updates/"
          echo "RENOVATE_IMAGE=$(node -p 'require("./versions.json").automation.renovate')" >> "$GITHUB_ENV"
      - name: Discover updates and prepare pull requests
        env:
          RENOVATE_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          docker run --rm \
            -e RENOVATE_TOKEN -e GITHUB_REPOSITORY \
            -e RENOVATE_CONFIG_FILE=/opt/kubeclaw-updates/renovate.cjs \
            -v "$RUNNER_TEMP/kubeclaw-updates:/opt/kubeclaw-updates:ro" \
            "$RENOVATE_IMAGE"
