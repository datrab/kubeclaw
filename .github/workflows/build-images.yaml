name: Build Runtime Images And Skill Bundles
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      receipt_scope:
        description: Rollout receipt selection, independent of required image builds
        required: false
        type: choice
        options: [ all, buster ]
        default: all
      retained_baseline:
        description: Optional immutable releases/gitops baseline authenticated before retention
        required: false
        type: string
        default: ""
      runtime_refresh_plan:
        description: Optional additive JSON refresh plan with images and bundles arrays
        required: false
        type: string
        default: ""
      cache_profile:
        description: Measured cache comparison; default retains existing gha-min policy
        type: choice
        options:
          - gha-min
          - gha-max
          - registry-max
        default: gha-min
env:
  RUNTIME_RECEIPT_SCOPE: ${{ inputs.receipt_scope || 'all' }}
  GITOPS_RETAINED_BASELINE: ${{ inputs.retained_baseline || '' }}
  REGISTRY: ghcr.io
  RUNTIME_REFRESH_PLAN: ${{ inputs.runtime_refresh_plan || '' }}
jobs:
  update-policy:
    uses: ./.github/workflows/update-checks.yaml
    with:
      retained_baseline: ${{ inputs.retained_baseline || '' }}
    permissions:
      contents: read
      actions: read
  reliability:
    uses: ./.github/workflows/pipeline-reliability.yaml
    permissions:
      contents: read
  detect-build-inputs:
    name: Detect Image Build Inputs
    runs-on: ubuntu-latest
    outputs:
      image_inputs_changed: ${{ steps.filter.outputs.image_inputs }}
      image_matrix: ${{ steps.filter.outputs.image_matrix }}
      deployment_inputs_changed: ${{ steps.filter.outputs.deployment_inputs }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Detect image and deployment inputs separately
        id: filter
        run: node scripts/updates/runtime-inputs.mjs
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - detect-build-inputs
    if: |-
      needs.detect-build-inputs.outputs.image_inputs_changed == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.detect-build-inputs.outputs.image_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Provision image build capacity
        run: bash scripts/prepare-image-build-runner.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select measurable cache profile
        id: cache
        env:
          CACHE_PROFILE: ${{ inputs.cache_profile || 'gha-min' }}
          ROLE: ${{ matrix.name }}
        run: node scripts/ci/cache-profile.mjs "$ROLE" "$CACHE_PROFILE"
      - name: Look up content-keyed toolchain
        id: toolchain
        env:
          ROLE: ${{ matrix.name }}
        run: node scripts/ci/toolchain.mjs lookup "$ROLE"
      - name: Build changed toolchain only
        id: toolchain-build
        if: steps.toolchain.outputs.enabled == 'true' && steps.toolchain.outputs.hit != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.name }}
          target: toolchain
          platforms: linux/amd64
          push: true
          tags: ${{ steps.toolchain.outputs.tag }}
          cache-from: type=gha,scope=toolchain-${{ matrix.name }}
          cache-to: type=gha,scope=toolchain-${{ matrix.name }},mode=max,ignore-error=true
          provenance: mode=max
          sbom: true
      - name: Pin toolchain digest
        id: toolchain-pin
        if: steps.toolchain.outputs.enabled == 'true'
        env:
          ROLE: ${{ matrix.name }}
          BUILT_TOOLCHAIN_DIGEST: ${{ steps.toolchain-build.outputs.digest }}
        run: node scripts/ci/toolchain.mjs pin "$ROLE"
      - name: Generate tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/kubeclaw-${{ matrix.name }}
          tags: |
            type=sha,prefix=candidate-,format=long
      - name: Build & Push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KUBECLAW_BUILD_REVISION=${{ github.sha }}
            TRIVY_DATABASE_REFRESH=${{ github.run_id }}.${{ github.run_attempt }}
            KUBECLAW_TOOLCHAIN=${{ steps.toolchain-pin.outputs.image || 'toolchain' }}
          provenance: mode=max
          sbom: true
          platforms: linux/amd64
      - name: Verify the exact published artifact
        if: contains(fromJSON('["nova","prism-agent","buster-gateway","buster-runtime"]'), matrix.name)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/kubeclaw-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          ROLE: ${{ matrix.name }}
        run: |
          docker pull "$IMAGE"
          bash scripts/check-built-runtime-image.sh "$ROLE" "$IMAGE"
      - name: Record immutable build receipt
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/kubeclaw-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          mkdir -p dist/image-receipts
          node -e 'require("fs").writeFileSync(`dist/image-receipts/${process.env.IMAGE_NAME}.json`, JSON.stringify({name:process.env.IMAGE_NAME,image:process.env.IMAGE,commit:process.env.GITHUB_SHA})+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-receipt-${{ matrix.name }}
          path: dist/image-receipts/*.json
          if-no-files-found: error
      - name: Summary
        run: |
          echo "### ${{ matrix.name }} image pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- BuildKit provenance and SBOM: published with the image" >> $GITHUB_STEP_SUMMARY
          echo "- Local scan: \`npm run scan:images -- ${{ env.REGISTRY }}/${{ github.repository_owner }}/kubeclaw-${{ matrix.name }}@${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
  bundle-skills:
    name: Package & Publish Skill Bundles
    runs-on: ubuntu-latest
    needs:
      - detect-build-inputs
      - build
      - reliability
      - update-policy
      - prepare-bundles
    if: |
      always() && needs.prepare-bundles.result == 'success' && needs.reliability.result == 'success' && needs.update-policy.result == 'success' &&
      needs.detect-build-inputs.outputs.deployment_inputs_changed == 'true' &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && needs.detect-build-inputs.outputs.image_inputs_changed == 'false')) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      actions: read
    env:
      BUNDLE_RELEASE_TAG: code-bundles-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepared-skill-bundles
          path: dist
      - name: Ensure bundle release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$BUNDLE_RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$BUNDLE_RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Agent code bundles $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
              --notes "Durable Nova, Buster, and Prism runtime bundle release assets."
      - name: Upload bundle assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("dist/SHA256SUMS-${GITHUB_SHA}.txt" "dist/runtime-code.json")
          while IFS= read -r role; do
            assets+=("dist/$role-${GITHUB_SHA}.tgz")
          done < <(jq -r '.[]' dist/roles.json)
          gh release upload "$BUNDLE_RELEASE_TAG" "${assets[@]}"
      - name: Summary
        run: |
          echo "### Runtime bundles" >> "$GITHUB_STEP_SUMMARY"
          echo "Built roles: $(jq -c . dist/roles.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "Unchanged roles retain their selected bundle and source identity." >> "$GITHUB_STEP_SUMMARY"
  prism-live-acceptance:
    name: Prism leased-namespace service smoke
    runs-on: ubuntu-latest
    needs:
      - build
      - detect-build-inputs
      - reliability
      - update-policy
    if: ${{ contains(fromJSON(needs.detect-build-inputs.outputs.image_matrix), 'prism-control') && contains(fromJSON(needs.detect-build-inputs.outputs.image_matrix), 'prism-studio') && contains(fromJSON(needs.detect-build-inputs.outputs.image_matrix), 'prism-worker') && contains(fromJSON(needs.detect-build-inputs.outputs.image_matrix), 'prism-ingestion') && vars.PRISM_LIVE_ACCEPTANCE_ENABLED == 'true' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Configure controller-lease client
        env:
          KUBECONFIG_B64: ${{ secrets.PRISM_TEST_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_B64"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          test "$(kubectl auth can-i create namespaces)" = no
          test "$(kubectl auth can-i create busternamespaceleases.kubeclaw.forgestack.ai -n kubeclaw)" = yes
      - name: Configure published Prism images
        run: |
          set -euo pipefail
          tag="candidate-${GITHUB_SHA}"
          for kind in control studio worker ingestion; do
            upper="${kind^^}"
            echo "PRISM_${upper}_IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER}/kubeclaw-prism-${kind}" >> "$GITHUB_ENV"
            echo "PRISM_${upper}_IMAGE_TAG=${tag}" >> "$GITHUB_ENV"
          done
      - name: Run real Prism acceptance
        env:
          PRISM_E2E_USER: ${{ secrets.PRISM_E2E_USER }}
          PRISM_E2E_USE_LEASE: "true"
        run: bash scripts/deploy.sh prism-e2e
  preserve-receipts:
    needs:
      - build
      - reliability
      - update-policy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.reliability.result == 'success' && needs.update-policy.result == 'success'
    uses: ./.github/workflows/publish-image-receipts.yaml
    with:
      retained_baseline: ${{ inputs.retained_baseline || '' }}
      family: runtime
      receipt_scope: ${{ inputs.receipt_scope || 'all' }}
      runtime_refresh_plan: ${{ inputs.runtime_refresh_plan || '' }}
    permissions:
      contents: write
      actions: read
  prepare-bundles:
    name: Prepare Skill Bundles
    runs-on: ubuntu-latest
    needs:
      - detect-build-inputs
    if: needs.detect-build-inputs.outputs.deployment_inputs_changed == 'true'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Install bundle dependencies
        run: npm ci --ignore-scripts
      - name: Build plugin isolation launcher
        run: npm run plugin-system:sandbox:build
      - name: Authenticate selected receipts before retaining role bundles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/updates/verify-release-source.mjs
      - name: Build changed role bundles
        run: |
          mkdir -p dist
          node scripts/updates/code-release.mjs --roles > dist/roles.json
          while IFS= read -r role; do
            bash ./scripts/package-agent-skill-bundle.sh "$role" "dist/$role-${GITHUB_SHA}.tgz" "$GITHUB_SHA"
          done < <(jq -r '.[]' dist/roles.json)
      - name: Record bundle checksums and source identity
        run: |
          node scripts/updates/code-release.mjs dist "$GITHUB_SHA" "$GITHUB_REPOSITORY"
          # Configuration-only releases can retain every role bundle. Hash the
          # always-present receipt too: GitHub rejects zero-byte release assets.
          (cd dist; find . -maxdepth 1 \( -name '*.tgz' -o -name 'runtime-code.json' \) -print0 | sort -z | xargs -0 sha256sum > "SHA256SUMS-${GITHUB_SHA}.txt")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-skill-bundles
          path: dist/
          if-no-files-found: error
  timings:
    name: CI timings
    needs:
      - detect-build-inputs
      - reliability
      - update-policy
      - build
      - prepare-bundles
      - bundle-skills
      - preserve-receipts
      - prism-live-acceptance
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Measure current attempt job, step and cache costs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/timings.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-timings
          path: dist/ci-timings/
          if-no-files-found: error
