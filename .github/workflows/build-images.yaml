name: Build Runtime Images And Skill Bundles
on:
  push:
    branches: [main]
  # Nightly check for base image updates (OpenClaw releases)
  schedule:
    - cron: '0 3 * * *'  # 3am UTC daily
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
jobs:
  detect-build-inputs:
    name: Detect Image Build Inputs
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      image_inputs_changed: ${{ steps.filter.outputs.image_inputs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Detect image-affecting changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image_inputs:
              - '.dockerignore'
              - 'docker/**'
              - 'go.mod'
              - 'cmd/buster-namespace-controller/**'
              - 'skills/common/plugins/openclaw-agent-observer/**'
              - 'skills/buster/plugins/buster-suite-runtime/**'
              - 'contracts/agent-observability/v1/**'
  check-base-image:
    name: Check pinned OpenClaw base
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify the pinned base is current
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t pinned_refs < <(
            sed -n 's/^ARG OPENCLAW_BASE=//p' \
              docker/Dockerfile.general \
              docker/Dockerfile.buster-gateway \
              | sort -u
          )
          if [[ ${#pinned_refs[@]} -ne 1 ]]; then
            echo "OpenClaw Dockerfiles must share one pinned base reference" >&2
            printf 'Found: %s\n' "${pinned_refs[@]}" >&2
            exit 1
          fi
          pinned_ref="${pinned_refs[0]}"
          pinned_image="${pinned_ref%@*}"
          pinned_version="${pinned_image##*:}"
          pinned_digest="${pinned_ref##*@}"
          release_json="$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 60 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/openclaw/openclaw/releases/latest
          )"
          latest_version="$(jq -r '.tag_name // empty' <<<"$release_json")"
          latest_version="${latest_version#v}"
          latest_ref="ghcr.io/openclaw/openclaw:${latest_version}"
          if [[ ! "$pinned_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid pinned OpenClaw digest: $pinned_digest" >&2
            exit 1
          fi
          if [[ ! "$latest_version" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not resolve the latest stable OpenClaw release" >&2
            exit 1
          fi
          inspect_error="$(mktemp)"
          trap 'rm -f "$inspect_error"' EXIT
          latest_digest=""
          for attempt in 1 2 3; do
            if inspect_output="$(
              docker buildx imagetools inspect \
                "$latest_ref" 2>"$inspect_error"
            )"; then
              latest_digest="$(
                awk '$1 == "Digest:" { print $2; exit }' \
                  <<<"$inspect_output"
              )"
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 5))
            fi
          done
          if [[ ! "$latest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the OpenClaw ${latest_version} image" >&2
            echo "digest after 3 attempts" >&2
            cat "$inspect_error" >&2
            exit 1
          fi
          {
            echo "### OpenClaw base image"
            echo ""
            echo "- Pinned: \`$pinned_ref\`"
            echo "- Latest stable release: \`$latest_ref@$latest_digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$latest_version" != "$pinned_version" ||
                "$latest_digest" != "$pinned_digest" ]]; then
            echo "Pinned OpenClaw base is out of date." >&2
            echo "Update its version, digest, and Debian snapshot." >&2
            exit 1
          fi
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: detect-build-inputs
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.detect-build-inputs.outputs.image_inputs_changed == 'true'))
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: general
            dockerfile: docker/Dockerfile.general
            image_suffix: kubeclaw-general
          - name: buster-gateway
            dockerfile: docker/Dockerfile.buster-gateway
            image_suffix: kubeclaw-buster-gateway
          - name: buster-runtime
            dockerfile: docker/Dockerfile.buster-runtime
            image_suffix: kubeclaw-buster-runtime
          - name: namespace-controller
            dockerfile: docker/Dockerfile.namespace-controller
            image_suffix: kubeclaw-namespace-controller
          - name: prism-preview
            dockerfile: docker/Dockerfile.prism-preview
            image_suffix: kubeclaw-prism-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYY.MM.DD'}}
      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=min,ignore-error=true
          labels: ${{ steps.meta.outputs.labels }}
      - name: Summary
        run: |
          echo "### ${{ matrix.name }} image pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
  bundle-skills:
    name: Package & Publish Skill Bundles
    runs-on: ubuntu-latest
    needs: detect-build-inputs
    if: |
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    env:
      BUNDLE_RELEASE_TAG: agent-code-bundles
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Nova and Buster bundles
        run: |
          mkdir -p dist
          bash ./scripts/package-agent-skill-bundle.sh nova "dist/nova-${GITHUB_SHA}.tgz" "${GITHUB_SHA}"
          bash ./scripts/package-agent-skill-bundle.sh buster "dist/buster-${GITHUB_SHA}.tgz" "${GITHUB_SHA}"
          (
            cd dist
            sha256sum "nova-${GITHUB_SHA}.tgz" "buster-${GITHUB_SHA}.tgz" > "SHA256SUMS-${GITHUB_SHA}.txt"
          )

      - name: Ensure bundle release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$BUNDLE_RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$BUNDLE_RELEASE_TAG" \
              --title "Agent code bundles" \
              --notes "Durable Nova/Buster /app/skills bundle release assets for code deploys."

      - name: Upload bundle assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$BUNDLE_RELEASE_TAG" \
            "dist/nova-${GITHUB_SHA}.tgz#nova-${GITHUB_SHA}.tgz" \
            "dist/buster-${GITHUB_SHA}.tgz#buster-${GITHUB_SHA}.tgz" \
            "dist/SHA256SUMS-${GITHUB_SHA}.txt#SHA256SUMS-${GITHUB_SHA}.txt" \
            --clobber

      - name: Summary
        run: |
          echo "### Skill bundles published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- https://github.com/${{ github.repository }}/releases/download/${BUNDLE_RELEASE_TAG}/nova-${GITHUB_SHA}.tgz" >> $GITHUB_STEP_SUMMARY
          echo "- https://github.com/${{ github.repository }}/releases/download/${BUNDLE_RELEASE_TAG}/buster-${GITHUB_SHA}.tgz" >> $GITHUB_STEP_SUMMARY
          echo "- https://github.com/${{ github.repository }}/releases/download/${BUNDLE_RELEASE_TAG}/SHA256SUMS-${GITHUB_SHA}.txt" >> $GITHUB_STEP_SUMMARY
