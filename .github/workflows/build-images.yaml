name: Build Runtime Images And Skill Bundles
on:
  push:
    branches: [main]
  # Nightly check for base image updates (OpenClaw releases)
  schedule:
    - cron: '0 3 * * *'  # 3am UTC daily
  # Manual trigger
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if no changes detected'
        type: boolean
        default: false
env:
  REGISTRY: ghcr.io
  GENERAL_IMAGE: ghcr.io/${{ github.repository_owner }}/kubeclaw-general
  SANDBOX_IMAGE: ghcr.io/${{ github.repository_owner }}/kubeclaw-sandbox
  NAMESPACE_CONTROLLER_IMAGE: ghcr.io/${{ github.repository_owner }}/kubeclaw-namespace-controller
  PRISM_IMAGE: ghcr.io/${{ github.repository_owner }}/kubeclaw-prism-preview
jobs:
  detect-build-inputs:
    name: Detect Image Build Inputs
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      image_inputs_changed: ${{ steps.filter.outputs.image_inputs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect image-affecting changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image_inputs:
              - 'docker/**'
              - 'skills/**'
              - 'plugins/openclaw-agent-observer/**'
              - 'scripts/buster-namespace-controller.mjs'
              - 'scripts/package-agent-skill-bundle.sh'
  check-base-image:
    name: Check for base image updates
    runs-on: ubuntu-latest
    # Only run on schedule, skip for push (push always builds)
    if: github.event_name == 'schedule'
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check OpenClaw base image digest
        id: check
        run: |
          # Get current digest of base image
          BASE_IMAGE="ghcr.io/openclaw/openclaw:2026.3.7"
          DIGEST=$(docker manifest inspect "$BASE_IMAGE" 2>/dev/null | jq -r '.config.digest // .manifests[0].digest' || echo "unknown")
          echo "Base image digest: $DIGEST"
          # Compare with last known digest (stored as artifact)
          LAST_DIGEST=""
          if [ -f /tmp/last-base-digest.txt ]; then
            LAST_DIGEST=$(cat /tmp/last-base-digest.txt)
          fi
          if [ "$DIGEST" != "$LAST_DIGEST" ] && [ "$DIGEST" != "unknown" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$DIGEST" > /tmp/last-base-digest.txt
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [detect-build-inputs, check-base-image]
    # Run if: manual trigger, base image changed on schedule, or image inputs changed on push
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && needs.check-base-image.outputs.changed == 'true') ||
       (github.event_name == 'push' && needs.detect-build-inputs.outputs.image_inputs_changed == 'true'))
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: general
            dockerfile: docker/Dockerfile.general
            image_suffix: kubeclaw-general
          - name: sandbox
            dockerfile: docker/Dockerfile.sandbox
            image_suffix: kubeclaw-sandbox
          - name: namespace-controller
            dockerfile: docker/Dockerfile.namespace-controller
            image_suffix: kubeclaw-namespace-controller
          - name: prism-preview
            dockerfile: docker/Dockerfile.prism-preview
            image_suffix: kubeclaw-prism-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYY.MM.DD'}}
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}
      - name: Summary
        run: |
          echo "### ${{ matrix.name }} image pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
  bundle-skills:
    name: Package & Publish Skill Bundles
    runs-on: ubuntu-latest
    needs: [detect-build-inputs, check-base-image]
    if: |
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    env:
      BUNDLE_RELEASE_TAG: agent-code-bundles
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Nova and Buster bundles
        run: |
          mkdir -p dist
          bash ./scripts/package-agent-skill-bundle.sh nova "dist/nova-${GITHUB_SHA}.tgz" "${GITHUB_SHA}"
          bash ./scripts/package-agent-skill-bundle.sh buster "dist/buster-${GITHUB_SHA}.tgz" "${GITHUB_SHA}"
          (
            cd dist
            sha256sum "nova-${GITHUB_SHA}.tgz" "buster-${GITHUB_SHA}.tgz" > "SHA256SUMS-${GITHUB_SHA}.txt"
          )

      - name: Ensure bundle release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$BUNDLE_RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$BUNDLE_RELEASE_TAG" \
              --title "Agent code bundles" \
              --notes "Durable Nova/Buster /app/skills bundle release assets for code deploys."

      - name: Upload bundle assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$BUNDLE_RELEASE_TAG" \
            "dist/nova-${GITHUB_SHA}.tgz#nova-${GITHUB_SHA}.tgz" \
            "dist/buster-${GITHUB_SHA}.tgz#buster-${GITHUB_SHA}.tgz" \
            "dist/SHA256SUMS-${GITHUB_SHA}.txt#SHA256SUMS-${GITHUB_SHA}.txt" \
            --clobber

      - name: Summary
        run: |
          echo "### Skill bundles published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- https://github.com/${{ github.repository }}/releases/download/${BUNDLE_RELEASE_TAG}/nova-${GITHUB_SHA}.tgz" >> $GITHUB_STEP_SUMMARY
          echo "- https://github.com/${{ github.repository }}/releases/download/${BUNDLE_RELEASE_TAG}/buster-${GITHUB_SHA}.tgz" >> $GITHUB_STEP_SUMMARY
          echo "- https://github.com/${{ github.repository }}/releases/download/${BUNDLE_RELEASE_TAG}/SHA256SUMS-${GITHUB_SHA}.txt" >> $GITHUB_STEP_SUMMARY
