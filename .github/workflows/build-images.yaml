name: Build Runtime Images And Skill Bundles
on:
  push:
    branches: [main]
  # Nightly check for base image updates (OpenClaw releases)
  schedule:
    - cron: '0 3 * * *'  # 3am UTC daily
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
jobs:
  detect-build-inputs:
    name: Detect Image Build Inputs
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      image_inputs_changed: ${{ steps.filter.outputs.image_inputs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect image-affecting changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image_inputs:
              - 'docker/**'
              - 'go.mod'
              - 'cmd/buster-namespace-controller/**'
              - 'plugins/openclaw-agent-observer/**'
  check-base-image:
    name: Check pinned OpenClaw base
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify the pinned base is current
        run: |
          set -euo pipefail
          mapfile -t pinned_refs < <(
            sed -n 's/^ARG OPENCLAW_BASE=//p' \
              docker/Dockerfile.general \
              docker/Dockerfile.buster-gateway \
              | sort -u
          )
          if [[ ${#pinned_refs[@]} -ne 1 ]]; then
            echo "OpenClaw Dockerfiles must share one pinned base reference" >&2
            printf 'Found: %s\n' "${pinned_refs[@]}" >&2
            exit 1
          fi
          pinned_ref="${pinned_refs[0]}"
          pinned_digest="${pinned_ref##*@}"
          latest_ref="ghcr.io/openclaw/openclaw:latest"
          latest_digest="$(
            docker buildx imagetools inspect "$latest_ref" \
              | awk '$1 == "Digest:" { print $2; exit }'
          )"
          if [[ ! "$pinned_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid pinned OpenClaw digest: $pinned_digest" >&2
            exit 1
          fi
          if [[ ! "$latest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the current OpenClaw digest" >&2
            exit 1
          fi
          {
            echo "### OpenClaw base image"
            echo ""
            echo "- Pinned: \`$pinned_ref\`"
            echo "- Latest digest: \`$latest_digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$latest_digest" != "$pinned_digest" ]]; then
            echo "Pinned OpenClaw base is out of date; update its version, digest, and Debian snapshot intentionally." >&2
            exit 1
          fi
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: detect-build-inputs
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.detect-build-inputs.outputs.image_inputs_changed == 'true'))
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: general
            dockerfile: docker/Dockerfile.general
            image_suffix: kubeclaw-general
          - name: buster-gateway
            dockerfile: docker/Dockerfile.buster-gateway
            image_suffix: kubeclaw-buster-gateway
          - name: buster-pipeline
            dockerfile: docker/Dockerfile.buster-pipeline
            image_suffix: kubeclaw-buster-pipeline
          - name: namespace-controller
            dockerfile: docker/Dockerfile.namespace-controller
            image_suffix: kubeclaw-namespace-controller
          - name: prism-preview
            dockerfile: docker/Dockerfile.prism-preview
            image_suffix: kubeclaw-prism-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYY.MM.DD'}}
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true
          labels: ${{ steps.meta.outputs.labels }}
      - name: Summary
        run: |
          echo "### ${{ matrix.name }} image pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
  bundle-skills:
    name: Package & Publish Skill Bundles
    runs-on: ubuntu-latest
    needs: detect-build-inputs
    if: |
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    env:
      BUNDLE_RELEASE_TAG: agent-code-bundles
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Nova and Buster bundles
        run: |
          mkdir -p dist
          bash ./scripts/package-agent-skill-bundle.sh nova "dist/nova-${GITHUB_SHA}.tgz" "${GITHUB_SHA}"
          bash ./scripts/package-agent-skill-bundle.sh buster "dist/buster-${GITHUB_SHA}.tgz" "${GITHUB_SHA}"
          (
            cd dist
            sha256sum "nova-${GITHUB_SHA}.tgz" "buster-${GITHUB_SHA}.tgz" > "SHA256SUMS-${GITHUB_SHA}.txt"
          )

      - name: Ensure bundle release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$BUNDLE_RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$BUNDLE_RELEASE_TAG" \
              --title "Agent code bundles" \
              --notes "Durable Nova/Buster /app/skills bundle release assets for code deploys."

      - name: Upload bundle assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$BUNDLE_RELEASE_TAG" \
            "dist/nova-${GITHUB_SHA}.tgz#nova-${GITHUB_SHA}.tgz" \
            "dist/buster-${GITHUB_SHA}.tgz#buster-${GITHUB_SHA}.tgz" \
            "dist/SHA256SUMS-${GITHUB_SHA}.txt#SHA256SUMS-${GITHUB_SHA}.txt" \
            --clobber

      - name: Summary
        run: |
          echo "### Skill bundles published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- https://github.com/${{ github.repository }}/releases/download/${BUNDLE_RELEASE_TAG}/nova-${GITHUB_SHA}.tgz" >> $GITHUB_STEP_SUMMARY
          echo "- https://github.com/${{ github.repository }}/releases/download/${BUNDLE_RELEASE_TAG}/buster-${GITHUB_SHA}.tgz" >> $GITHUB_STEP_SUMMARY
          echo "- https://github.com/${{ github.repository }}/releases/download/${BUNDLE_RELEASE_TAG}/SHA256SUMS-${GITHUB_SHA}.txt" >> $GITHUB_STEP_SUMMARY
