# Buster v2 gateway example.
agentRole: buster

image:
  repository: ghcr.io/datrab/kubeclaw-buster-gateway
  tag: latest
  pullPolicy: Always

auth:
  existingSecret: kubeclaw-shared-secrets
  existingSecretKey: gatewayToken-buster

litellm:
  existingSecret: kubeclaw-shared-secrets
  existingSecretKey: litellmApiKey

discord:
  enabled: true
  existingSecret: kubeclaw-shared-secrets
  existingSecretKey: discordToken-buster
  channelId: ""

agent:
  project: kubecommand
  git:
    enabled: true
    secretName: git-deploy-key-buster
    repoUrl: ""

serviceAccount:
  create: true
  name: agent-buster
  automount: false

busterNamespaceBroker:
  enabled: true

workspace:
  enabled: true

resources:
  requests: { cpu: 500m, memory: 4Gi }
  limits: { cpu: "4", memory: 16Gi }
