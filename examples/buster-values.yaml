# Buster production-style example.
# Deploy: helm upgrade --install agent-buster ./charts/kubeclaw -f examples/buster-values.yaml

agentRole: buster

image:
  repository: ghcr.io/datrab/kubeclaw-general
  tag: latest
  pullPolicy: Always

busterPipeline:
  enabled: true
  image:
    repository: ghcr.io/datrab/kubeclaw-buster-pipeline
    tag: latest
    pullPolicy: Always
  platformCapabilities:
    - rootless_buildkit
  storageSize: 50Gi
  resources:
    requests: { cpu: "2", memory: 8Gi, ephemeral-storage: 8Gi }
    limits: { cpu: "8", memory: 24Gi, ephemeral-storage: 60Gi }

auth:
  existingSecret: kubeclaw-shared-secrets
  existingSecretKey: gatewayToken-buster

litellm:
  existingSecret: kubeclaw-shared-secrets
  existingSecretKey: litellmApiKey

discord:
  enabled: true
  existingSecret: kubeclaw-shared-secrets
  existingSecretKey: discordToken-buster
  channelId: ""

discordWebhook:
  secretName: kubeclaw-shared-secrets
  secretKey: discordWebhook

agent:
  project: kubecommand
  git:
    enabled: true
    secretName: git-deploy-key-buster
    repoUrl: ""

redis:
  secretName: redis-secrets

serviceAccount:
  create: true
  name: agent-buster

busterNamespaceBroker:
  enabled: true

workspace:
  enabled: true

resources:
  requests:
    cpu: 500m
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 16Gi
