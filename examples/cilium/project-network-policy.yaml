# Example project-owned namespace + policy.
#
# Copy this pattern into the project that owns the workload. Project onboarding
# does not require a central Cilium edit or a namespace policy-profile label.
---
apiVersion: v1
kind: Namespace
metadata:
  name: example-project
---
# Every project owns its own isolation baseline. An empty ingress/egress LIST is
# intentional: selecting every endpoint with no allow rules enables default-deny
# in both directions for this namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: project-default-deny
  namespace: example-project
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
# DNS is part of the small reusable project baseline. Keeping it beside the
# project avoids namespace-label-based cluster policy while remaining explicit.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: project-allow-dns
  namespace: example-project
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Add workload-specific CiliumNetworkPolicy objects here. Because these resources
# are namespaced, Argo/Helm/Kustomize can ship policy together with the owning
# project without any central Cilium change.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: example-project-app
  namespace: example-project
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: example-project
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: example-project
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
