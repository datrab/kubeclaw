apiVersion: apps/v1
kind: Deployment
metadata:
  name: real-pipeline-e2e-nginx
  labels:
    app.kubernetes.io/name: real-pipeline-e2e-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: real-pipeline-e2e-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: real-pipeline-e2e-nginx
    spec:
      containers:
        - name: nginx
          image: real-pipeline-e2e-nginx:verification
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: real-pipeline-e2e-nginx
  labels:
    app.kubernetes.io/name: real-pipeline-e2e-nginx
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: real-pipeline-e2e-nginx
  ports:
    - name: http
      port: 80
      targetPort: http
